<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 560 330" width="560" height="330" role="img" aria-labelledby="tarihce-turkce-i-t tarihce-turkce-i-d">
  <title id="tarihce-turkce-i-t">Türkçe dil ayarında i harfi: Python 2 ve Python 3.14</title>
  <desc id="tarihce-turkce-i-d">Üstte Python 2, Türkçe dil ayarı, 2009: kırmızı bir hata satırı, KeyError: 'ROUND_CEiLiNG'; iki küçük i harfi koyu camgöbeği renkte. Altta Python 3.14: print("i".upper(), "ı".upper()) satırı ve çıktısı I I.</desc>
  <!-- source: lore.json L2-03 (Launchpad bug 467397, 2009; CPython Misc/NEWS 2.7.2rc1); the 3.14 output is the 2A slide's (S76) -->
  <defs>
    <style>
.dg{font-family:"Atkinson Hyperlegible Next","Segoe UI",Arial,sans-serif}
.dg .bg{fill:#FFFFFF}
.dg .lb{font-size:24px;font-weight:600;fill:#14172E}
.dg .sub{font-size:24px;font-weight:400;fill:#50566F}
.dg .cd24{font-family:"JetBrains Mono",Menlo,Consolas,"DejaVu Sans Mono",monospace;font-size:24px;font-weight:500;fill:#14172E}
.dg .errt{fill:#C21C20;font-weight:600}
.dg .hi{fill:#0D6385;font-weight:800}
.dg .soft{fill:#F3F4F8;stroke:#D3D7E2;stroke-width:2}
.dg .errbox{fill:#FCEDEE;stroke:#C21C20;stroke-width:2.5}
.dg .outp{fill:#FFFFFF;stroke:#D3D7E2;stroke-width:2}
.dg .pre{white-space:pre}
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="560" height="330"/>
  <text class="lb" x="4" y="28">Python 2, Türkçe dil ayarı</text>
  <text class="sub" x="556" y="28" text-anchor="end">2009</text>
  <rect class="errbox" x="2" y="44" width="556" height="64" rx="6"/>
  <text class="cd24 errt pre" x="22" y="85">KeyError: 'ROUND_CE<tspan class="hi">i</tspan>L<tspan class="hi">i</tspan>NG'</text>
  <text class="lb" x="4" y="164">Python 3.14</text>
  <rect class="soft" x="2" y="180" width="556" height="64" rx="6"/>
  <text class="cd24 pre" x="22" y="221">print("i".upper(), "ı".upper())</text>
  <rect class="outp" x="2" y="256" width="556" height="64" rx="6"/>
  <text class="cd24 pre" x="22" y="297">I I</text>
</svg>
