<svg xmlns="http://www.w3.org/2000/svg" class="doodle" viewBox="0 0 368 300" width="368" height="300" role="img" aria-labelledby="ders1-sinek-kusu-iha-t ders1-sinek-kusu-iha-d">
  <title id="ders1-sinek-kusu-iha-t">Kanat çırpan sinek kuşu İHA</title>
  <desc id="ders1-sinek-kusu-iha-d">Elle çizilmiş gibi basit bir resim: telefonla yönetilen, kanat çırpan sinek kuşu biçiminde küçük bir İHA. Sağ üstte havada duran, çöp adama dönük İHA&#x27;nın uzun bir gagası, yelpaze gibi bir kuyruğu ve sırtında küçük bir devre kartı var; iki kanadı hem yukarıda hem aşağıda çizilmiş, uçlarında hareket çizgileri var. Sol altta bir çöp adam elindeki telefonu İHA&#x27;ya doğru tutuyor; telefondan sinyal dalgaları çıkıyor. Telefondan İHA&#x27;ya giden bir okun yanında telefondan kumanda yazıyor.</desc>
