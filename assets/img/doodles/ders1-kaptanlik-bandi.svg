  <title id="ders1-kaptanlik-bandi-t">Variable bir kaptanlık bandı gibi</title>
  <desc id="ders1-kaptanlik-bandi-d">Elle çizilmiş gibi basit bir resim: sahada turuncu formalı tek bir oyuncu, formasında büyük bir 4. Kolunda lacivert bir kaptanlık bandı var; bandın etiketinde credits yazıyor. Banttan formadaki 4&#x27;e kısa bir ok gidiyor. Arkada bir kale. Üstte credits = 4 kodu yazıyor. Hiçbir yerde kutu yok.</desc>
