  <title id="w3b-yoda-try-t">Yoda ve try</title>
  <desc id="w3b-yoda-try-d">Elle çizilmiş gibi basit bir resim. Solda yeşil başlı, sivri kulaklı, kahverengi cüppeli küçük bir çöp adam bastonuna dayanmış, bir kaşı kalkık; konuşma balonunda &quot;Do. Or do not. There is no try.&quot; yazıyor. Sağda masadaki laptopun ekranında büyük harflerle try: yazıyor; bir alt satırda, içeriden başlayan imleç yazılmayı bekliyor.</desc>
