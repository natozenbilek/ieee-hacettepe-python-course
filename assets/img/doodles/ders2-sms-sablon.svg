  <title id="ders2-sms-sablon-t">f harfi unutulmuş bir SMS</title>
  <desc id="ders2-sms-sablon-d">Elle çizilmiş gibi basit bir resim. Solda büyük bir telefon ekranında tek bir mesaj var: &quot;Sayın {name},&quot;. Sağda bir öğrenci telefonu tutuyor, öbür eliyle başını kaşıyor ve şaşkın bakıyor; konuşma balonunda &quot;{name} kim?&quot; yazıyor. En altta print(&quot;Sayın {name}&quot;) kodu var.</desc>
