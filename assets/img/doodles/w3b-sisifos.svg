<svg xmlns="http://www.w3.org/2000/svg" class="doodle" viewBox="0 0 560 480" width="560" height="480" role="img" aria-labelledby="w3b-sisifos-t w3b-sisifos-d">
  <title id="w3b-sisifos-t">while True ve Sisifos</title>
  <desc id="w3b-sisifos-d">Elle çizilmiş gibi basit bir resim. Soldan sağa inen yeşilimsi bir yamaç var. Camgöbeği tişörtlü, kaşları çatık bir çöp adam yamacın aşağısından, üzerinde while True: yazan büyük gri bir kayayı tepeye doğru itiyor; alnından bir damla ter düşüyor. Yamacın içinde tepeden eteğe inen kavisli bir ok kayanın yeniden başa yuvarlandığını gösteriyor. Sol üstte, tepenin üstünde &quot;tepeye vardı, yine başa&quot; yazıyor.</desc>
