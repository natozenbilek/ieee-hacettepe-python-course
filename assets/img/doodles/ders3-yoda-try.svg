<svg xmlns="http://www.w3.org/2000/svg" class="doodle" viewBox="0 0 560 480" width="560" height="480" role="img" aria-labelledby="ders3-yoda-try-t ders3-yoda-try-d">
  <title id="ders3-yoda-try-t">Yoda ve try</title>
  <desc id="ders3-yoda-try-d">Elle çizilmiş gibi basit bir resim. Solda yeşil başlı, sivri kulaklı, kahverengi cüppeli küçük bir çöp adam bastonuna dayanmış, bir kaşı kalkık; konuşma balonunda &quot;Do. Or do not. There is no try.&quot; yazıyor. Sağda masadaki laptopun ekranında iki satır kod var: try: ve onun altında içeriden başlayan üç nokta.</desc>
