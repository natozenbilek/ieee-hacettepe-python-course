  <title id="ders5-visited-grow-soru-t">add(): tekrar girmez, hata da yok</title>
  <desc id="ders5-visited-grow-soru-d">Üstte kod: trips = ["İtalya", "Fransa", "İtalya"], visited = set(), for country in trips:, visited.add(country), print(len(visited), "Fransa" in visited). Altında dört kare: 1 set() boş bir set (açık yeşil); 2 add("İtalya") sonrası İtalya, çerçeveli; 3 add("Fransa") sonrası İtalya ve Fransa, Fransa çerçeveli; 4 add("İtalya") ve altında soru: hata mı, tekrar mı? Tıklayınca kodun yanında Çıktı 2 True, dördüncü karede set aynı, İtalya ve Fransa; altında: İtalya zaten var: set aynı, hata yok. En altta: Set'e eklemek tekrarları kendiliğinden atar.</desc>
