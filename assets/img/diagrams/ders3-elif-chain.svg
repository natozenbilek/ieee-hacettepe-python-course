<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 1152 480" width="1152" height="480" role="img" aria-labelledby="ders3-elif-chain-t ders3-elif-chain-d">
  <title id="ders3-elif-chain-t">Madde 24'ün ilk satırları: score = 77, adım adım</title>
  <desc id="ders3-elif-chain-d">Solda on iki satırlık kod: score = 77, if score &gt;= 95: print("A1"), elif score &gt;= 90: print("A2"), elif score &gt;= 85: print("A3"), elif score &gt;= 80: print("B1"), elif score &gt;= 75: print("B2"), else: print("75 altı"); sayılar turuncu (int), metinler yeşil (str). Sağda alt alta beş karar baklavası, başta gri ve etiketleri gri: score &gt;= 95, &gt;= 90, &gt;= 85, &gt;= 80, &gt;= 75; her birinin sağında harf kutusu A1, A2, A3, B1, B2 ve puan aralığı 95-100, 90-94, 85-89, 80-84, 75-79. Her tıklamada bir baklava koyulaşır: ilk dördünün False oku aşağı iner ve etiketi kırmızı olur; beşincinin petrol mavisi True oku B2 kutusuna gider (açık mavi, çivit mavisi çerçeveli) ve etiketi petrol mavisi olur. Son tıklamada en alttaki 75 altı kutusunun yanında atlandı yazar.</desc>
  <!-- source: score = 77 -&gt; B2 (Python 3.14.8, 2026-10-22); bands from the Hacettepe regulation, Madde 24 (Resmi Gazete, 30 Temmuz 2025). Build steps: 0-3 the four False conditions, 4 the True one, 5 else skipped -->
