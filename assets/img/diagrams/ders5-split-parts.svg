.dg .cellh{fill:#EFF0F7;fill:var(--d-tint,#EFF0F7);stroke:#14172E;stroke:var(--d-ink,#14172E);stroke-width:2}
.dg .cellhl{fill:#C8E7F3;fill:var(--d-hl,#C8E7F3);stroke:#3B4595;stroke:var(--d-brand,#3B4595);stroke-width:3}
.dg .name{fill:#181C3E;fill:var(--d-name,#181C3E)}
.dg .soft{fill:#F3F4F8;fill:var(--d-surface,#F3F4F8)}
.dg .outp{fill:#FFFFFF;fill:var(--d-paper,#FFFFFF);stroke:#D3D7E2;stroke:var(--d-rule,#D3D7E2);stroke-width:2}
.dg .tint{fill:#EFF0F7;fill:var(--d-tint,#EFF0F7);stroke:#14172E;stroke:var(--d-ink,#14172E);stroke-width:2.5}
.dg .hl{fill:#C8E7F3;fill:var(--d-hl,#C8E7F3)}
.dg .emph{fill:none;stroke:#3B4595;stroke:var(--d-brand,#3B4595);stroke-width:3}
.dg .errbox{fill:#FCEDEE;fill:var(--d-err-bg,#FCEDEE);stroke:#C21C20;stroke:var(--d-err,#C21C20);stroke-width:2.5}
.dg .errdash{fill:none;stroke:#C21C20;stroke:var(--d-err,#C21C20);stroke-width:2.5;stroke-dasharray:8 6}
.dg .okbox{fill:#E9F6FA;fill:var(--d-ok-bg,#E9F6FA);stroke:#0D6385;stroke:var(--d-ok,#0D6385);stroke-width:2.5}
.dg .key{fill:#FFFFFF;fill:var(--d-paper,#FFFFFF);stroke:#767C95;stroke:var(--d-muted,#767C95);stroke-width:2}
.dg .dot{fill:#3B4595;fill:var(--d-brand,#3B4595)}
.dg .dot0{fill:#FFFFFF;fill:var(--d-paper,#FFFFFF);stroke:#3B4595;stroke:var(--d-brand,#3B4595);stroke-width:3}
.dg .ar,.dg .ld,.dg .axis{fill:none;stroke:#14172E;stroke:var(--d-ink,#14172E)}
.dg .ar,.dg .axis{stroke-width:2.5}
.dg .ld{stroke-width:2}
.dg .ar-m{fill:none;stroke:#767C95;stroke:var(--d-muted,#767C95);stroke-width:2.5}
.dg .ar-old{fill:none;stroke:#767C95;stroke:var(--d-muted,#767C95);stroke-width:2.5;stroke-dasharray:8 6}
.dg .ar-ok{fill:none;stroke:#0D6385;stroke:var(--d-ok,#0D6385);stroke-width:2.5}
.dg .ar-err{fill:none;stroke:#C21C20;stroke:var(--d-err,#C21C20);stroke-width:2.5}
.dg .sep{fill:none;stroke:#D3D7E2;stroke:var(--d-rule,#D3D7E2);stroke-width:2}
.dg .dash{fill:none;stroke:#3B4595;stroke:var(--d-brand,#3B4595);stroke-width:2;stroke-dasharray:8 6}
.dg .ah{fill:#14172E;fill:var(--d-ink,#14172E)}
.dg .ah-m{fill:#767C95;fill:var(--d-muted,#767C95)}
.dg .ah-ok{fill:#0D6385;fill:var(--d-ok,#0D6385)}
.dg .ah-err{fill:#C21C20;fill:var(--d-err,#C21C20)}
.dg .co{fill:#14172E;fill:var(--d-ink,#14172E)}
.dg .co-t{fill:#FFFFFF;fill:var(--d-bg,#FFFFFF);font-size:24px;font-weight:700;text-anchor:middle}
.dg .sec{stroke:#3B4595;stroke:var(--d-second,#3B4595)}
/* dg v4 type renkleri · authoring/DIAGRAMS.md §10'dan aynen kopyalanır (dg v3 bloğundan sonra) */
.dg rect.t-int,.dg path.t-int,.dg circle.t-int{fill:#F2CEB3;fill:var(--t-int-bg,#F2CEB3);stroke:#854B00;stroke:var(--t-int,#854B00)}
.dg text.t-int,.dg tspan.t-int{fill:#613109;fill:var(--t-int-tx,#613109)}
.dg rect.t-float,.dg path.t-float,.dg circle.t-float{fill:#FFF1C6;fill:var(--t-float-bg,#FFF1C6);stroke:#9F7000;stroke:var(--t-float,#9F7000)}
.dg text.t-float,.dg tspan.t-float{fill:#5D420E;fill:var(--t-float-tx,#5D420E)}
.dg rect.t-bool,.dg path.t-bool,.dg circle.t-bool{fill:#C4E9E1;fill:var(--t-bool-bg,#C4E9E1);stroke:#0E7A6D;stroke:var(--t-bool,#0E7A6D)}
.dg text.t-bool,.dg tspan.t-bool{fill:#0A473F;fill:var(--t-bool-tx,#0A473F)}
.dg rect.t-str,.dg path.t-str,.dg circle.t-str{fill:#D9F6DD;fill:var(--t-str-bg,#D9F6DD);stroke:#296A3B;stroke:var(--t-str,#296A3B)}
.dg text.t-str,.dg tspan.t-str{fill:#1A4B28;fill:var(--t-str-tx,#1A4B28)}
.dg rect.t-none,.dg path.t-none,.dg circle.t-none{fill:#F6F3EF;fill:var(--t-none-bg,#F6F3EF);stroke:#534C45;stroke:var(--t-none,#534C45)}
.dg text.t-none,.dg tspan.t-none{fill:#413C38;fill:var(--t-none-tx,#413C38)}
.dg rect.t-list,.dg path.t-list,.dg circle.t-list{fill:#F3C8DB;fill:var(--t-list-bg,#F3C8DB);stroke:#8A2B60;stroke:var(--t-list,#8A2B60)}
.dg text.t-list,.dg tspan.t-list{fill:#651E45;fill:var(--t-list-tx,#651E45)}
.dg rect.t-tuple,.dg path.t-tuple,.dg circle.t-tuple{fill:#E3EAF2;fill:var(--t-tuple-bg,#E3EAF2);stroke:#4A6378;stroke:var(--t-tuple,#4A6378)}
.dg text.t-tuple,.dg tspan.t-tuple{fill:#2C3E4F;fill:var(--t-tuple-tx,#2C3E4F)}
.dg rect.t-dict,.dg path.t-dict,.dg circle.t-dict{fill:#DBCEC4;fill:var(--t-dict-bg,#DBCEC4);stroke:#4F2611;stroke:var(--t-dict,#4F2611)}
.dg text.t-dict,.dg tspan.t-dict{fill:#4C2817;fill:var(--t-dict-tx,#4C2817)}
.dg rect.t-set,.dg path.t-set,.dg circle.t-set{fill:#F2F8D6;fill:var(--t-set-bg,#F2F8D6);stroke:#747C42;stroke:var(--t-set,#747C42)}
.dg text.t-set,.dg tspan.t-set{fill:#3F4418;fill:var(--t-set-tx,#3F4418)}
.dg rect.boxhl,.dg path.boxhl,.dg rect.cellhl{fill:#C8E7F3;fill:var(--d-hl,#C8E7F3);stroke:#3B4595;stroke:var(--d-brand,#3B4595)}
/* kod PyCharm gibi: JetBrains Mono ligature'ları kapalı (>= iki karakter kalır) */
.dg .cd,.dg .cd24,.dg .ty,.dg .nm{font-variant-ligatures:none;font-feature-settings:"liga" 0,"calt" 0}
/* ders5-split-parts: data-state="split" (varsayılan, S78, 1. tur), "dict" (S86, 2. turun sonu); yerler iki durumda aynı */
.fd .fd-d{display:none}
.fd[data-state="dict"] .fd-d{display:inline}
.fd[data-state="dict"] .fd-s,.fd[data-state="dict"] .fd-c{display:none}
.dg .fd-mname{fill:#767C95;fill:var(--d-muted,#767C95)}
    </style>
  </defs>
  <rect class="bg" width="1152" height="290"/>
  <!-- row 1: one line, strip(), split(";"); split shows pass 1, dict shows pass 2 -->
  <rect class="box t-str" x="4" y="20" width="226" height="52" rx="6"/>
  <path class="ar" d="M230,46 H356" marker-end="url(#ders5-split-parts-ah)"/>
  <text class="cd24 mid" x="294" y="34">strip()</text>
  <rect class="box t-str" x="359" y="20" width="214" height="52" rx="6"/>
  <path class="ar" d="M573,46 H735" marker-end="url(#ders5-split-parts-ah)"/>
  <text class="cd24 mid" x="654" y="34">split(";")</text>
  <rect class="box t-list" x="738" y="20" width="322" height="52" rx="6"/>
  <text class="ty t-list" x="1072" y="54">list</text>
  <g class="fd-s">
  <text class="cd24 mid t-str" x="117" y="54">'MAT123;4;C1\n'</text>
  <text class="cd24 mid t-str" x="466" y="54">'MAT123;4;C1'</text>
  <text class="cd24 mid t-list" x="899" y="54">['MAT123', '4', 'C1']</text>
  </g>
  <!-- row 2: unpacking into three names; each value is a str -->
  <g>
  <path class="ar" d="M760,72 V101" marker-end="url(#ders5-split-parts-ah)"/>
  <rect class="name" x="710" y="104" width="100" height="52" rx="6"/>
  <text class="nm mid" x="760" y="140">code</text>
  <path class="ar" d="M760,156 V185" marker-end="url(#ders5-split-parts-ah)"/>
  <rect class="box t-str" x="690" y="188" width="140" height="52" rx="6"/>
  <text class="ty mid t-str" x="760" y="268">str</text>
  </g>
  <g class="fd-c">
  <path class="ar" d="M905,72 V101" marker-end="url(#ders5-split-parts-ah)"/>
  <rect class="name" x="830" y="104" width="150" height="52" rx="6"/>
  <text class="nm mid" x="905" y="140">credits</text>
  <path class="ar" d="M905,156 V185" marker-end="url(#ders5-split-parts-ah)"/>
  <rect class="boxhl fd-s" x="863" y="182" width="84" height="64" rx="10"/>
  <rect class="box t-str" x="869" y="188" width="72" height="52" rx="6"/>
  </g>
  <g>
  <path class="ar" d="M1040,72 V101" marker-end="url(#ders5-split-parts-ah)"/>
  <rect class="name" x="1010" y="104" width="116" height="52" rx="6"/>
  <text class="nm mid" x="1068" y="140">grade</text>
  <path class="ar" d="M1068,156 V185" marker-end="url(#ders5-split-parts-ah)"/>
  <rect class="box t-str" x="1024" y="188" width="88" height="52" rx="6"/>
  <text class="ty mid t-str" x="1068" y="268">str</text>
  </g>
  <g class="fd-s">
  <text class="cd24 mid t-str" x="760" y="222">'MAT123'</text>
  <text class="cd24 mid t-str" x="905" y="222">'4'</text>
  <text class="cd24 mid t-str" x="1068" y="222">'C1'</text>
  </g>
  <text class="tx sub mid" x="905" y="270">hala str</text>
  <!-- the conversion the code makes: int(credits) * 2 is an int -->
  <text class="cd24" x="296" y="222">int(credits) * 2</text>
  <path class="ar" d="M532,214 H577" marker-end="url(#ders5-split-parts-ah)"/>
  <rect class="box t-int" x="580" y="188" width="60" height="52" rx="6"/>
  <text class="cd24 mid t-int" x="610" y="222">8</text>
  <text class="ty mid t-int" x="610" y="268">int</text>
</svg>
