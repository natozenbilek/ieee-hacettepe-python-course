<svg xmlns="http://www.w3.org/2000/svg" class="dg fd" viewBox="0 0 1152 290" width="1152" height="290" role="img" aria-labelledby="ders5-split-parts-t ders5-split-parts-d">
  <title id="ders5-split-parts-t">Satırı strip() ve split(";") ile parçalamak</title>
  <desc id="ders5-split-parts-d">Soldan sağa: 'MAT123;4;C1
' satırı (str, yeşil), strip() oku, sonundaki 
'i silinmiş 'MAT123;4;C1' (str, yeşil), split(";") oku, üç parçalı list ['MAT123', '4', 'C1'] (vişneçürüğü, list etiketi). list'ten üç ok code, credits ve grade isimlerine (lacivert) iner; code 'MAT123', credits '4', grade 'C1' gösterir, üçü de str (yeşil, altında str). '4' açık mavi bant ve çivit mavisi çerçeve içinde, altında hala str yazar. Solda int(credits) * 2 bir int (turuncu) verir: 8.</desc>
  <!-- source: line.strip().split(';') -> ['MAT123', '4', 'C1'] (run split; Python 3.14.8, 2026-10-11). 2026-10-15 review: the split state of ders5-file-to-dict.svg as its own file for ders5 S116, where the code is typeset above it and its output (MAT123 8 C1 / FIZ127 6 B2) sits beside the code, so the drawing has no output panel; ders5-file-to-dict.svg keeps both states for S125. -->
  <defs>
    <marker id="ders5-split-parts-ah" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah" d="M0,0 L12,6 L0,12 z"/></marker>
    <marker id="ders5-split-parts-ahm" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah-m" d="M0,0 L12,6 L0,12 z"/></marker>
    <style>
/* dg v3 · IEEE Hacettepe Python diyagram stili · authoring/DIAGRAMS.md'den aynen kopyalanır */
.dg{font-family:"Atkinson Hyperlegible Next","Segoe UI",Arial,sans-serif}
.dg .bg{fill:#FFFFFF;fill:var(--d-bg,#FFFFFF)}
.dg .tx,.dg .lb,.dg .ti,.dg .cd,.dg .cd24{fill:#14172E;fill:var(--d-ink,#14172E)}
.dg .tx{font-size:24px;font-weight:400}
.dg .lb{font-size:24px;font-weight:600}
.dg .ti{font-size:28px;font-weight:700}
.dg .cd,.dg .cd24,.dg .ty,.dg .nm{font-family:"JetBrains Mono",Menlo,Consolas,"DejaVu Sans Mono",monospace;font-weight:500}
.dg .cd{font-size:28px}
.dg .cd24{font-size:24px}
