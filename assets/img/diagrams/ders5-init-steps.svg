  <title id="ders5-init-steps-t">__init__ adım adım</title>
  <desc id="ders5-init-steps-d">Üç adım, tek satır için: d = Course(&quot;MAT123&quot;, 4, &quot;C1&quot;); &quot;MAT123&quot; ve &quot;C1&quot; str (yeşil), 4 int (turuncu). 1, boş object: içi boş bir Course object'i. 2, __init__ çalışır: __init__ çerçevesinde lacivert self, code, credits ve grade etiketleri var; self aynı object'i gösteriyor; object'in içinde code &quot;MAT123&quot;ü, credits 4'ü, grade &quot;C1&quot;i gösteriyor; çerçevedeki code, credits ve grade etiketleri de aynı üç value'yu gösteriyor. 3, d bağlanır: çerçeve yok, lacivert d etiketi dolu object'i gösteriyor. all durumunda (S41) d'nin oku çivit mavisi çerçeveli açık mavi bantta. self durumunda (S43) 2. adımda self'in oku açık mavi bantta, 1. ve 3. adım gri.</desc>
