<svg xmlns="http://www.w3.org/2000/svg" class="dg tr" viewBox="0 0 1152 470" width="1152" height="470" role="img" aria-labelledby="ders5-target-run-t ders5-target-run-d">
  <title id="ders5-target-run-t">Ders 5'in hedef programı: transcript.txt ve Run penceresi</title>
  <desc id="ders5-target-run-d">Solda transcript.txt dosyası, altı satır (str, yeşil): MAT123;4;C1, FIZ127;3;B2, BBM101;3;F3, TKD103;2;A2, BBM101;3;A3, BBM102;3;. İki BBM101 satırı çivit mavisi çerçeveli; altında BBM101 iki kez yazıyor (F3 ve A3). BBM102 satırında harf notu yok; yanında notu yok yazıyor. Sağda Run penceresi, yedi satır: 5 ders, 1 devam ediyor, 4 bölüm, AGNO: 3.08 (açık mavi bant ve çivit mavisi çerçeveyle vurgulu); MAT123 4 C1 True; FIZ127 3 B2 True; BBM101 3 A3 True (yanında son not); TKD103 2 A2 True; BBM102 3 devam ediyor; AGNO: 3.08. Varsayılan durumda (dersin başı) Run penceresinin sağ üstünde Önizleme etiketi var. final durumunda (finaldeki canlı kurulum) bu etiket gizli, yeri boş kalır; resmin geri kalanı aynıdır.</desc>
  <!-- source: authoring/targets/target5.py run by run_targets.py next to transcript.txt (six lines, the last 'BBM102;3;'): seven printed lines, the first '5 ders, 1 devam ediyor, 4 bölüm, AGNO: 3.08' (Python 3.14.8, 2026-10-13). States by data-state on the root <svg>: none (S3, preview, the default) and final (S149; only the Önizleme tag is hidden, its slot stays empty). -->
