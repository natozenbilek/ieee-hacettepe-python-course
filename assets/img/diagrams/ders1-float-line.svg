<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 1152 240" width="1152" height="240" role="img" aria-labelledby="ders1-float-line-t ders1-float-line-d">
  <title id="ders1-float-line-t">float: noktalı sayılar</title>
  <desc id="ders1-float-line-d">int sayı doğrusuyla aynı eksen, -3'ten 3'e. Tam sayılarda nokta yok; üç noktalı sayı hardal sarısı noktalarla işaretli: -0.25 (-1 ile 0 arasında), 2.0 (2'nin tam üstünde) ve 2.5 (2 ile 3 arasında), her biri kendi value kutusunda (float, hardal sarısı). 2.0 açık mavi, çivit mavisi çerçeveli bir şeritte vurgulu; yanında float ve tam sayı gibi görünür, float'tır yazıyor.</desc>
  <!-- source: print(type(2.0), type(-0.25), 2.0) -&gt; &lt;class 'float'&gt; &lt;class 'float'&gt; 2.0; type(2.5) -&gt; &lt;class 'float'&gt; (Python 3.14.8, 2026-10-10) -->
