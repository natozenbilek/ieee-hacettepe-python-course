<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 1152 420" width="1152" height="420" role="img" aria-labelledby="ders3-if-vs-while-t ders3-if-vs-while-d">
  <title id="ders3-if-vs-while-t">if ve while: aynı gövde</title>
  <desc id="ders3-if-vs-while-d">İki izlenmiş akış şeması yan yana. Solda if: kod x = 3, if x &gt; 0:, print(x), x = x - 1; 3, 0 ve 1 turuncu (int). Akış: x = 3, x &gt; 0 baklavası, petrol mavisi True oku print(x) kutusuna, sonra x = x - 1, sonra aşağı Bitir; başa dönen ok yok. False oku gri, kullanılmadı. Çıktı: 3. Sağda while: aynı kod, if yerine while x &gt; 0:. Aynı akış, ama x = x - 1 kutusundan baklavanın sol köşesine dönen bir ok var; ok açık mavi, çivit mavisi çerçeveli bantta, yanında başa dön. Kırmızı False oku Bitir'e gider. Çıktı: 3, 2, 1.</desc>
  <!-- source: ifx: x = 3; if x &gt; 0: print(x); x = x - 1 -&gt; 3; whilex: same with while -&gt; 3 / 2 / 1 (Python 3.14.8, 2026-10-10) -->
  <defs>
    <marker id="ders3-if-vs-while-ah" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah" d="M0,0 L12,6 L0,12 z"/></marker>
    <marker id="ders3-if-vs-while-ahm" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah-m" d="M0,0 L12,6 L0,12 z"/></marker>
