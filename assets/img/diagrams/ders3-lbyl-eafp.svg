<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 560 470" width="560" height="470" role="img" aria-labelledby="ders3-lbyl-eafp-t ders3-lbyl-eafp-d">
  <title id="ders3-lbyl-eafp-t">LBYL ve EAFP: i = 6</title>
  <desc id="ders3-lbyl-eafp-d">İki küçük akış, i = 6 ve code = &quot;BBM101&quot; için. Üstte LBYL: önce bak. Karar baklavasında i &lt; len(code); altında değerler: 6 &lt; 6 (iki 6 da turuncu, int). Kırmızı False oku print(&quot;Böyle ...&quot;) kutusuna iniyor. True oku gri ve soluk, çalışmayan print(code[i]) kutusuna gidiyor. Altta EAFP: önce dene. Kesikli try çerçevesinde print(code[i]); ondan kırmızı bir ok iniyor, yanında açık mavi vurgulu, kırmızı IndexError yazıyor; ok kesikli except IndexError çerçevesindeki print(&quot;Böyle ...&quot;) kutusuna gidiyor. En altta: aynı çıktı: Böyle bir indis yok. İki yol da aynı satırı yazıyor.</desc>
  <!-- source: ders3-B.md S82 code (lore.json L3-05 demo); code = "BBM101", i = 6: 6 < 6 is False, code[6] raises IndexError; output Böyle bir indis yok. twice (run eafp, Python 3.14.8, 2026-10-11) -->
  <defs>
    <marker id="ders3-lbyl-eafp-ahm" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah-m" d="M0,0 L12,6 L0,12 z"/></marker>
    <marker id="ders3-lbyl-eafp-aherr" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah-err" d="M0,0 L12,6 L0,12 z"/></marker>
