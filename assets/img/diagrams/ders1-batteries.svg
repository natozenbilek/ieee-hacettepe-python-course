<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 560 440" width="560" height="440" role="img" aria-labelledby="ders1-batteries-t ders1-batteries-d">
  <title id="ders1-batteries-t">Python 3.14: pilleri içinde</title>
  <desc id="ders1-batteries-d">Üstü açık bir kutu, çivit mavisi çerçeveli; kutunun önünde Python 3.14 yazıyor. Kutunun içinde Python'la gelen sekiz hazır araç küçük kutucuklar halinde duruyor: üst sırada math, random ve turtle, ortada datetime, json ve csv, altta statistics ve sys. Üst sıra açık mavi, çivit mavisi çerçeveli bir bandın içinde; üstteki kursta kullanacaklarımız yazısından bu banda bir ok iniyor. Kutunun altında Python'la gelen hazır araç: 194 yazıyor. Sağ üst köşede 0 TL yazan bir fiyat etiketi, altında açık kaynak. En altta kaynak satırı: python.org/about; Python 3.14 Tutorial 10.12; sys.stdlib_module_names, 3.14.8.</desc>
  <!-- source: python.org/about (OSI approved open source licence, free to use and distribute); The Python Tutorial 10.12 Batteries Included; on 3.14.8: len([m for m in sys.stdlib_module_names if not m.startswith('_')]) is 194 of 297; math, random, turtle, datetime, json, csv, statistics and sys are all in sys.stdlib_module_names (Python 3.14.8, 2026-10-11) -->
  <defs>
