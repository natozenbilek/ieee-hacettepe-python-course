  <title id="ders4-list-of-tuples-t">Tuple'lardan oluşan list</title>
  <desc id="ders4-list-of-tuples-d">base durumu: solda kod transcript = [("MAT123", 4, "C1"), ("FIZ127", 3, "B2")], total = 0, for code, credits, letter in transcript:, total += credits, print(total); çıktı 7. Sağda transcript ismi (lacivert) iki tuple'lık (mavi-gri) bir list'i (vişneçürüğü) gösteriyor: index 0'da "MAT123", 4, "C1"; index 1'de "FIZ127", 3, "B2". Altta izleme tablosu, sütunlar tur, code, credits, letter, total: tur 1'de "MAT123", 4, "C1", total 4; tur 2'de "FIZ127", 3, "B2", total 7; 7 vurgulu. problem durumunda kod backup = transcript ve backup.append(("BBM101", 3, "A3")) ile print(len(transcript)); çıktı 3. List'te üç tuple var, yeni BBM101 satırı açık mavi, çivit mavisi çerçeveli; solda altta backup ismi soluk ve oksuz.</desc>
  <!-- source: base -> 7 (total 4, 7); problem: backup = transcript; backup.append(("BBM101", 3, "A3")); print(len(transcript)) -> 3 (Python 3.14.8, 2026-10-10). States: base (S60), problem (S67). -->
