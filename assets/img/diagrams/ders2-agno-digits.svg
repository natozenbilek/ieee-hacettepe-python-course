  <title id="ders2-agno-digits-t">AGNO: 2 basamak ve fazlası</title>
  <desc id="ders2-agno-digits-d">2.9444444444444446 (float, hardal sarısı) değeri yan yana 18 hardal sarısı kutuda, her karakter bir kutuda: 2, nokta, sonra 16 basamak. Noktadan sonraki ilk iki basamak, 9 ve 4, düz bir ayraçla işaretli: 2 basamak. Kalan 14 basamak kesik çizgili bir ayraçla işaretli: fazlası. Altta type etiketi float. Kaynak satırı: Hacettepe Ü. Ön Lisans ve Lisans Eğitim-Öğretim ve Sınav Yönetmeliği, Madde 25/3.</desc>
