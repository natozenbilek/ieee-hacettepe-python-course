<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 1152 340" width="1152" height="340" role="img" aria-labelledby="ders2-infinite-loop-t ders2-infinite-loop-d">
  <title id="ders2-infinite-loop-t">Infinite loop: güncellemesi olmayan while</title>
  <desc id="ders2-infinite-loop-d">Solda güncellemesi olmayan bir while loop'un akış şeması. i = 3 kutusu (3 int, turuncu) devam şartı i &gt; 0 yazan baklava biçimine girer. Petrol mavisi True oku block'a gider; block'ta yalnızca print(i) var, altında i = i - 1 satırının durduğu yerde boş, kırmızı kesik çizgili bir kutu ve kırmızı güncelleme yok yazısı. Block'un sonundan çıkan ok yukarıdan dolaşıp şarta geri döner; bu geri dönen ok açık mavi bant ve çivit mavisi çerçeveyle vurgulu. Şart her turda yine True olur, çünkü i hep 3. Gri False oku soluk bir Bitir kutusuna iner, yanında hiç gelinmez yazar. Sağda Run penceresi: art arda yedi satır 3 ve en altta üç nokta, yani çıktı durmadan sürer; pencerenin sol üst köşesinde kırmızı kare Stop düğmesi, 1 numaralı işaret ve Stop yazısı.</desc>
  <!-- source: ders2-B.md S57; i = 3 / while i &gt; 0: / print(i) prints 3 on every line, still running after 0.5 s (Python 3.14.8, 2026-10-11) -->
  <defs>
    <marker id="ders2-infinite-loop-ah" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah" d="M0,0 L12,6 L0,12 z"/></marker>
    <marker id="ders2-infinite-loop-ahm" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah-m" d="M0,0 L12,6 L0,12 z"/></marker>
    <marker id="ders2-infinite-loop-ahok" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah-ok" d="M0,0 L12,6 L0,12 z"/></marker>
