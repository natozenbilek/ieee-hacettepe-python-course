<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 1152 400" width="1152" height="400" role="img" aria-labelledby="ders3-elif-order-t ders3-elif-order-d">
  <title id="ders3-elif-order-t">elif sırası: score = 92</title>
  <desc id="ders3-elif-order-d">İki sütun, ikisi de score = 92 (turuncu, int) için izlenmiş. Solda Yanlış sıra: kod score = 92, if score &gt;= 50: print("D"), elif score &gt;= 90: print("A2"). score &gt;= 50 baklavasından petrol mavisi True oku print("D") kutusuna gider, kutu açık mavi ve çivit mavisi çerçeveli; score &gt;= 90 baklavası ve print("A2") gri, yanında hiç sınanmadı. Çıktı: D. Kırmızı çerçeveli kutuda kırmızı: ilk True kazanır: 92 için D. Sağda Doğru sıra: iki condition yer değiştirmiş; score &gt;= 90 baklavasından True oku print("A2") kutusuna gider (vurgulu); score &gt;= 50 baklavası ve print("D") gri. Çıktı: A2.</desc>
  <!-- source: elif_wrong: score = 92 -&gt; D; elif_right -&gt; A2 (Python 3.14.8, 2026-10-10) -->
