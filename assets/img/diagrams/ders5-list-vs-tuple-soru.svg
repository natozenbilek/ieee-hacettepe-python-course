  <title id="ders5-list-vs-tuple-soru-t">List ve tuple: hangisi?</title>
  <desc id="ders5-list-vs-tuple-soru-d">Solda list [ ]: order ismi [latte, mocha, filtre] list'ini gösteriyor; çok sayıda benzer item, mutable, bir masanın siparişleri. Sağda tuple ( ): coffee ismi ("latte", "orta", 85) tuple'ını gösteriyor; sabit alanlı tek kayıt, immutable, menüden bir satır. Altta soru: ballon_dor list mi olmalı, tuple mı? Tıklayınca: list: Messi yeni bir ödül alırsa append() ile büyür.</desc>
