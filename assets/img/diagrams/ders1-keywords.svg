<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 1152 412" width="1152" height="412" role="img" aria-labelledby="ders1-keywords-t ders1-keywords-d">
  <title id="ders1-keywords-t">Python'un keyword'leri</title>
  <desc id="ders1-keywords-d">Çizilmiş bir panel. Üstte example.py'deki satır: help("keywords"); bir çizginin altında Run penceresine yazılanlar. Altında Python'un yazdığı başlık: Here is a list of the Python keywords.  Enter any keyword to get more help. Sonra dört sütunlu on satırda 37 keyword, Python'un yazdığı sırayla: False, class, global, pass, None, continue, if, raise, True, def, import, return, and, del, in, try, as, elif, is, while, assert, else, lambda, with, async, except, match, yield, await, finally, nonlocal, break, for, not, case, from, or. Bunlardan dokuzu çivit mavisi bir çerçeveyle çevrili: if, and, in, elif, while, else, for, not, or; while'ın yanındaki not: Ders 2-3'te göreceklerimiz.</desc>
