<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 1152 426" width="1152" height="426" role="img" aria-labelledby="ders5-method-errors-t ders5-method-errors-d">
  <title id="ders5-method-errors-t">self ve TypeError</title>
  <desc id="ders5-method-errors-d">İki satır. Üst satır: kod class Greeting:, def say(): (boş parantezler çivit mavisi halkayla işaretli), print("Selam") ve Greeting().say(). Çağrıdan çıkan ok bir Greeting object'ini say çerçevesine taşıyor; çerçevede onu alacak parameter yok, yerinde kırmızı çerçeveli bir soru işareti ve yer yok yazısı. Kırmızı hata satırı: TypeError: Greeting.say() takes 0 positional arguments but 1 was given. Alt satır: kod k = PiggyBank() ve k.deposit(k, 100); parantez içindeki k çivit mavisi halkayla işaretli. deposit çerçevesinde iki lacivert yer var: self ve amount. PiggyBank object'i self'e bir kez Python verir okuyla, amount'a bir kez de elle yazılan k olarak kırmızı okla gidiyor; 100 (int, turuncu) için üçüncü yer yok, kırmızı kesikli soru işareti. Kırmızı hata satırı: TypeError: PiggyBank.deposit() takes 2 positional arguments but 3 were given.</desc>
  <!-- source: ders5-B S69; runs noself_method (line 5: TypeError: Greeting.say() takes 0 positional arguments but 1 was given) and extra_self (PiggyBank with __init__ and deposit above, line 9: TypeError: PiggyBank.deposit() takes 2 positional arguments but 3 were given) (Python 3.14.8, 2026-10-11) -->
  <defs>
    <marker id="ders5-method-errors-ah" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah" d="M0,0 L12,6 L0,12 z"/></marker>
