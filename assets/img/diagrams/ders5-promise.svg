  <title id="ders5-promise-t">5B'nin hedefi: transcript.txt'den report.txt'ye</title>
  <desc id="ders5-promise-d">Solda transcript.txt dosyası, altı satır (str, yeşil): MAT123;4;C1, FIZ127;3;B2, BBM101;3;F3, TKD103;2;A2, BBM101;3;A3, BBM102;3;. Dosyadan ortadaki program kutusuna bir ok gidiyor; okun üstünde open(), altında okur yazıyor. Programdan report.txt dosyasına ikinci bir ok gidiyor; üstünde write(), altında yazar. report.txt'de altı satır var (str, yeşil): MAT123 4 C1 True, FIZ127 3 B2 True, BBM101 3 A3 True, TKD103 2 A2 True, BBM102 3 devam ediyor ve AGNO: 3.08. report.txt açık mavi zeminde, çivit mavisi çerçeveli. Altta: Program bitince report.txt diskte kalır.</desc>
  <!-- source: authoring/targets/target5.py run next to transcript.txt (six lines) -> report.txt 'MAT123 4 C1 True\nFIZ127 3 B2 True\nBBM101 3 A3 True\nTKD103 2 A2 True\nBBM102 3 devam ediyor\nAGNO: 3.08\n' (Python 3.14.8, 2026-10-13) -->
