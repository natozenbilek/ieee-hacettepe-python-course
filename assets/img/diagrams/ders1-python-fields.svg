<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 1152 420" width="1152" height="420" role="img" aria-labelledby="ders1-python-fields-t ders1-python-fields-d">
  <title id="ders1-python-fields-t">Python'un karşınıza çıktığı dört alan</title>
  <desc id="ders1-python-fields-d">Dört kutu. Data ve görüntü, yanında ortası karanlık çivit mavisi bir halka: ilk kara delik görüntüsü, 2019; son görüntüyü Matplotlib çizdi. Sinyal işleme, yanında tepeleri gittikçe büyüyüp sıklaşan bir dalga: LIGO, kütleçekim dalgaları, 2015; data'yı işleyen yazılımda NumPy. Raspberry Pi ve sensör, açık mavi, çivit mavisi çerçeveli kutuda; yanında küçük bir kart, bir sensör karesi ve 8'e 8 LED noktasından bir gülen yüz: ISS'teki Astro Pi bilgisayarları sensör okur, LED'de resim gösterir. Otomasyon, yanında üç satırlı bir file simgesi: not raporunu dosyaya yazan programı Ders 5'te yazacaksınız. Kaynaklar: Harris vd., Nature 585 (2020); Abbott vd., PRL 116 (2016); ESA Education, Astro Pi is ten (2025).</desc>
