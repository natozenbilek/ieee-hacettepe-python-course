<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 1152 420" width="1152" height="420" role="img" aria-labelledby="ders3-insulin-chains-t ders3-insulin-chains-d">
  <title id="ders3-insulin-chains-t">İnsülin bir str olarak: B ve A zincirleri</title>
  <desc id="ders3-insulin-chains-d">Lacivert insulin ismi bir okla 110 harflik bir str'i gösteriyor (yeşil, altında str yazıyor), iki satır halinde: MALWMRLLPLLALLALWGPDPAAAFVNQHLCGSHLVEALYLVCGERGFFYTPKTR / REAEDLQVGQVELGGGPGAGSLQPLALEGSLQKRGIVEQCCTSICSLYQLENYCN. B zincirinin harfleri (index 24'ten 53'e, FVNQHLCGSHLVEALYLVCGERGFFYTPKT) çivit mavisi kalın bir çizgiyle, A zincirinin harfleri (index 89'dan 109'a, GIVEQCCTSICSLYQLENYCN) ince koyu bir çizgiyle altı çizili. Ortada 0'dan 110'a sınır ekseni; sınır numaraları 0, 24, 54, 89, 110. 24 ile 54 arasında açık mavi, çivit mavisi çerçeveli şerit: B zinciri, insulin[24:54]. 89 ile 110 arasında açık çivit şerit: A zinciri, insulin[89:]. Altta iki ayrı str (yeşil), oklarla: "FVNQHLCGSHLVEALYLVCGERGFFYTPKT" ve "GIVEQCCTSICSLYQLENYCN". Kaynak: UniProt P01308 (INS_HUMAN), 110 amino asit; B zinciri 25-54, A zinciri 90-110.</desc>
  <!-- source: insulin (UniProt P01308, 110 letters); len -> 110; B chain from UniProt position 25 (index 24), A chain from position 90 (index 89); insulin[24:54] -> FVNQHLCGSHLVEALYLVCGERGFFYTPKT; insulin[89:] -> GIVEQCCTSICSLYQLENYCN (Python 3.14.8, 2026-10-11; find() removed 2026-10-13). ders3.md S159, lore.json L3-04. -->
