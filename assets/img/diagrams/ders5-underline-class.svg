<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 1152 260" width="1152" height="260" role="img" aria-labelledby="ders5-underline-class-t ders5-underline-class-d">
  <title id="ders5-underline-class-t">Bir cümlenin isimleri ve class Course</title>
  <desc id="ders5-underline-class-d">Üstte cümle: Her dersin bir kodu, kredisi ve harf notu vardır. kodu, kredisi ve harf notu çivit mavisi çizgiyle altı çizili. Her altı çizili isimden bir ok aşağı inip sola döner ve kesikli çizgili class Course kalıbındaki satırına gider: kodu code'a, kredisi credits'e, harf notu grade'e. Kalıp açık mavi zeminde, çivit mavisi çerçeveli. Sağda: İsimler, her dersin bilgileri olur.</desc>
  <!-- source: ders5-B.md S22, Kaldıroğlu 07 s. 27-28; no code is run here (class Course with code, credits, grade as in ders5-B.py) -->
