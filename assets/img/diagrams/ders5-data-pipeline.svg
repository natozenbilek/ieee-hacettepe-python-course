<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 1152 380" width="1152" height="380" role="img" aria-labelledby="ders5-data-pipeline-t ders5-data-pipeline-d">
  <title id="ders5-data-pipeline-t">Veri biliminin dört adımı ve AGNO programı</title>
  <desc id="ders5-data-pipeline-d">Dört numaralı adım soldan sağa, oklarla bağlı: 1 topla, 2 temizle, 3 analiz et, 4 görselleştir. Her adımın altında bu kursun programından bir örnek. 1: transcript.txt dosyası, satırlar MAT123;4;C1, FIZ127;3;B2, BBM101;3;F3 ve devamı (str, yeşil). 2: line.strip().split(";") ve bir dict (kahverengi): "MAT123" ile "C1", "BBM101" ile "A3" (str, yeşil); BBM101'in eski notu "F3" kırmızı kesik çizgiyle üstü çizili, yanında eski not. 3: weighted_points() ve AGNO 3.08 (float, hardal sarısı). 4: küçük bir grafik, dört açık mavi çubuk 2.50, 3.00, 3.50, 3.75 ve 3.08'de lacivert yatay çizgi. Dördüncü adım açık mavi bant ve çivit mavisi çerçeve içinde, tek yeni adım. İlk üç adımın altında köşeli parantez: Ders 5'in programı; dördüncünün altında: matplotlib, önizleme.</desc>
  <!-- source: run target (transcript.txt beş satır, BBM101 F3 sonra A3, dict son notu tutar; AGNO 3.08, gpa = 3.0833333333333335) ve S81 grafiği (points = [2.50, 3.00, 3.50, 3.75], axhline 3.08) (Python 3.14.8, 2026-10-11) -->
