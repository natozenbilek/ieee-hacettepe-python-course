<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 1152 400" width="1152" height="400" role="img" aria-labelledby="ders2-para-075-01-t ders2-para-075-01-d">
  <title id="ders2-para-075-01-t">0.75 ve 0.1 bilgisayarın paralarıyla, satır satır</title>
  <desc id="ders2-para-075-01-d">Üç sütunlu tablo: Para, 0.75, 0.1. Başta yalnızca başlık ve para satırları görünür: yarım (0.5), çeyrek (0.25), sekizde bir (0.125), on altıda bir (0.0625), otuz ikide bir (0.03125). Tıklamalarla 0.75 sütunu dolar: yarım için al, kalan 0.25; çeyrek için al, kalan 0. Sonra 0.1 sütunu satır satır: yarım, çeyrek ve sekizde bir için fazla, alma; on altıda bir için al, kalan 0.0375; otuz ikide bir için al, kalan 0.00625 ve üç nokta. Al hücreleri petrol mavisi, fazla hücreleri gri. En son binary (ikilik taban) satırı çıkar, altında alınan 1, alınmayan 0: 0.75 için 0.11, 0.1 için 0.0001100110011 ve üç nokta.</desc>
  <!-- source: Fraction runs on 3.14.8: 3/4 - 1/2 - 1/4 = 0; 1/10 - 1/16 = 3/80 (0.0375); 3/80 - 1/32 = 1/160 (0.00625); 1/64 and 1/128 are larger than 1/160; doubling 1/10 digit by digit gives 0.00011001100110011001100110011 (0011 repeats). Build steps: 0-1 the 0.75 column; 2-6 the 0.1 rows; 7 the binary row -->
  <defs>
    <marker id="ders2-para-075-01-ah" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah" d="M0,0 L12,6 L0,12 z"/></marker>
