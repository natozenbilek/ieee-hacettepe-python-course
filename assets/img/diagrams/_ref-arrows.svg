<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 1152 500" width="1152" height="500" role="img" aria-labelledby="_ref-arrows-t _ref-arrows-d">
  <title id="_ref-arrows-t">Ok ve işaret çeşitleri</title>
  <desc id="_ref-arrows-d">Altı örnek. 1: x isminden 5 değerine düz ok, isim şu anda bu değeri gösterir. 2: x isminden 3 değerine gri kesikli ok, eski bağ. 3: klavye kutusundan CPU kutusuna, üstünde input() yazan akış oku. 4: CPU ile Data arasında, üstünde okur / yazar yazan çift uçlu ok. 5: x &gt; 5 karar kutusundan petrol mavisi True ve kırmızı False okları. 6: print("Merhaba") kodunda print'e çizgiyle bağlı 1 numaralı işaret, function adı. 5 ve 3 int olduğu için kutuları turuncu.</desc>
