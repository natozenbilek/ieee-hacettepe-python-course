<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 1152 340" width="1152" height="340" role="img" aria-labelledby="ders5-init-errors-t ders5-init-errors-d">
  <title id="ders5-init-errors-t">TypeError ve AttributeError: eksik argument, yanlış attribute adı</title>
  <desc id="ders5-init-errors-d">İki sıra. Üst sıra: d = Course("MAT123", 4) satırı. Sağdaki __init__ çerçevesinde üç lacivert parameter ismi var: code, MAT123 değerini (str, yeşil) gösteriyor; credits 4 değerini (int, turuncu) gösteriyor; grade'in oku kırmızı ve kırmızı bir kutudaki soru işaretine gidiyor, çünkü ona argument gelmedi. Solda kırmızı TypeError: Course.__init__() missing 1 required positional argument: 'grade'. Alt sıra: print(d.grades) satırından kırmızı bir ok, üstünde grades? yazısıyla, Course object'inin kenarına gidiyor. Object'te yalnızca code MAT123 (str, yeşil), credits 4 (int, turuncu) ve grade C1 (str, yeşil) var. Altta kırmızı AttributeError: 'Course' object has no attribute 'grades'. ve petrol mavisi Did you mean: 'grade'?</desc>
  <!-- source: runs init_missing (S53, class of S47 above, line 7): TypeError: Course.__init__() missing 1 required positional argument: 'grade'; attr_typo (line 8): AttributeError: 'Course' object has no attribute 'grades'. Did you mean: 'grade'? (Python 3.14.8, 2026-10-11) -->
  <defs>
    <marker id="ders5-init-errors-ah" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah" d="M0,0 L12,6 L0,12 z"/></marker>
