<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 1152 350" width="1152" height="350" role="img" aria-labelledby="ders5-ai-timeline-t ders5-ai-timeline-d">
  <title id="ders5-ai-timeline-t">Yapay zekanın ilk yılları: 1950 Turing'den 1959 Cahit Arf'a</title>
  <desc id="ders5-ai-timeline-d">1948'den 1962'ye orantılı bir zaman çizgisi; her yılda küçük bir çentik, altında 1950, 1955 ve 1960 yazıyor. Çizgi üzerinde dört çivit mavisi nokta, her birinden bir kutuya ince bir çizgi: yukarıda 1950 Turing, Mind makalesi; aşağıda 1955 Dartmouth, AI önerisi; yukarıda 1958 Perceptron, IBM 704'te; aşağıda 1959 Cahit Arf, Erzurum konferansı. 1959 kutusu açık mavi, çivit mavisi çerçeveli, vurgulu olan tek kutu. Altta küçük yazıyla kaynaklar.</desc>
  <!-- source: connections.json W5B-AI-1 (Mind, Oct 1950), W5B-AI-2 (proposal of 31 Aug 1955), W5B-AI-3 (IBM 704 demonstration, July 1958); lore.json L5-05 (lecture in the 1958-1959 teaching year, printed 1959). x = 40 + (year - 1948) * 76.57 -->
  <defs>
    <style>
