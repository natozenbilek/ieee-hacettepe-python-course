  <title id="ders5-menu-split-t">Satır, strip() ve split(";")</title>
  <desc id="ders5-menu-split-d">Soldan sağa: 'latte;85\n' str'i strip() ile 'latte;85' olur, split(";") ile ['latte', '85'] list'i olur. List'in iki item'ı name ve price isimlerine iner: 'latte' ve '85', ikisi de str; '85' çerçeveli, hala str. Solda soru: int() olmasaydı price * 2 ne verirdi? Tıklayınca: '8585': str iki kez yan yana yazılır. Sağ üstte menu.txt dosyası ve iki satırı: latte;85, mocha;95.</desc>
