<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 1152 320" width="1152" height="320" role="img" aria-labelledby="ders3-nested-grid-t ders3-nested-grid-d">
  <title id="ders3-nested-grid-t">Nested loops: çalışma sırası</title>
  <desc id="ders3-nested-grid-d">Solda kod: for i in range(1, 3):, içinde for j in range(2):, içinde print(i, j); 1, 3 ve 2 turuncu (int). Sağında iki köşeli ayraç: üç satırın hepsi dış loop, son iki satır iç loop. Sağda ızgara: satırlar i = 1 ve i = 2, sütunlar j = 0 ve j = 1 (değerler turuncu, int). Hücrelerde çalışma sırası 1'den 4'e ve yazılan metin: 1 0, 1 1, 2 0, 2 1. Her satırda bir ok soldaki hücreden sağdakine gider. 3. hücre (2 0, j yeniden 0'dan başlar) açık mavi, çivit mavisi çerçeveli. Alt satır: satır bitmeden alt satıra geçilmez.</desc>
  <!-- source: nested: for i in range(1, 3): for j in range(2): print(i, j) -&gt; 1 0 / 1 1 / 2 0 / 2 1 (Python 3.14.8, 2026-10-10) -->
