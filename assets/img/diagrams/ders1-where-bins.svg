<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 560 440" width="560" height="440" role="img" aria-labelledby="ders1-where-bins-t ders1-where-bins-d">
  <title id="ders1-where-bins-t">Uygulama 1: disk, memory ya da ekran</title>
  <desc id="ders1-where-bins-d">Üst üste, çivit mavisi çerçeveli üç kutu. En üstte Disk (SSD), sağ ucunda küçük bir file simgesi. Ortada Memory (RAM); çivit mavisi kesikli bir çizgiyle Code ve Data olarak ikiye ayrılmış. En altta Ekran, sağ ucunda bir ekran çizimi. Her kutuda, memory'de ise Code ve Data bölümlerinin her birinde boş, gri, kesikli bir yer var; içlerinde yalnızca soru işareti yazıyor. Hiçbir madde yerleştirilmemiş: cevaplar sınıfta sözlü verilir.</desc>
  <!-- source: ders1-A.md S27 Uygulama 1; no code, no values (the answers are spoken) -->
