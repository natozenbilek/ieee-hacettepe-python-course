<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 1152 360" width="1152" height="360" role="img" aria-labelledby="ders4-append-film-t ders4-append-film-d">
  <title id="ders4-append-film-t">Boş list'e append: film şeridi</title>
  <desc id="ders4-append-film-d">Solda kod: squares = [], for i in range(1, 4):, squares.append(i * i), print(squares); çıktı [1, 4, 9]. Sağda dört kare. Kare 1, başta: squares ismi (lacivert) boş bir list'i (vişneçürüğü) gösteriyor; boş list açık mavi, çivit mavisi çerçeveli şeridin içinde. Kare 2, tur 1, i = 1: aynı list'te 1 (int, turuncu). Kare 3, tur 2, i = 2: 1 ve 4. Kare 4, tur 3, i = 3: 1, 4 ve 9. Her karede o turda eklenen hücre çivit mavisi çerçeveli; ok her karede aynı list'e gidiyor. Altta: Kare 2-4: o tur bittikten sonra; bu turda eklenen.</desc>
  <!-- source: squares = []; for i in range(1, 4): squares.append(i * i) -> [1], [1, 4], [1, 4, 9]; print(squares) -> [1, 4, 9] (Python 3.14.8, 2026-10-10) -->
  <defs>
    <marker id="ders4-append-film-ah" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah" d="M0,0 L12,6 L0,12 z"/></marker>
    <marker id="ders4-append-film-ahm" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah-m" d="M0,0 L12,6 L0,12 z"/></marker>
