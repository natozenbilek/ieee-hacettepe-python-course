<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 1152 260" width="1152" height="260" role="img" aria-labelledby="ders1-x-plus-one-t ders1-x-plus-one-d">
  <title id="ders1-x-plus-one-t">x = x + 1 üç adımda</title>
  <desc id="ders1-x-plus-one-d">Üç numaralı kare. Kare 1, x'i oku: lacivert x etiketinden 5 değerine (int, turuncu) giden ok, çivit mavisi çerçeveli açık mavi şeridin üzerinde; okunan bağ bu. Kare 2, hesapla: x hala 5'i gösteriyor; 5 + 1 ifadesinden çıkan ok yeni 6 değerini (int, turuncu) gösteriyor; 6'nın kutusu açık mavi şeridin içinde. Kare 3, oku taşı: x'ten 6'ya giden yeni ok açık mavi şeridin üzerinde; x'ten 5'e giden eski ok gri ve kesikli. 5 ve 6 her karede aynı yerde duruyor. Altta x = x + 1 satırı: sağdaki x + 1 parçasının altında önce, soldaki x'in altında sonra yazıyor. Özet: 1: x'in gösterdiği 5 okunur. 2: 5 + 1 hesaplanır, 6. 3: x'in oku 6'ya taşınır, 5'e giden ok gri ve kesikli. Değerler int (turuncu). Kodun çıktısı 6.</desc>
  <!-- source: x = 5 / x = x + 1 / print(x) -> 6 (Python 3.14.8, 2026-10-11) -->
