<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 1152 512" width="1152" height="512" role="img" aria-labelledby="ders2-elif-no-else-t ders2-elif-no-else-d">
  <title id="ders2-elif-no-else-t">else olmadan elif: score = 40, adım adım</title>
  <desc id="ders2-elif-no-else-d">Solda Örnek: score = 40, if score &gt;= 85:, print("A3 ve üstü"), elif score &gt;= 50:, print("geçti"), print("son"); else yok; sayılar turuncu (int), metinler yeşil (str). Sağda score = 40 ve gri akış şeması: alt alta score &gt;= 85 ve score &gt;= 50 baklavaları; her birinin True oku sağdaki print kutusuna gider, iki kutu sağda birleşip print("son") kutusuna döner; ikinci baklavanın False oku aşağı, print("son") kutusuna iner; sonra Bitir; etiketler gri. Bir tıklamayla score &gt;= 85 baklavası koyulaşır, yanında 40 &gt;= 85 ve bir okla False (bool, deniz yeşili) yazar, False oku aşağı iner ve etiketi kırmızı olur. Sonra score &gt;= 50 baklavası: 40 &gt;= 50 ve False, False oku print("son") kutusuna iner, etiketi kırmızı. Sonra print("son") açık mavi ve çivit mavisi çerçeveli olur, Bitir koyulaşır, iki print kutusunun altında atlandı yazar. Sonra solda Çıktı: son. En son büyük harflerle: else zorunlu değil: hiçbir block çalışmayabilir.</desc>
  <!-- source: elif_noelse: score = 40, no else, print("son") -&gt; son; 40 &gt;= 85 False, 40 &gt;= 50 False (Python 3.14.8, 2026-10-22). True right, False down. Build steps: start example, head and skeleton; 0 first condition False; 1 second condition False; 2 print("son"), Bitir, both blocks skipped; 3 output; 4 focal line -->
