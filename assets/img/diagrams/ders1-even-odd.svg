  <title id="ders1-even-odd-t">% ile çift ve tek</title>
  <desc id="ders1-even-odd-d">İki satır. 18 % 2: 18 nokta (çivit mavisi) dokuz çifte ayrılmış, her çiftin altında bir köşeli çizgi; ok sonuca gidiyor: 0 (int, turuncu), çift. 17 % 2: 17 nokta sekiz çifte ayrılmış, bir nokta artıyor ve açık mavi, çivit mavisi çerçeveli bir şeritte; ok sonuca gidiyor: 1 (int, turuncu), tek.</desc>
