<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 1152 260" width="1152" height="260" role="img" aria-labelledby="ders1-zero-run-t ders1-zero-run-d">
  <title id="ders1-zero-run-t">ZeroDivisionError: program o satırda durur</title>
  <desc id="ders1-zero-run-d">Solda üç satırlık kod: 1 print(7 / 2), yanında çalıştı ve Run penceresindeki 3.5 satırına bir ok; 2 print(7 / 0), yanında kırmızı bir durma işareti ve ZeroDivisionError burada; 3 print("son") gri, çalışmadı. Sağda Run penceresi: 3.5 ve kırmızı ZeroDivisionError: division by zero. Altta: Hata satırı çalışınca bulunur; önceki satırlar çalışmıştır.</desc>
  <!-- source: print(7 / 2) / print(7 / 0) / print("son") -&gt; 3.5, then ZeroDivisionError: division by zero at line 2 (Python 3.14.8, 2026-10-10) -->
