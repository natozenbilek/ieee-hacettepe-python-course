<svg xmlns="http://www.w3.org/2000/svg" class="dg no" viewBox="0 0 1152 250" width="1152" height="250" role="img" aria-labelledby="ders4-names-objects-t ders4-names-objects-d" data-state="object">
  <title id="ders4-names-objects-t">İsimler ve object'ler: Data</title>
  <desc id="ders4-names-objects-d">object durumu: Memory (RAM) kutusunun Data bölmesi, çivit mavisi çerçeveli. Solda İsimler kutusunda iki isim, x ve grades (lacivert). Sağda Object'ler: int 5 (turuncu, type etiketi int) ve iki hücreli bir list (vişneçürüğü, type etiketi list); hücrelerde "C1" ve "B2" (str, yeşil). x'ten 5'e, grades'ten list'e birer ok gidiyor. İki object aynı açık mavi, çivit mavisi çerçeveli vurgu şeridinin içinde. Kod: x = 5, grades = ["C1", "B2"], print(type(x), type(grades)); çıktı &lt;class 'int'&gt; &lt;class 'list'&gt;. reference durumu: aynı resim, büyük vurgu şeridi yok; isimlerden çıkan iki okun üstünde reference yazıyor. List'in iki hücresinde artık değer yazmıyor, birer çivit mavisi nokta var (hücreler list'in rengini alıyor); her noktadan yukarıya, ayrı bir str object'ine ok gidiyor: "C1" ve "B2" (yeşil). Bu iki str object'i ve okları açık mavi, çivit mavisi çerçeveli şeridin içinde.</desc>
  <!-- source: x = 5; grades = ["C1", "B2"]; print(type(x), type(grades)) -> &lt;class 'int'&gt; &lt;class 'list'&gt; (Python 3.14.8, 2026-10-11). States: object (S68, default), reference (S69); a deck copy changes only data-state. -->
