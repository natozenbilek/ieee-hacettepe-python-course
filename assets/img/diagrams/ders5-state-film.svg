  <text class="cd24" x="10" y="28">class PiggyBank:</text>
  <text class="cd24 pre" x="10" y="52" xml:space="preserve">    def __init__(self):</text>
  <text class="cd24 pre" x="10" y="76" xml:space="preserve">        self.money = <tspan class="t-int">0</tspan></text>
  <text class="cd24 pre" x="10" y="112" xml:space="preserve">    def deposit(self, amount):</text>
  <text class="cd24 pre" x="10" y="136" xml:space="preserve">        self.money += amount</text>
  <text class="cd24 pre" x="10" y="172" xml:space="preserve">    def show(self):</text>
  <text class="cd24 pre" x="10" y="196" xml:space="preserve">        print(<tspan class="t-str">"Kumbarada"</tspan>, self.money, <tspan class="t-str">"TL"</tspan>)</text>
  <text class="cd24" x="10" y="232">k = PiggyBank()</text>
  <text class="cd24 sub" x="298" y="232"># 1</text>
  <text class="cd24" x="10" y="256">k.deposit(<tspan class="t-int">100</tspan>)</text>
  <text class="cd24 sub" x="298" y="256"># 2</text>
  <text class="cd24" x="10" y="280">k.deposit(<tspan class="t-int">50</tspan>)</text>
  <text class="cd24 sub" x="298" y="280"># 3</text>
  <text class="cd24" x="10" y="304">k.show()</text>
