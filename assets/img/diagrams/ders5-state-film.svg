<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 1152 446" width="1152" height="446" role="img" aria-labelledby="ders5-state-film-t ders5-state-film-d">
  <title id="ders5-state-film-t">Film şeridi: deposit() money'yi değiştirir</title>
  <desc id="ders5-state-film-d">Üç karelik film şeridi. Solda kod: PiggyBank class'ı; __init__ self.money = 0 yazıyor; deposit(self, amount) self.money += amount yapıyor; show() print("Kumbarada", self.money, "TL") yazdırıyor. Altta k = PiggyBank() (# 1), k.deposit(100) (# 2), k.deposit(50) (# 3), k.show(). Çıktı: Kumbarada 150 TL. Her karede lacivert k etiketi aynı PiggyBank object'ini gösteriyor; object'in money satırından çıkan ok bir değere gidiyor. Kare 1, # 1 satırından sonra: money 0'ı (int, turuncu) gösteriyor; 0 çivit mavisi çerçeveli açık mavi bantta. Kare 2, # 2 satırından sonra: money 100'ü (int, turuncu) gösteriyor, 100 açık mavi bantta; 0'a giden eski ok gri ve kesikli. Kare 3, # 3 satırından sonra: money 150'yi (int, turuncu) gösteriyor, 150 açık mavi bantta; 100'e giden eski ok gri ve kesikli; 0 artık gösterilmiyor. Değerler kareler boyunca yerini değiştirmez. Alttaki açıklama: kare n, # n satırı çalıştıktan sonraki durumdur; düz ok şu anki bağ, kesikli gri ok eski bağ, çivit mavisi çerçeveli açık mavi şerit bu adımda değişen.</desc>
  <!-- source: ders5-B S63; run piggy: k.money 0 after # 1, 100 after # 2, 150 after # 3; output Kumbarada 150 TL (Python 3.14.8, 2026-10-11) -->
