<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 1152 260" width="1152" height="260" role="img" aria-labelledby="ders5-three-purposes-t ders5-three-purposes-d">
  <title id="ders5-three-purposes-t">Method'un üç işi</title>
  <desc id="ders5-three-purposes-d">Üç eşit sütun, vurgu yok. Bilgi verir: g.say() çağrısından inen ok Çıktı kutusuna gidiyor; çıktı Selam millet. Object'i değiştirir: k.deposit(50) çağrısından inen ok PiggyBank object'ine gidiyor; money satırından çıkan düz ok 150'yi (int, turuncu) gösteriyor, 100'e (int, turuncu) giden eski ok gri ve kesikli. Değer döndürür: d.weighted_points() çağrısından inen ok return'e gidiyor; return'den çıkan petrol mavisi ok 10.0 değerini (float, hardal sarısı) gösteriyor.</desc>
  <!-- source: ders5-B S66; runs say (Selam millet), piggy (money 100 -> 150 after k.deposit(50)), weighted (10.0) (Python 3.14.8, 2026-10-11) -->
