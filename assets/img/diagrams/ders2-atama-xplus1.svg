<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 1152 338" width="1152" height="338" role="img" aria-labelledby="ders2-atama-xplus1-t ders2-atama-xplus1-d">
  <title id="ders2-atama-xplus1-t">x = x + 1: önce sağ taraf, sonra isim, adım adım</title>
  <desc id="ders2-atama-xplus1-d">Solda kod paneli: x = 5 ve x = x + 1 (sayılar turuncu, int). Sağda İsimler ve Value'lar sütunları; başta lacivert x etiketi 5'i (int, turuncu) bir okla gösterir. Birinci tıklama: ikinci satırda x + 1'in altında 1 numaralı ayraç ve satırı: x + 1 hesaplanır, 6 çıkar; Value'lar sütununda 5 + 1 yazısından inen bir ok ve açık mavi bantlı yeni value 6 (int, turuncu), 5'in sağ altında. İkinci tıklama: soldaki x'in altında 2 numaralı ayraç ve satırı: x, 6'yı gösterir; x'ten 6'ya açık mavi şeritli yeni ok, 5'e giden eski okun üstünde bir çarpı. 5 yerinde kalır.</desc>
  <!-- source: x = 5; x = x + 1; print(x) -> 6 (Python 3.14.8, 2026-10-22). Build steps: start x -> 5; 0 the right side (x + 1 gives 6); 1 x -> 6 and the cross over the old arrow -->
