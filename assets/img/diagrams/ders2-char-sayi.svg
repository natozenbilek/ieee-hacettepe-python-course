  <title id="ders2-char-sayi-t">Karakterler ve sayılar: 65 ile "A" belleğe nasıl gider</title>
  <desc id="ders2-char-sayi-d">Üstte soru: Bilgisayarda yalnızca 1 ve 0 var: "A" nasıl saklanır? Sağda uzun bir çivit mavisi blok: bellek, yalnızca 1 ve 0. Üst satır, sayı: 65 (int, turuncu) bir okla doğrudan belleğe gider. Alt satır, karakter: "A" (str, yeşil) başta tek başına durur, bellekle arası boştur. Bir tıklamayla arası dolar: "A" bir oka, açık mavi bantla vurgulanmış küçük bir tabloya gider, tabloda "A" ile 65 yan yana; oradan 65 (int, turuncu) ve belleğe. Son tıklamada altta büyük yazıyla kural: Her karaktere, anlaşılmış bir tablodan bir sayı verilir.</desc>
