<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 1152 392" width="1152" height="392" role="img" aria-labelledby="ders3-bare-except-t ders3-bare-except-d">
  <title id="ders3-bare-except-t">Adsız except ve except ValueError</title>
  <desc id="ders3-bare-except-d">İki sütun. Solda kırmızı Adsız except başlığı: try:, credits = int(inptu(&quot;Kredi: &quot;)), except:, print(&quot;Tam sayı girin.&quot;); inptu yazım hatası kırmızı kesikli bir elipsle çevrili. Çıktı yalnızca Tam sayı girin.; altında asıl hata saklandı. Sağda petrol mavisi except ValueError başlığı: aynı kod, ama except ValueError:; ValueError açık mavi vurgulu. Çıktı kırmızı: NameError: name 'inptu' is not defined. Did you mean: 'input'?; altında yazım hatası görünüyor. Adsız except yazım hatasını saklıyor; except ValueError ile asıl hata, NameError, görünüyor.</desc>
  <!-- source: bare: try/except: with inptu -> Tam sayı girin. (run bare); named: except ValueError -> last traceback line NameError: name 'inptu' is not defined. Did you mean: 'input'? (run named); Python 3.14.8, 2026-10-11 -->
  <defs>
    <marker id="ders3-bare-except-ah" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah" d="M0,0 L12,6 L0,12 z"/></marker>
