<svg xmlns="http://www.w3.org/2000/svg" class="dg tt-fun-star-rosette" viewBox="0 0 560 512" width="560" height="512" role="img" aria-labelledby="fun-star-rosette-t fun-star-rosette-d">
  <title id="fun-star-rosette-t">turtle ile 36 yıldızlık çiçek</title>
  <desc id="fun-star-rosette-d">Lacivert zemin üzerinde 36 beş köşeli yıldızdan oluşan bir çiçek, toplam 180 çizgi. Yıldızlar sırayla camgöbeği, pembe ve hardal sarısı; her yıldızdan sonra kalem 10 derece dönüyor. Dıştaki for 36 kez, içteki for her turda 5 kez dönüyor; rengi if, elif ve else seçiyor.</desc>
