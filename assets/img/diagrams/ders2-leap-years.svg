<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 1152 300" width="1152" height="300" role="img" aria-labelledby="ders2-leap-years-t ders2-leap-years-d">
  <title id="ders2-leap-years-t">Artık yıl kuralı dört yılda</title>
  <desc id="ders2-leap-years-d">Tablo: year, div4, div100, div400 ve artık yıl mı? sütunları. 2000: True, True, True, sonuç True. 1900: True, True, False, sonuç False; bu satır açık mavi ve çivit mavisi çerçeveyle vurgulu, sağında kırmızı ile Excel: True yazıyor, çünkü Excel 1900'ü artık yıl sayar. 2024: True, False, False, sonuç True. 2026: False, False, False, sonuç False. Yıllar int (turuncu), div sütunları bool (deniz yeşili); sonuç True petrol mavisi kutuda, False gri. Altta kural satırı: print((div4 and not div100) or div400).</desc>
  <!-- source: ders2-B.md S34-S35; div4 = year % 4 == 0, div100 = year % 100 == 0, div400 = year % 400 == 0, print((div4 and not div100) or div400): 2000 -> True, 1900 -> False, 2024 -> True, 2026 -> False (Python 3.14.8, 2026-10-11) -->
