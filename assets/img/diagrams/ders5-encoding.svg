<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 1152 340" width="1152" height="340" role="img" aria-labelledby="ders5-encoding-t ders5-encoding-d">
  <title id="ders5-encoding-t">encoding: aynı baytlar, iki farklı okuma</title>
  <desc id="ders5-encoding-d">"Büşra" (str, yeşil) diskte UTF-8 ile yedi bayt olarak durur; bayt kutuları beyaz: 42, C3, BC, C5, 9F, 72, 61. Altlarındaki köşeli çizgiler baytları harflere ayırır: B bir bayt (42), ü iki bayt (C3 BC), ş iki bayt (C5 9F), r bir bayt (72), a bir bayt (61). Soldaki petrol mavisi ok encoding="utf-8" ile okumayı gösterir: sonuç yine "Büşra" (str, yeşil), altında petrol mavisi doğru yazar. Sağdaki kırmızı ok encoding="cp1254" ile okumayı gösterir: sonuç "BÃ¼ÅŸra" (str, yeşil), kırmızı kesikli bir çerçevenin içinde, altında kırmızı bozuk yazar. Yanında gri yazı: cp1254, Türkçe Windows'un eski kod sayfası.</desc>
  <!-- source: "Büşra".encode("utf-8") -> b'B\xc3\xbc\xc5\x9fra' (7 bayt: 42 C3 BC C5 9F 72 61); b'B\xc3\xbc\xc5\x9fra'.decode("cp1254") -> 'BÃ¼ÅŸra'; a names.txt written with encoding="utf-8" and read with encoding="cp1254" prints the same mojibake (Python 3.14.8, 2026-10-11). The name in the 5A spec is replaced by "Büşra" (DECISIONS.md "Example names"); Ömer is avoided because its cp1254 form holds U+2013. -->
  <defs>
    <marker id="ders5-encoding-ah" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah" d="M0,0 L12,6 L0,12 z"/></marker>
    <marker id="ders5-encoding-ahok" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah-ok" d="M0,0 L12,6 L0,12 z"/></marker>
    <marker id="ders5-encoding-aherr" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah-err" d="M0,0 L12,6 L0,12 z"/></marker>
    <style>
