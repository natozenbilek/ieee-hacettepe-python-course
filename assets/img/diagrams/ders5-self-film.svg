<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 1152 466" width="1152" height="466" role="img" aria-labelledby="ders5-self-film-t ders5-self-film-d">
  <title id="ders5-self-film-t">Film şeridi: her çağrıda yeni bir self</title>
  <desc id="ders5-self-film-d">İki karelik film şeridi. Üstte solda class Course ve __init__ kodu: self.code = code, self.credits = credits, self.grade = grade. Kare 1, d = Course(&quot;MAT123&quot;, 4, &quot;C1&quot;) satırı (# 1) çalışırken: __init__ çerçevesindeki lacivert self etiketi yeni bir Course object'ini gösteriyor; object'te code &quot;MAT123&quot; (str, yeşil), credits 4 (int, turuncu), grade &quot;C1&quot; (str, yeşil); self'in oku çivit mavisi çerçeveli açık mavi bantta; gri d etiketinin yanında kesikli kısa bir çizgi ve henüz bağlanmadı yazısı. Kare 2, e = Course(&quot;FIZ127&quot;, 3, &quot;B2&quot;) satırı (# 2) çalışırken: lacivert d etiketi ilk object'i gösteriyor; yeni __init__ çerçevesindeki self bu kez ikinci, yeni bir object'i gösteriyor: code &quot;FIZ127&quot;, credits 3, grade &quot;B2&quot;; self'in oku açık mavi bantta; e etiketi henüz gri. İlk object iki karede de aynı yerde. Altta print(d.code, d.credits, e.code, e.credits) satırı ve Çıktı: MAT123 4 FIZ127 3. Açıklama: kare n, # n satırı çalışırken; düz ok şu anki bağ, açık mavi bant bu adımda değişen.</desc>
  <!-- source: run init_two; d = Course("MAT123", 4, "C1")  # 1 / e = Course("FIZ127", 3, "B2")  # 2 -> MAT123 4 FIZ127 3; Python 3.14.8, 2026-10-11 -->
