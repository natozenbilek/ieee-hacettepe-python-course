<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 1152 340" width="1152" height="340" role="img" aria-labelledby="ders3-wrong-indent-rows-t ders3-wrong-indent-rows-d">
  <title id="ders3-wrong-indent-rows-t">Nested loop ve indentation</title>
  <desc id="ders3-wrong-indent-rows-d">İki sütun. Solda Doğru: n = 3, for i in range(1, n + 1):, row = "", for j in range(i):, row += "*", print(row) dört boşlukla; Çıktı: *, **, ***. Sağda Bir indentation fazla: aynı kod, son satır print(row) sekiz boşlukla; fazladan dört boşluk kırmızı kesikli çerçevede. Çıktı altı satır: *, *, **, *, **, ***. Altında kırmızı çerçeveli kutuda kırmızı: error message yok. Sayılar turuncu (int), "" ve "*" yeşil (str).</desc>
  <!-- source: rows -&gt; * / ** / ***; rows_wrong (print(row) inside the inner loop) -&gt; * / * / ** / * / ** / ***, no error (Python 3.14.8, 2026-10-10) -->
