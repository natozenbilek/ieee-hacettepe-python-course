  <title id="ders4-repeated-code-t">Tekrarlanan kod ve function</title>
  <desc id="ders4-repeated-code-d">Üç sütun. Solda Tekrarlanan kod: print("-" * 20), print("MAT123"), print("-" * 20), print("FIZ127"), print("-" * 20); çizgi satırının üç kopyası kırmızı kesik çerçeveli, yanlarında kopya 1, kopya 2, kopya 3. Ortada Function ile: def draw_line(): ve indentation'lı print("-" * 20), boş satır, draw_line(), print("MAT123"), draw_line(), print("FIZ127"), draw_line(); def block'u açık mavi, çivit mavisi çerçeveli bantla vurgulu, üç draw_line() call'undan block'a geri dönen oklar var. Sağda İkisinin de çıktısı: 20 tire, MAT123, 20 tire, FIZ127, 20 tire.</desc>
  <!-- source: S28; runs s7_repeat_a and s7_repeat_b, identical output: 20 hyphens / MAT123 / 20 hyphens / FIZ127 / 20 hyphens (Python 3.14.8, 2026-10-10) -->
