  <title id="fun-polygon-flower-t">polygon() 36 kez çağrılınca</title>
  <desc id="fun-polygon-flower-d">Beyaz zemin üzerinde 36 altıgenden oluşan bir çiçek, toplam 216 çizgi. Altıgenler sırayla kırmızı, turuncu, hardal sarısı, yeşil, çivit mavisi ve deniz yeşili; her altıgenden sonra kalem 10 derece dönüyor. Hepsi aynı polygon(6, 100, renk) call'u.</desc>
