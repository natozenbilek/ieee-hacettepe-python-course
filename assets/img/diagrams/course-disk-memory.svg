<svg xmlns="http://www.w3.org/2000/svg" class="dg dm" viewBox="0 0 1152 512" width="1152" height="512" role="img" aria-labelledby="course-disk-memory-t course-disk-memory-d" data-focus="run">
  <title id="course-disk-memory-t">Disk ve memory</title>
  <desc id="course-disk-memory-d">Disk ve memory. Altta Disk (SSD) bloğunda iki dosya: hello.py ve Python interpreter'ının kendisi olan python. Üstte Memory (RAM) bloğu kesikli bir çizgiyle Code ve Data diye ikiye bölünmüş. İki Run oku diskten memory'ye çıkar: python'dan Code bölümündeki Python interpreter şeridine, hello.py'den iki satır koda: name = input("Adınız: ") ve print("Merhaba", name); run durumunda bu iki Run okunun arkasında çivit mavisi çerçeveli açık mavi şeritler var. Data bölümünde lacivert name ismi "Mehmet" değerini gösteriyor; bu değer str olduğu için kutusu yeşil; diskte yok, yalnızca memory'de. Alt satır: Program bitince memory boşalır; dosyalar diskte kalır. Ders 1'de iki durum daha var. memory durumu: Memory bloğu açık mavi, çivit mavisi çerçeveli; Disk bloğu, dosyaları ve Run okları gri; alt satır: Memory şu an çalışan programı ve değerlerini tutar. disk durumu: Disk bloğu açık mavi, çivit mavisi çerçeveli, iki dosyası düz; Memory bölümünün içeriği ve Run okları gri; alt satır: Disk dosyaları tutar; bilgisayar kapanınca da silinmez. Ders 5'te aynı şekil iki durumla kullanılır ve Ders 1 parçaları gri olur. read durumu: diskteki transcript.txt dosyasından (satırlar MAT123;4;C1, FIZ127;3;B2 ve devamını gösteren üç nokta; dosyadaki satırlar str olduğu için yeşil) for line in f oku Data bölümüne çıkar; latest_grade ismi kahverengi kutudaki {'MAT123': 'C1', ve devamı} değerini (dict) gösterir; bu kutu çivit mavisi çerçeveli açık mavi bir şeridin içinde, çünkü bu durumda yeni gelen o; alt satır: transcript.txt diskte kalır; okunan satırlar memory'de data olur. write durumu: transcript.txt kısmı da gri; gpa ismi hardal sarısı kutudaki 3.0833333333333335 değerini (float) gösterir, Data bölümünden report.write(...) oku diskteki açık mavi report.txt dosyasına iner (yeşil str satırlar MAT123 4 C1 True, üç nokta, AGNO: 3.08); alt satır: report.txt program bitince de diskte kalır; gpa gibi variable'lar silinir.</desc>
  <!-- source: run, memory, disk (Ders 1, authoring/lessons/ders1.md S13 and S16): hello.py name = input("Adınız: "); print("Merhaba", name), Mehmet typed: 'Adınız: Mehmet' / 'Merhaba Mehmet'; the file itself does not change (Python 3.14.8, pty, 2026-10-11). read (Ders 5 S66, Uygulama 4 in authoring/lessons/ders5.py): site/code/transcript.txt read with code, credits, grade = line.strip().split(";") gives latest_grade == {'MAT123': 'C1', 'FIZ127': 'B2', 'BBM101': 'A3', 'TKD103': 'A2'} (3.14.8, 2026-10-11). write (Ders 5 S98, target program): gpa == 37 / 12 == 3.0833333333333335; report.txt first line 'MAT123 4 C1 True', last line 'AGNO: 3.08'. English code labels per DECISIONS.md "Code is in English" and ders5.md S66/S98; the trailing parts are three dot circles, not an ellipsis character. Name tags start at x 552 and value boxes at x 806 so that latest_grade (218 px) fits; the read arrow at x 1100 clears the gpa box (ends 1081). Code column starts at x 146 so the first code line does not cross the right Run arrow (x 505). States by data-focus on the root <svg>: run (default), memory, disk (Ders 1), read, write (Ders 5). -->
