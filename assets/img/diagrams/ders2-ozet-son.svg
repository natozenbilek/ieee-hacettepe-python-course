<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 1152 546" width="1152" height="546" role="img" aria-labelledby="ders2-ozet-son-t ders2-ozet-son-d">
  <title id="ders2-ozet-son-t">Artık yapabildikleriniz: küçük bir programın yolu</title>
  <desc id="ders2-ozet-son-d">İki satırlık bir yol, soldan sağa; başlığı Ders 2 ya da Ders 1 olan kutular her adımı hangi dersin öğrettiğini söylüyor. Üst satır, Ders 2 kutusu: Klavyeden gelen her şey str'dir. 6 ve 6 tuşlarından input() oku, yeşil (str) "66" kutusu, açık mavi ve çivit mavisi çerçeveyle vurgulu. int() oku, turuncu (int) 66 kutusu. Lacivert final etiketinden "66"ya giden eski okun üstünde bir çarpı, 66'ya yeni ok. Altta .strip().upper() ve float() str(), bir alt satırda code[0], code[0:3] ve len(code). Ders 1 kutusu: midterm = 80; (midterm + final) / 2 oku (sayılar turuncu, int), hardal sarısı (float) 73.0 kutusu, üstünde lacivert avg etiketi; altta + - * / // % ** ve gri # average. Ok alt satıra iner. Ders 2 kutusu: if avg &gt;= 85 yanında deniz yeşili (bool) False, aşağı elif avg &gt;= 50 yanında True, gri else'e gidilmez; yanında and or not. True'dan sağa print(f"{avg:.2f} geçti") oku, f-string yeşil. Ders 1 kutusu: Çıktı 73.00 geçti; altta Hata mesajında önce son satır.</desc>
  <!-- source: authoring/builder-paralel/ozet-son.py; the program in PROGRAM run with stdin 66 -&gt; 73.00 geçti; final "66" then 66, avg 73.0, avg &gt;= 85 False, avg &gt;= 50 True (Python 3.14.8, 2026-10-22); shelf line code[0]  code[0:3]  len(code) in the str card since 2026-10-24 (s[0] s[0:3] len(s) in the decisions card on 2026-10-23) -->
