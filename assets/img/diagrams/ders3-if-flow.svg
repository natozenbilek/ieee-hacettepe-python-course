<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 1152 400" width="1152" height="400" role="img" aria-labelledby="ders3-if-flow-t ders3-if-flow-d">
  <title id="ders3-if-flow-t">if: grade_point = 2.5 için akış</title>
  <desc id="ders3-if-flow-d">Solda Genel biçim: if &lt;şart&gt;: ve girintili &lt;gövde&gt;. Altında Örnek: grade_point = 2.5, if grade_point &gt;= 1.75:, print("geçti"), print("bitti"); 2.5 ve 1.75 hardal sarısı (float), "geçti" ve "bitti" yeşil (str). En altta Çıktı: geçti, bitti. Sağda grade_point = 2.5 için izlenen akış şeması: Başla, grade_point = 2.5 kutusu (2.5 hardal sarısı), grade_point &gt;= 1.75 karar baklavası. Petrol mavisi True oku print("geçti") kutusuna gider; bu kutu açık mavi, çivit mavisi çerçeveli. Oradan print("bitti") kutusuna, sonra Bitir. Gri False oku print("geçti") kutusunun yanından geçip doğrudan print("bitti") kutusuna gider; iki yol bu kutudan önce birleşir. Hiçbir yerde başa dönen ok yok. Alt satır: grade_point = 2.5 için çalışan yol koyu, çalışmayan yol gri.</desc>
  <!-- source: grade_point = 2.5; if grade_point &gt;= 1.75: print("geçti"); print("bitti") -&gt; geçti / bitti (Python 3.14.8, 2026-10-10) -->
