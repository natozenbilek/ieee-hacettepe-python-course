<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 1152 440" width="1152" height="440" role="img" aria-labelledby="ders3-if-flow-t ders3-if-flow-d">
  <title id="ders3-if-flow-t">if: grade_point = 2.5 için akış, adım adım</title>
  <desc id="ders3-if-flow-d">Solda Örnek: grade_point = 2.5, if grade_point &gt;= 1.75:, dört boşluk içeride print("geçti"), print("bitti"); 2.5 ve 1.75 hardal sarısı (float), metinler yeşil (str). Sağda akış şeması; başta gri, Başla ve grade_point = 2.5 kutusu koyu. Bir tıklamayla grade_point &gt;= 1.75 karar baklavası koyulaşır ve altında 2.5 &gt;= 1.75 ve bir okla True (bool, deniz yeşili) yazar. Sonra petrol mavisi True oku, True etiketi petrol mavisine döner ve print("geçti") kutusu açık mavi, çivit mavisi çerçeveli olur. Sonra block'tan sonraki satır: print("bitti") ve Bitir. Gri False oku baklavanın altından print("bitti") kutusuna gider, etiketi gri kalır, kullanılmaz.</desc>
  <!-- source: grade_point = 2.5; if grade_point &gt;= 1.75: print("geçti"); print("bitti") -&gt; geçti / bitti; 2.5 &gt;= 1.75 is True (Python 3.14.8, 2026-10-22). Build steps: start example, skeleton and start; 0 condition and its value; 1 True branch; 2 the line after the block and Bitir -->
