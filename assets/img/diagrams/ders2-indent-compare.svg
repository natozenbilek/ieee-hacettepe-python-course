<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 1152 300" width="1152" height="300" role="img" aria-labelledby="ders2-indent-compare-t ders2-indent-compare-d">
  <title id="ders2-indent-compare-t">Block'un içi ve dışı</title>
  <desc id="ders2-indent-compare-d">İki sütun, aynı dört satır: i = 0, while i &lt; 3:, içeride i = i + 1, sonra print(i) (0, 3 ve 1 int, turuncu). Solda, başlık print block'un içinde: son satırın başındaki dört boşluk dört çivit mavisi noktayla gösterilmiş, print(i) içeride; son satır açık mavi bir şeritte. Ok çıktıya gider: 1, 2, 3. Altında: print(i) her turda çalışır. Sağda, başlık print block'un dışında: print(i) satırın en başında, indentation yok; son satır yine açık mavi şeritte. Ok çıktıya gider: yalnızca 3; bu çıktı kutusu açık mavi ve çivit mavisi çerçeveli. Altında: print(i) loop bitince bir kez çalışır. Tek fark son satırın indentation'ı.</desc>
  <!-- source: ders2-B.md S48; i = 0 / while i < 3: / i = i + 1 / print(i) indented -> 1 / 2 / 3; print(i) at column 0 -> 3 (Python 3.14.8, 2026-10-11) -->
  <defs>
    <marker id="ders2-indent-compare-ah" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah" d="M0,0 L12,6 L0,12 z"/></marker>
