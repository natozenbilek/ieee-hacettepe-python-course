<svg xmlns="http://www.w3.org/2000/svg" class="dg ec" viewBox="0 0 1152 428" width="1152" height="428" role="img" aria-labelledby="ders2-explicit-convert-t ders2-explicit-convert-d" data-focus="rows">
  <title id="ders2-explicit-convert-t">int(), float() ve str() ile çevirim</title>
  <desc id="ders2-explicit-convert-d">Açıkça type conversion, üç satır, her satırda değer, function kutusu ve sonuç oklarla bağlı, type etiketi kutunun sağında. Satır 1: "4" (str, yeşil), int() kutusu, 4 (int, turuncu). Satır 2: "3.25" (str, yeşil), float() kutusu, 3.25 (float, hardal sarısı). Satır 3: 4 (int, turuncu), str() kutusu, "4" (str, yeşil). data-focus rows durumunda altta print(int("4"), float("3.25"), str(4)) ve print(type(int("4")), type(float("3.25")), type(str(4))) satırları, Çıktı panelinde 4 3.25 4 ve &lt;class 'int'&gt; &lt;class 'float'&gt; &lt;class 'str'&gt;. data-focus line durumunda üç satır gri ve soluk; altta print(int("4") + 1, float("3.25"), str(4) + "4") satırı, Çıktı panelinde 5 3.25 44; 44 açık mavi, çivit mavisi çerçeveli bir bantta ve yanında str + str yazar.</desc>
  <!-- source: ders2-A.md S43, S44: print(int("4"), float("3.25"), str(4)) -&gt; 4 3.25 4; types -&gt; &lt;class 'int'&gt; &lt;class 'float'&gt; &lt;class 'str'&gt;; print(int("4") + 1, float("3.25"), str(4) + "4") -&gt; 5 3.25 44 (Python 3.14.8, 2026-10-11) -->
  <defs>
