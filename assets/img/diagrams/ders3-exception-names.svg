<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 1152 440" width="1152" height="440" role="img" aria-labelledby="ders3-exception-names-t ders3-exception-names-d">
  <title id="ders3-exception-names-t">Exception'ların adları</title>
  <desc id="ders3-exception-names-d">Beş satır; her satırda solda gri bir panelde kod, bir ok ve sağda traceback'in gerçek son satırı, exception'ın adı kırmızı. int("abc"): ValueError: invalid literal for int() with base 10: 'abc' (Ders 2); bu satır açık mavi, çivit mavisi çerçeveli bir şeritle vurgulu. "BBM101"[6]: IndexError: string index out of range (Ders 3). prnt("A"): NameError: name 'prnt' is not defined. Did you mean: 'print'? (Ders 1). "A" - "B": TypeError: unsupported operand type(s) for -: 'str' and 'str' (Ders 2). 7 / 0: ZeroDivisionError: division by zero (Ders 1).</desc>
  <!-- source: each code line run as a one-line script, last traceback line (Python 3.14.8, 2026-10-11): exc_value, exc_index, exc_name, exc_type, exc_zero; ders3-B.md S74. -->
  <defs>
    <marker id="ders3-exception-names-ah" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah" d="M0,0 L12,6 L0,12 z"/></marker>
