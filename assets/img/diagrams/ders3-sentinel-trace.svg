<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 1152 256" width="1152" height="256" role="img" aria-labelledby="ders3-sentinel-trace-t ders3-sentinel-trace-d">
  <title id="ders3-sentinel-trace-t">Sentinel izleme tablosu</title>
  <desc id="ders3-sentinel-trace-d">İzleme tablosu, sütunlar: adım, yazılan, number == 0, total, ne oldu. Adım 1: yazılan 5, number == 0 False, total 5, devam. Adım 2: yazılan 7, False, total 12, devam. Adım 3: yazılan 0, True, total 12, break; bu satır açık mavi, çivit mavisi çerçeveli. 5, 7, 0 ve 12 int (turuncu), False ve True bool (deniz yeşili). 0 toplama eklenmiyor, total 12'de kalıyor. Sağda Çıktı paneli: Sayı: 5, Sayı: 7, Sayı: 0, Toplam: 12.</desc>
  <!-- source: ders3-B.md S12/S13 run sentinel: stdin 5, 7, 0; per step number, number == 0, total after the step: 5 False 5 / 7 False 12 / 0 True 12 (break) -> Sayı: 5 / Sayı: 7 / Sayı: 0 / Toplam: 12 (Python 3.14.8, 2026-10-11) -->
  <defs>
    <marker id="ders3-sentinel-trace-ah" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah" d="M0,0 L12,6 L0,12 z"/></marker>
