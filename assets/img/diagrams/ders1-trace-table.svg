<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 1152 300" width="1152" height="300" role="img" aria-labelledby="ders1-trace-table-t ders1-trace-table-d">
  <title id="ders1-trace-table-t">İzleme tablosu: x = 5, y = x + 2, x = 10</title>
  <desc id="ders1-trace-table-d">Solda dört numaralı kod satırı: 1 x = 5, 2 y = x + 2, 3 x = 10, 4 print(x, y). Sağda dört sütunlu tablo: satır, x, y, çıktı; her kod satırı tablonun aynı hizadaki satırına denk geliyor. Satır 1: x 5, y boş, çıktı boş. Satır 2: x 5, y 7, çıktı boş. Satır 3: x 10, y 7, çıktı boş; bu satırdaki x hücresi açık mavi ve çivit mavisi çerçeveli, çünkü yalnızca x değişti. Satır 4: x 10, y 7, çıktı 10 7. x ve y sütunlarındaki sayılar int (turuncu); çıktı sütunu düz yazı. Satır 3'teki y hücresinden çıkan ince bir çizgi yanındaki notu gösteriyor: y yeniden hesaplanmaz.</desc>
  <!-- source: x = 5 / y = x + 2 / x = 10 / print(x, y) -> 10 7 (Python 3.14.8, 2026-10-11) -->
