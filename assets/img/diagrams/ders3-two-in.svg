<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 1152 240" width="1152" height="240" role="img" aria-labelledby="ders3-two-in-t ders3-two-in-d">
  <title id="ders3-two-in-t">İki ayrı in</title>
  <desc id="ders3-two-in-d">Solda "B" in "BBM" sorusu True veriyor (deniz yeşili, bool); sağda for satırındaki in, letter ismini sırayla B ve M'ye götürüyor. Sol sütunun başlığı kıyaslama: "B" in "BBM" ifadesinden bir ok, içinde var mı? yazan kutuya, oradan bir ok True değer kutusuna gider; True deniz yeşili (bool), açık mavi ve çivit mavisi çerçeveli bantla vurgulu, altında bool yazar. Sağ sütunun başlığı for: for letter in "BM": satırının altında lacivert letter isim etiketi ve yeşil iki hücre, B ve M (str). 1 numaralı ok letter'dan B'ye, 2 numaralı ok M'ye gider. Çıktı kutusunda alt alta B ve M.</desc>
  <!-- source: print("B" in "BBM") gives True; for letter in "BM": print(letter) gives B / M (Python 3.14.8, 2026-10-11) -->
  <defs>
    <marker id="ders3-two-in-ah" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah" d="M0,0 L12,6 L0,12 z"/></marker>
