<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 1152 320" width="1152" height="320" role="img" aria-labelledby="ders2-counter-t ders2-counter-d">
  <title id="ders2-counter-t">Counter: count her turda 1 artar</title>
  <desc id="ders2-counter-d">Solda kod: count = 0, i = 10, while i &gt; 0:, içeride count = count + 1 ve i = i - 3, en sonda print(count, i); count = 0 satırında loop'tan önce, count = count + 1 satırında her turda yazıyor. Sağda tablo, sütunlar tur, i (başta), count, i (sonra), çetele. Tur 1: i 10, count 1, i 7, bir çizgi. Tur 2: i 7, count 2, i 4, iki çizgi. Tur 3: i 4, count 3, i 1, üç çizgi. Tur 4: i 1, count 4, i -2, dört çizgi. Sayılar int (turuncu); çetele çizgileri çivit mavisi, her turda bir çizgi. count sütunu çivit mavisi çerçeveyle vurgulu: her turda 1 artar. Altta: i = -2 iken i &gt; 0 False, loop biter; çıktı 4 -2.</desc>
  <!-- source: ders2-B.md S73; passes (i before, count, i after): 10 1 7, 7 2 4, 4 3 1, 1 4 -2; output 4 -2 (Python 3.14.8, 2026-10-11) -->
