<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 1152 380" width="1152" height="380" role="img" aria-labelledby="ders5-rules-vs-examples-t ders5-rules-vs-examples-d">
  <title id="ders5-rules-vs-examples-t">Kuralı yazmak, kuralı öğrenmek: has_passed() ve örneklerden öğrenilen kural</title>
  <desc id="ders5-rules-vs-examples-d">İki sütun. Solda, kuralı biz yazarız: gri kod panelinde has_passed() method'u, def has_passed(self): ve return GRADE_POINTS[self.grade] &gt;= 1.75 satırları; 1.75 float, hardal sarısı. Altta "C1" (str, yeşil) girdi olarak yukarı, koda girer; koddan aşağı True (bool, deniz yeşili) cevap olarak çıkar. Sağda, kural örneklerden öğrenilir: girdi ve doğru cevap başlıklı bir tablo, satırları "C1" True, "F3" False, "A3" True (notlar str, yeşil; cevaplar bool, deniz yeşili). Tablodan bir ok, örnekler etiketiyle, açık mavi ve çivit mavisi çerçeveli öğrenilmiş kural kutusuna iner; yeni girdi "B2" (str, yeşil) bu kutuya girer, True (bool, deniz yeşili) çıkar. Sağ sütun kod değil, çizimdir.</desc>
  <!-- source: has_passed() of 5B, GRADE_POINTS of 5A (C1 2.50, F3 0.00, A3 3.50, B2 3.00); has_passed(): C1 True, F3 False, A3 True, B2 True (Python 3.14.8, 2026-10-11, scratchpad/ieee34/5B-7/run/check.py) -->
  <defs>
