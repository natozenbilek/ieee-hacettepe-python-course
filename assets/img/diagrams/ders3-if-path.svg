<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 1152 512" width="1152" height="512" role="img" aria-labelledby="ders3-if-path-t ders3-if-path-d">
  <title id="ders3-if-path-t">if: 2.5 ve 1.5 ile iki yol, sağdaki adım adım</title>
  <desc id="ders3-if-path-d">Aynı akış şeması yan yana iki kez; ikisinde de True oku baklavanın sağından çıkar, False oku aşağı iner. Solda grade_point = 2.5 (hardal sarısı, float): baklavanın altında 2.5 &gt;= 1.75 ve bir okla True (bool, deniz yeşili); petrol mavisi True oku sağa çıkıp aşağıdaki print("geçti") kutusuna iner, kutu açık mavi ve çivit mavisi çerçeveli; sonra print("bitti") ve Bitir; gri False oku aşağı inip soldan print("bitti") kutusuna girer; Çıktı: geçti, bitti. Sağda en üstte soru: grade_point 1.5 olsaydı çıktı ne olurdu? Altında açık mavi bantta grade_point = 1.5 ve gri akış şeması, etiketleri gri. Tıklamalarla: baklava koyulaşır ve altında 1.5 &gt;= 1.75 ve False yazar; aşağı inen False oku koyulaşır, etiketi kırmızı olur ve print("geçti") kutusunun solunda atlandı yazar; print("bitti") ve Bitir koyulaşır; Çıktı panelinde yalnızca bitti; en son büyük harflerle: Yalnızca data değişti: şart False, block atlanır.</desc>
  <!-- source: grade_point 2.5 -&gt; geçti / bitti; 1.5 -&gt; bitti; 2.5 &gt;= 1.75 True, 1.5 &gt;= 1.75 False (Python 3.14.8, 2026-10-22). True right, False down (2026-10-22, last small fixes). Build steps on the right: start question, band and skeleton; 0 condition and its value; 1 False edge; 2 the line after the block and Bitir; 3 output; 4 focal line -->
