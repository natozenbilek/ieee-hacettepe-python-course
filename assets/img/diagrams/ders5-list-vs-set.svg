<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 1152 340" width="1152" height="340" role="img" aria-labelledby="ders5-list-vs-set-t ders5-list-vs-set-d">
  <title id="ders5-list-vs-set-t">set ve list</title>
  <desc id="ders5-list-vs-set-d">Karşılaştırma. Solda list (vişneçürüğü çerçeve): "C1", "B2", "C1" (str, yeşil), altlarında index 0, 1, 2. Sağda set (zeytin yeşili, köşeleri yuvarlak çerçeve): serbest duran "C1" ve "B2" (str, yeşil), index yok. Tablo: sırası korunur mu? list evet, set hayır. index var mı? list evet, set hayır. Aynı değer iki kez olur mu? list evet, set hayır. Değiştirilebilir mi? İkisi de evet. Altta çıktı: len(letters) 3, len(set(letters)) 2; 2 açık mavi bantta ve çivit mavisi çerçevede.</desc>
  <!-- source: S49 (run set_list): letters = ["C1", "B2", "C1"]; print(len(letters), len(set(letters))) -> 3 2 (Python 3.14.8, 2026-10-11) -->
