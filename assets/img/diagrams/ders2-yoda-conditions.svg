<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 560 440" width="560" height="440" role="img" aria-labelledby="ders2-yoda-conditions-t ders2-yoda-conditions-d">
  <title id="ders2-yoda-conditions-t">Yoda conditions: 18 &lt;= age ile age &gt;= 18</title>
  <desc id="ders2-yoda-conditions-d">age 20'yi gösterir (int, turuncu); age &gt;= 18 ve 18 &lt;= age aynı soruyu sorar, ikisi de True (bool, deniz yeşili); ikinci satırdaki &lt;= vurgulu, taraflar yer değiştirince işaret de döner. Üstte lacivert age etiketinden 20 kutusuna bir ok. Birinci satır: age &gt;= 18, altında "age, 18'den büyük ya da eşit mi?", oktan sonra True. İki satırın arasında iki gri ok çaprazlanır: age sağa, 18 sola geçer. İkinci satırın üstünde "Yoda conditions": 18 &lt;= age, altında "18, age'den küçük ya da eşit mi?", oktan sonra True; &lt;= açık mavi zemin ve çivit mavisi çerçeveyle vurgulu. Altta: Taraflar yer değiştirince işaret de döner.</desc>
  <!-- source: ders2-B.md S15; age = 20; print(18 <= age, age >= 18) -> True True (Python 3.14.8, 2026-10-11) -->
