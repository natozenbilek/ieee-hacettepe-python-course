<svg xmlns="http://www.w3.org/2000/svg" class="dg ib" viewBox="0 0 1152 300" width="1152" height="300" role="img" aria-labelledby="ders2-indent-block-t ders2-indent-block-d" data-state="block">
  <title id="ders2-indent-block-t">Indentation ve block</title>
  <desc id="ders2-indent-block-d">Numaralı satırlarla bir kod paneli, dört durum. Durum block: 1 grade_point = 2.5, 2 if grade_point &gt;= 1.75:, 3 print("geçti"), 4 print("tebrikler"), 5 print("bitti") (2.5 ve 1.75 float, hardal sarısı; "geçti", "tebrikler" ve "bitti" str, yeşil). 3. ve 4. satırların başındaki dört boşluk dört çivit mavisi noktayla gösterilmiş; bu iki satır açık mavi ve çivit mavisi çerçeveli bir şeritte. 2. satırın sonundaki iki nokta çivit mavisi bir halkayla işaretli: iki nokta: block başlıyor. 3. ve 4. satırların sağında bir köşeli ayraç: block (4 boşluk). 5. satırın yanında: indentation yok: block'un dışında. Altta: Indentation Python'da süs değil, kuraldır. Durum colon: aynı beş satır, ama 2. satır 1.75'te biter, iki nokta yok; boş yer kırmızı kesik çizgili bir halkada, altında kırmızı bir şapka (^); üstte kırmızı: iki nokta yok; sağda kırmızı SyntaxError: expected ':' ve ondan halkaya kırmızı bir ok. Durum pycharm: aynı kod PyCharm editörü gibi, noktalar yok; 3. ve 4. satırlar seçili (açık mavi), solda bu iki satır boyunca ince gri dikey indentation çizgisi, 1 numaralı not: indentation çizgisi. Sağda iki tuş: Tab, sağa bir ok ve içeri; Shift+Tab, sola bir ok ve dışarı. Durum error: yalnızca üç satır: grade_point = 2.5, if grade_point &gt;= 1.75: ve indentation olmadan print("geçti"); 3. satırın yanında küçük kırmızı bir işaret; iki nokta yine çivit mavisi halkada. Panelin altında kırmızı: IndentationError: expected an indented block after 'if' statement on line 2.</desc>
  <!-- source: ders2.md S159 (block), S173 (colon), S177 (pycharm), S180 (error); redrawn 2026-10-13 for the if swap (DECISIONS.md "if before while"). grade_point = 2.5 / if grade_point >= 1.75: / print("geçti") / print("tebrikler") / print("bitti") -> geçti / tebrikler / bitti. Without the colon: line 2, caret one column after 1.75, SyntaxError: expected ':'. grade_point = 2.5 / if grade_point >= 1.75: / print("geçti") -> line 3, IndentationError: expected an indented block after 'if' statement on line 2 (Python 3.14.8, 2026-10-13). State through data-state on the root svg. -->
  <defs>
    <marker id="ders2-indent-block-ah" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah" d="M0,0 L12,6 L0,12 z"/></marker>
    <marker id="ders2-indent-block-aherr" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah-err" d="M0,0 L12,6 L0,12 z"/></marker>
