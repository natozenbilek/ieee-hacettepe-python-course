  <text class="cd24" x="18" y="36">i = <tspan class="t-int">1</tspan></text>
  <text class="cd24" x="18" y="68">total_credits = <tspan class="t-int">0</tspan></text>
  <text class="cd24" x="18" y="100">total_points = <tspan class="t-int">0</tspan></text>
  <text class="cd24" x="18" y="132">while i &lt;= <tspan class="t-int">2</tspan>:</text>
  <text class="cd24 pre" x="18" y="164" xml:space="preserve">    credits = int(input(<tspan class="t-str">&quot;Kredi: &quot;</tspan>))</text>
  <text class="cd24 pre" x="18" y="196" xml:space="preserve">    coefficient = float(input(<tspan class="t-str">&quot;Katsayı: &quot;</tspan>))</text>
  <text class="cd24 pre" x="18" y="228" xml:space="preserve">    total_credits += credits</text>
  <text class="cd24 pre" x="18" y="260" xml:space="preserve">    total_points += credits * coefficient</text>
  <text class="cd24 pre" x="18" y="292" xml:space="preserve">    i += <tspan class="t-int">1</tspan></text>
  <text class="cd24" x="18" y="324">print(total_credits, total_points)</text>
