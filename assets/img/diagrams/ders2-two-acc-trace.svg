<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 1152 340" width="1152" height="340" role="img" aria-labelledby="ders2-two-acc-trace-t ders2-two-acc-trace-d">
  <title id="ders2-two-acc-trace-t">İki accumulator: kredi ve katsayı klavyeden</title>
  <desc id="ders2-two-acc-trace-d">Solda kod: i = 1, total_credits = 0, total_points = 0, while i &lt;= 2:, içeride credits = int(input(&quot;Kredi: &quot;)), coefficient = float(input(&quot;Katsayı: &quot;)), total_credits += credits, total_points += credits * coefficient ve i += 1, en sonda print(total_credits, total_points). Sağda tablo, sütunlar tur, credits, coefficient, total_credits, total_points. Tur 1: credits 4, coefficient 2.5, total_credits 4, total_points 10.0. Tur 2: credits 3, coefficient 3.0, total_credits 7, total_points 19.0. credits ve total_credits int (turuncu), coefficient ve total_points float (hardal sarısı). Son satır açık mavi ve çivit mavisi çerçeveli. Altta Run penceresi: Kredi: 4, Katsayı: 2.5, Kredi: 3, Katsayı: 3 ve 7 19.0; klavyeden yazılan 4, 2.5, 3 ve 3 petrol mavisi. İki turda kredi ve katsayı klavyeden gelir; total_credits 4 ve 7, total_points 10.0 ve 19.0.</desc>
  <!-- source: ders2-B.md S82; stdin 4, 2.5, 3, 3; passes (credits, coefficient, total_credits, total_points): 4 2.5 4 10.0, 3 3.0 7 19.0; output 7 19.0 (Python 3.14.8, 2026-10-11) -->
