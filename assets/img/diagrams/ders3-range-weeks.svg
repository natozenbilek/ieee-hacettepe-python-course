  <title id="ders3-range-weeks-t">Dönemin 14 haftası: range(1, 15)</title>
  <desc id="ders3-range-weeks-d">Solda kod: count = 0, for week in range(1, 15):, count += 1, print(count); 0, 1 ve 15 turuncu (int). Altında Çıktı: 14. Sağda 0'dan 15'e sayı doğrusu: 1'den 14'e dolu turuncu noktalar (int), 15'te içi boş çivit mavisi daire; altında bitiş = 15. Noktaların üstünde 1'den 14'e uzanan köşeli ayraç ve açık mavi, çivit mavisi çerçeveli kutuda 14 hafta.</desc>
  <!-- source: count = 0; for week in range(1, 15): count += 1; print(count) -&gt; 14 (Python 3.14.8, 2026-10-10) -->
