  <title id="ders5-own-type-t">Class ile yeni type: Course</title>
  <desc id="ders5-own-type-d">Solda kod paneli: class Course:, pass, grades = [], d = Course(), print(type(grades), type(d)); altında Çıktı: &lt;class 'list'&gt; &lt;class '__main__.Course'&gt;. Ortada Python'un type'ları başlığıyla on küçük kutu, her biri kendi renginde: int (turuncu), float (hardal sarısı), bool (deniz yeşili), str (yeşil), range (beyaz, type rengi yok), tuple (mavi-gri), list (vişneçürüğü, çivit mavisi kalın çerçeveli), set (zeytin yeşili), dict (kahverengi), NoneType (bej). Sağda ince bir çizgiyle ayrılmış, haritaya bağlı olmayan tek kutu: Course, açık mavi zeminde çivit mavisi çerçeveli; altında bizim yazdığımız type. Altta lacivert grades etiketi boş list'i [] (list, vişneçürüğü), lacivert d etiketi bir Course object'ini gösteriyor.</desc>
  <!-- source: ders5-B.md S28 run own_type: grades = []; d = Course(); print(type(grades), type(d)) -&gt; &lt;class 'list'&gt; &lt;class '__main__.Course'&gt; (Python 3.14.8, 2026-10-11) -->
