<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 1152 380" width="1152" height="380" role="img" aria-labelledby="course-operator-families-t course-operator-families-d" data-now="arithmetic">
  <title id="course-operator-families-t">Operator aileleri</title>
  <desc id="course-operator-families-d">Kursta görülecek dört operator ailesi, dört sütun. Arithmetic, 7 operator: + - * / // % **; bu derste başlığı açık mavi ve çivit mavisi çerçeveyle vurgulu. Comparison, 6 operator: == != &lt; &gt; &lt;= &gt;=. Logical, 3 operator: and or not. Membership, 1 operator: in. Bu üç ailenin hücreleri gri kesikli, yazıları gri, başlıklarının sağında hangi derste görüleceği yazıyor: Ders 1'de Ders 2, Ders 2'de 2B. + ve * hücrelerinde Ders 2A için boş bir ikinci satır yeri var (str ile).</desc>
  <!-- source: course master; states data-now="arithmetic" (Ders 1), "str-ops" (W2A), "comparison" with data-known="arithmetic", "logical" with data-known="arithmetic comparison membership" (W2B); no code run (2026-10-10); the later label reads "Ders 2" in the arithmetic state and "2B" in the Ders 2 states (2026-10-14) -->
