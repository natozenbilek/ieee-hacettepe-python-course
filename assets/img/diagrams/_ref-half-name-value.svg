  <title id="_ref-half-name-value-t">area ismi 12 değerini gösterir</title>
  <desc id="_ref-half-name-value-d">Yarım genişlikte isim ve değer şekli. Solda lacivert isim etiketi area, üstünde name (isim) yazıyor. Etiketten çıkan ok sağdaki değer kutusunu gösteriyor; kutuda 12, altında type'ı int, üstünde value (değer) yazıyor. 12 int olduğu için kutusu turuncu.</desc>
  <!-- source: area = 3 * 4; print(area) -> 12; type(area) -> <class 'int'> (Python 3.14.8, 2026-10-10). Reference for the half-width (560) slot on s-concept, authoring/SPEC.md §3; lesson decks use their own dersN-<name>.svg. -->
