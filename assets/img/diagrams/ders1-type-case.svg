  <title id="ders1-type-case-t">Type ve type</title>
  <desc id="ders1-type-case-d">İki sütun. Geçersiz: print(Type(7)), büyük T kırmızı bir şeridin üzerinde; altında kırmızı son satır: NameError: name 'Type' is not defined. Did you mean: 'type'? Geçerli: print(type(7)), küçük t açık mavi, çivit mavisi çerçeveli bir şeridin üzerinde; Çıktı panelinde &lt;class 'int'&gt;. 7 iki tarafta da int (turuncu).</desc>
  <!-- source: print(Type(7)) -&gt; NameError: name 'Type' is not defined. Did you mean: 'type'?; print(type(7)) -&gt; &lt;class 'int'&gt; (Python 3.14.8, 2026-10-10) -->
