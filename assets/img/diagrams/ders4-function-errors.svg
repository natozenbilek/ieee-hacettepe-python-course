<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 1152 470" width="1152" height="470" role="img" aria-labelledby="ders4-function-errors-t ders4-function-errors-d" data-state="missing">
  <title id="ders4-function-errors-t">Function'da iki hata ve pass</title>
  <desc id="ders4-function-errors-d">Durum missing: Üç sıra; birincisi açık mavi, çivit mavisi çerçeveli bantla vurgulu: def say_hello(name):, indentation'lı print(f"Selam {name}"), boş satır, say_hello(); boş parantez kırmızı kesik halkayla işaretli; yanında kırmızı TypeError: say_hello() missing 1 required positional argument: 'name'. İkinci sıra gri: call'un def'ten önce yazılması, say_hello("Yusuf") ve NameError. Üçüncü sıra gri: pass ile boş gövde, Geçerli, çıktı bitti. Durum order: İkinci sıra vurgulu: 1 say_hello("Yusuf"), 2 boş, 3 def say_hello(name):, 4 indentation'lı print. Kırmızı ok 1. satırdan 3. satıra iniyor: bu satır çalışırken isim henüz yok. Yanında kırmızı NameError: name 'say_hello' is not defined. Birinci ve üçüncü sıra gri. Durum pass: Üçüncü sıra vurgulu, petrol mavisi Geçerli: def check_grades():, indentation'lı pass (kesik çerçevede, boş gövde), boş satır, check_grades(), print("bitti"); çıktı bitti. Birinci ve ikinci sıra gri.</desc>
  <!-- source: S134 run s7_missing: TypeError: say_hello() missing 1 required positional argument: 'name'; S135 run s7_before (say_hello("Yusuf") before def): NameError: name 'say_hello' is not defined; S136 run s7_pass: bitti (Python 3.14.8, 2026-10-11) -->
