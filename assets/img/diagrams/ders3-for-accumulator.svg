<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 1152 400" width="1152" height="400" role="img" aria-labelledby="ders3-for-accumulator-t ders3-for-accumulator-d">
  <title id="ders3-for-accumulator-t">for ve accumulator: trace tablosu</title>
  <desc id="ders3-for-accumulator-d">Solda kod: total = 0, for i in range(6):, total += i, print(total); 0 ve 6 turuncu (int). Altında 2. bölümde while ile başlıklı gri kod: i = 0, while i &lt; 6:, total += i, i += 1; son satırın üstü kırmızı kesikli çizgiyle çizili, altında: for bunu kendisi yapar. Ortada trace tablosu, sütunlar tur, i ve total: tur 1'de i 0, total 0; tur 2'de i 1, total 1; tur 3'te i 2, total 3; tur 4'te i 3, total 6; tur 5'te i 4, total 10; tur 6'da i 5, total 15. i ve total değerleri turuncu (int). Son satır açık mavi, çivit mavisi çerçeveli. Sağda Çıktı: 15.</desc>
  <!-- source: total = 0; for i in range(6): total += i; print(total) -&gt; 15; with print(i, total) inside: 0 0 / 1 1 / 2 3 / 3 6 / 4 10 / 5 15 (Python 3.14.8, 2026-10-10) -->
