<svg xmlns="http://www.w3.org/2000/svg" class="dg lme" viewBox="0 0 1152 180" width="1152" height="180" role="img" aria-labelledby="ders4-list-methods-t ders4-list-methods-d" data-state="append">
  <title id="ders4-list-methods-t">List method'ları</title>
  <desc id="ders4-list-methods-d">Beş durum, her biri bir method: üstte append(), insert(), remove(), pop(), sort() çipleri; o anki method açık mavi, çivit mavisi çerçeveli, öncekiler düz, sonrakiler gizli. Altta solda önceki list (vişneçürüğü), okun sağında sonraki list; item'lar str (yeşil). append: [C1, B2] sonra [C1, B2, A2], yeni A2 çerçeveli. insert: [C1, B2, A2] sonra [C1, D, B2, A2], index 1'deki D çerçeveli, altında kaydı. remove: [C1, D, B2, A2] içinde B2 gri, sonra [C1, D, A2], sola kayan A2 çerçeveli. pop: [C1, D, A2] sonra [C1, D]; sağda ayrı bir kutuda geri verilen A2 vurgulu ve last ismi onu gösteriyor. sort: [C1, A2, B1] sonra [A2, B1, C1], üç hücre birlikte çerçeveli.</desc>
  <!-- source: append -> ['C1', 'B2', 'A2']; insert(1, "D") -> ['C1', 'D', 'B2', 'A2']; remove("B2") -> ['C1', 'D', 'A2']; pop() -> ['C1', 'D'] A2; sort() -> ['A2', 'B1', 'C1'] (Python 3.14.8, 2026-10-10). States: append (S37), insert (S38), remove (S39), pop (S40), sort (S41). S50 uses ders4-remove-valueerror.svg. -->
