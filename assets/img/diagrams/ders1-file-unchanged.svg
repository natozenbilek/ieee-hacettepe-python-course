<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 1152 340" width="1152" height="340" role="img" aria-labelledby="ders1-file-unchanged-t ders1-file-unchanged-d">
  <title id="ders1-file-unchanged-t">Run diskteki dosyayı değiştirmez</title>
  <desc id="ders1-file-unchanged-d">Önce ve sonra. Solda Run'dan önce başlığı altında hello.py dosya simgesi, içinde iki satır: name = input("Adınız: ") ve print("Merhaba", name). Sağda Run'dan sonra başlığı altında aynı hello.py simgesi ve aynı iki satır; satırların çevresi çivit mavisi çerçeveli açık mavi, altında petrol mavisi aynı iki satır yazısı. İki simge arasında Run, Mehmet yazılır diye etiketli bir ok. Sağ simgenin altında kırmızı yazılmış ve üstü çizilmiş Mehmet, yanında dosyada yok yazısı. Alt satır: Değerler memory'de oluşur; diskteki dosya aynı kalır.</desc>
  <!-- source: S30 of lessons/ders1.md; SHA-1 of hello.py (dbb3aa82...) is the same before and after a run with Mehmet typed (Python 3.14.8, 2026-10-11). The strike is one solid red line over the six letters of Mehmet (text x 638-724, strike 636-726): a dashed strike in the same red as the text hid in the gaps between letters and did not read as struck out. The arrow label is set on two lines (Run, / Mehmet yazılır) to fit the 200 px gap between the icons. -->
  <defs>
    <marker id="ders1-file-unchanged-ah" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah" d="M0,0 L12,6 L0,12 z"/></marker>
    <style>
