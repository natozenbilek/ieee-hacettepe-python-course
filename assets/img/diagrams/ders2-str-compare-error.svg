<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 1152 300" width="1152" height="300" role="img" aria-labelledby="ders2-str-compare-error-t ders2-str-compare-error-d">
  <title id="ders2-str-compare-error-t">Kıyaslama ve TypeError: klavyeden gelen "85" &gt; 50</title>
  <desc id="ders2-str-compare-error-d">İki sütun. Solda kırmızı başlık Geçersiz: score = input("Puan: ") ve print(score &gt; 50); altında 8 ve 5 tuşlarından bir ok yeşil "85" kutusuna (str) gider, "85" ile 50 (int, turuncu) arasındaki &gt; işaretinin üstünde kırmızı çarpı; en altta kırmızı: TypeError: '&gt;' not supported between instances of 'str' and 'int'. Sağda petrol mavisi başlık Geçerli: score = int(input("Puan: ")) ve print(score &gt; 50); 8 ve 5 tuşlarından çıkan ok açık mavi zeminli çivit mavisi çerçeveli int() kutusundan geçip 85 (int) kutusuna gider; 85 &gt; 50, bir ok ve True (bool, deniz yeşili). Altta: == hata vermez; &lt; ve &gt; str ile sayıyı kıyaslamaz.</desc>
  <!-- source: score = input("Puan: ") with 85 typed; print(score &gt; 50) -&gt; TypeError: '&gt;' not supported between instances of 'str' and 'int'; score = int(input("Puan: ")) with 85 -&gt; True (Python 3.14.8, 2026-10-22) -->
  <defs>
    <marker id="ders2-str-compare-error-ah" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah" d="M0,0 L12,6 L0,12 z"/></marker>
