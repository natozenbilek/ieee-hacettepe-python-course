<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 1152 290" width="1152" height="290" role="img" aria-labelledby="ders3-range-empty-t ders3-range-empty-d">
  <title id="ders3-range-empty-t">Boş range: range(10, 0)</title>
  <desc id="ders3-range-empty-d">Solda kod: for i in range(10, 0):, print(i), print("bitti"); altında Çıktı: yalnızca bitti. Sağda 0'dan 10'a noktasız sayı doğrusu: 0'da içi boş çivit mavisi daire ve bitiş = 0; 10'da siyah çerçeveli boş daire ve başla = 10. 10'dan sağa, bitişten uzağa giden kırmızı ok: adım = +1. Altta açık mavi, çivit mavisi çerçeveli kutuda hiç sayı üretilmez.</desc>
  <!-- source: for i in range(10, 0): print(i); print("bitti") -&gt; bitti; with range(10, 0, -1): 10 down to 1, then bitti (Python 3.14.8, 2026-10-10) -->
  <defs>
    <marker id="ders3-range-empty-aherr" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah-err" d="M0,0 L12,6 L0,12 z"/></marker>
