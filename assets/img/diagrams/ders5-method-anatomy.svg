  <title id="ders5-method-anatomy-t">Class içinde method: Greeting.say</title>
  <desc id="ders5-method-anatomy-d">Solda Greeting class'ının kodu: class Greeting:, def __init__(self, name):, self.name = name, boş satır, def say(self):, print("Selam", self.name), boş satır, g = Greeting("millet"), g.say(); "Selam" ve "millet" str (yeşil). say method'unun iki satırı açık mavi, çivit mavisi çerçeveli bir bantta. Sağda dört numaralı işaret: 1 class Greeting: satırında, class; 2 def say(self): satırında, method: class'ın içinde bir def; 3 altı çizili self.name'de, self ile object'in attribute'u okunur; 4 g.say() satırında, çağrı: object, nokta, method. Altta Çıktı: Selam millet.</desc>
