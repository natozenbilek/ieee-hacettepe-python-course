  <title id="ders5-coffee-typeerror-t">Hata avı: tuple ve TypeError</title>
  <desc id="ders5-coffee-typeerror-d">coffee ismi ("latte", "orta", 85) tuple'ını gösteriyor; üstte name, size, price ve 0, 1, 2. Sağda kod: coffee = ("latte", "orta", 85), coffee[2] = 90 kırmızı çerçeveli. Altta TypeError: 'tuple' object does not support item assignment ve soru: Python bu satıra neden hata veriyor? Tıklayınca: 85 hücresi kırmızı kesik çizgili; Tuple'ın bir item'ına yeni value atanamaz; fiyat değişirse yeni bir tuple yazılır: coffee = ("latte", "orta", 90). Tıklayınca ayrıca: list'te aynı atama çalışır: 3. bölümdeki order[0] = "çay" gibi.</desc>
