<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 1152 440" width="1152" height="440" role="img" aria-labelledby="ders5-attributes-t ders5-attributes-d" data-state="one">
  <title id="ders5-attributes-t">Attribute: object'e bağlı isimler</title>
  <desc id="ders5-attributes-d">Üç durumlu tek çizim. Üstte iki kod paneli: solda class tanımı, sağda onu kullanan satırlar; altta solda Çıktı paneli, sağda lacivert d ve e etiketlerinin gösterdiği Course object'leri. Object'in içinde her attribute adı kendi value'sunu bir okla gösterir. Birinci durum (attribute'u elle eklemek): kod class Course: pass, d = Course(), d.code = "MAT123", d.credits = 4, print(d.code, d.credits); d'nin object'inde code "MAT123"ü (str, yeşil), credits 4'ü (int, turuncu) gösteriyor; bu iki satır çivit mavisi çerçeveli açık mavi bantta; Çıktı MAT123 4. İkinci durum (iki object): kod d = Course(), d.code = "MAT123", e = Course(), e.code = "FIZ127", print(d.code, e.code); d'nin object'inde code "MAT123", e'nin ayrı object'inde code "FIZ127" (str, yeşil); e'nin satırı açık mavi bantta; Çıktı MAT123 FIZ127. Üçüncü durum (attribute'u değiştirmek): kod __init__ ile class Course, d = Course("MAT123", 4, "C1"), e = Course("FIZ127", 3, "B2"), d.credits = 5, print(d.credits, e.credits); d'nin object'inde code "MAT123", grade "C1"; d'nin credits oku artık yeni 5'i (int, turuncu) gösteriyor, 5 açık mavi bantta, 4'e giden eski ok gri ve kesikli; e'nin object'inde code "FIZ127", credits 3, grade "B2"; Çıktı 5 3.</desc>
  <!-- source: ders5.md S130, S131, S140; runs attr_manual (MAT123 4), attr_two (MAT123 FIZ127), attr_change (5 3; d.code d.grade e.code e.grade -&gt; MAT123 C1 FIZ127 B2) (Python 3.14.8, 2026-10-11). Root data-state: one | two | change; a deck copy changes only this attribute. -->
