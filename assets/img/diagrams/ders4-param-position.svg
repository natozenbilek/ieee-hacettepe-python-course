<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 1152 460" width="1152" height="460" role="img" aria-labelledby="ders4-param-position-t ders4-param-position-d" data-state="ok">
  <title id="ders4-param-position-t">Argument'lar sırayla atanır</title>
  <desc id="ders4-param-position-d">Durum ok: Üstte kod: def print_credits(code, credits):, indentation'lı print(f"{code}: {credits} kredi"), boş satır, course = "MAT123", print_credits(course, 4). Ortada parameter'lar, lacivert code ve credits etiketleri. Altlarında argument'lar call sırasıyla: 1 numaralı ok "MAT123"ten (str, yeşil; course'un gösterdiği değer) code'a, 2 numaralı ok 4'ten (int, turuncu) credits'e çıkıyor. Çıktı: MAT123: 4 kredi, açık mavi, çivit mavisi çerçeveli bantla vurgulu. Durum swap: Call satırı print_credits(4, course). 1 numaralı ok 4'ten (int, turuncu) code'a, 2 numaralı ok "MAT123"ten (str, yeşil) credits'e gidiyor; iki değer kırmızı kesik bir çerçeve içinde. Çıktı kırmızı: 4: MAT123 kredi; yanında kırmızı hata yok, ama satır yanlış.</desc>
  <!-- source: S34 run s7_multi: MAT123: 4 kredi; S35 run s7_swap: 4: MAT123 kredi (Python 3.14.8, 2026-10-10) -->
