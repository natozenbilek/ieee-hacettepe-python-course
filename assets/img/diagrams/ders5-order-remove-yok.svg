  <title id="ders5-order-remove-yok-t">remove() ilk eşleşeni siler</title>
  <desc id="ders5-order-remove-yok-d">Üstte kod: order = ["latte", "mocha", "latte"], order.remove("latte"), print(order). Altında [latte, mocha, latte] list'i, remove("latte") oku ve soru: Hangi latte gider? Tıklayınca: ilk latte kırmızı kesik çizgili, sağda [mocha, latte] list'i, ikinci latte çerçeveli; Çıktı ['mocha', 'latte']; remove("latte"), value'su "latte" olan ilk item'ı siler. Aynı tıklamada ikinci soru: order.remove("çay") yazsak? İkinci tıklamada: ValueError: list.remove(x): x not in list; altında: çay listede yok.</desc>
