<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 1152 320" width="1152" height="320" role="img" aria-labelledby="ders1-repl-vs-script-t ders1-repl-vs-script-d">
  <title id="ders1-repl-vs-script-t">Console ve .py dosyası</title>
  <desc id="ders1-repl-vs-script-d">Solda Python Console: &gt;&gt;&gt; 7 + 3, sonuç 10 (int, turuncu); &gt;&gt;&gt; print(7 + 3), çıktı 10; &gt;&gt;&gt; type("7"), &lt;class 'str'&gt;. Sağda example.py dosyası: 1. satır 7 + 3 (yanında: hesaplanır, yazılmaz), 2. satır print(7 + 3). Altında Run penceresinde tek satır: 10, açık mavi ve çivit mavisi çerçeveli bir şeritte. Console iki kez 10 gösterir, dosya bir kez yazar.</desc>
  <!-- source: Console: 10 / 10 / &lt;class 'str'&gt;; file 7 + 3, print(7 + 3) prints 10 once (Python 3.14.8, 2026-10-10) -->
  <defs>
    <style>
