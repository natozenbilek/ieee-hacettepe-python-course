<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 1152 300" width="1152" height="300" role="img" aria-labelledby="ders2-assign-vs-equal-t ders2-assign-vs-equal-d">
  <title id="ders2-assign-vs-equal-t">= ve ==</title>
  <desc id="ders2-assign-vs-equal-d">Solda = başlığı ve assignment etiketi: credits = 4; lacivert isim etiketi credits, 4'ü gösterir (int, turuncu); altında isme value bağlar, çıktı vermez. Sağda == başlığı ve comparison operator etiketi: credits == 4; eşit mi? kutusundan çıkan ok True'yu gösterir (bool, deniz yeşili). Altta print(5 == 5.0, 5 = 5) satırında tek = kırmızı kesik çizgili bir halkayla işaretli; altında kırmızı hata satırı: SyntaxError: expression cannot contain assignment, perhaps you meant "=="?</desc>
  <!-- source: ders2-B.md S14; credits = 4; print(credits == 4) -> True; print(5 == 5.0, 5 = 5) alone -> SyntaxError: expression cannot contain assignment, perhaps you meant "=="? (Python 3.14.8, 2026-10-11) -->
  <defs>
