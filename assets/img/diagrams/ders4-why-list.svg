  <title id="ders4-why-list-t">Ayrı isimler ve tek list</title>
  <desc id="ders4-why-list-d">Solda kod: mat_grade = "C1", fiz_grade = "B2", tkd_grade = "A2", print(mat_grade, fiz_grade, tkd_grade). Altında Ayrı isimler: üç ayrı isim (lacivert) üç ayrı str değerini (yeşil) gösteriyor, C1, B2, A2; çıktı C1 B2 A2. Dördüncü satır soluk ve kesikli: 40 ders için 40 isim. Sağda kod: grades = ["C1", "B2", "A2"], print(grades, len(grades)). Altında Tek list: tek bir grades ismi tek bir list'i (vişneçürüğü) gösteriyor; list açık mavi, çivit mavisi çerçeveli şeridin içinde vurgulu; altında 40 ders için de tek isim; çıktı ['C1', 'B2', 'A2'] 3.</desc>
