  <title id="fun-square-spiral-91-t">Açı 91 derece olunca</title>
  <desc id="fun-square-spiral-91-d">Aynı kare spiral, tek fark dönüş açısının 90 yerine 91 derece olması. Her kare bir öncekine göre 1 derece kaydığı için spiral kendi etrafında burulan bir girdaba dönüşüyor. Çizgiler sırayla camgöbeği, pembe, hardal sarısı ve beyaz, lacivert zemin üzerinde.</desc>
