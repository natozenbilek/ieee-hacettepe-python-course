<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 1152 360" width="1152" height="360" role="img" aria-labelledby="ders1-memory-clear-t ders1-memory-clear-d">
  <title id="ders1-memory-clear-t">Program bitince memory boşalır</title>
  <desc id="ders1-memory-clear-d">İki panel yan yana. Solda Program çalışırken: çivit mavisi çerçeveli Memory (RAM) bloğu kesikli bir çizgiyle Code ve Data diye ikiye bölünmüş. Code bölmesinde Python interpreter şeridi ve iki satır kod: name = input("Adınız: ") ve print("Merhaba", name). Data bölmesinde lacivert name ismi "Mehmet" değerini gösteriyor; Mehmet (str, yeşil), çevresinde çivit mavisi çerçeveli açık mavi bir şerit var. Ortada program biter yazan bir ok sağ panele gider. Sağda Program bitince: aynı Memory (RAM) bloğu, Code ve Data bölmeleri boş; eski içeriğin yerinde gri kesikli çerçeveler ve boş yazısı. Alt satır: Memory geçicidir: program bitince içindekiler silinir.</desc>
  <!-- source: ders1.md S14; hello.py: name = input("Adınız: "); print("Merhaba", name), Mehmet typed: 'Adınız: Mehmet' / 'Merhaba Mehmet' (Python 3.14.8, pty, 2026-10-11). The value box is 168 wide for "Mehmet" (8 characters at 28 px); the empty Data frame on the right grows to match. The script places Code and Data side by side; in a 520-wide block the code line (346 px) and the name and value do not fit side by side, so the dashed divider is horizontal. -->
  <defs>
    <marker id="ders1-memory-clear-ah" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah" d="M0,0 L12,6 L0,12 z"/></marker>
    <style>
