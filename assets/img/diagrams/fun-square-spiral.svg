  <title id="fun-square-spiral-t">turtle ile kare spiral</title>
  <desc id="fun-square-spiral-d">Lacivert zemin üzerinde 80 çizgiden oluşan kare bir spiral. Her çizgi bir öncekinden 5 birim uzun ve kalem her çizgiden sonra 90 derece sola dönüyor. Çizgiler sırayla camgöbeği, pembe, hardal sarısı ve beyaz.</desc>
