<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 1152 472" width="1152" height="472" role="img" aria-labelledby="ders3-if-errors-t ders3-if-errors-d">
  <title id="ders3-if-errors-t">SyntaxError ve IndentationError</title>
  <desc id="ders3-if-errors-d">İki satır, solda Geçersiz, sağda Geçerli. Birinci satır: x = 5, if x = 5:, print("beş"); tek = çivit mavisi halkayla çevrili. Altında kırmızı çerçeveli kutuda kırmızı SyntaxError: invalid syntax. Maybe you meant '==' or ':=' instead of '='?. Sağda if x == 5: ile aynı kod ve Çıktı: beş. İkinci satır: x = 5, if x &gt; 0:, girintisiz print(x); print kelimesi kırmızı kesikli çerçevede (Python'un işaretlediği yer). Altında kırmızı IndentationError: expected an indented block after 'if' statement on line 2. Sağda print(x) dört boşlukla girintili ve Çıktı: 5. Sayılar turuncu (int), "beş" yeşil (str).</desc>
  <!-- source: if_eq_err: line 2 'if x = 5:' -&gt; SyntaxError: invalid syntax. Maybe you meant '==' or ':=' instead of '='?; if_indent_err: line 3 'print(x)' -&gt; IndentationError: expected an indented block after 'if' statement on line 2; fixed versions print beş and 5 (Python 3.14.8, 2026-10-10) -->
  <defs>
