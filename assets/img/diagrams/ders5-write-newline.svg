<svg xmlns="http://www.w3.org/2000/svg" class="dg wn" viewBox="0 0 1152 146" width="1152" height="146" role="img" aria-labelledby="ders5-write-newline-t ders5-write-newline-d" data-state="joined">
  <title id="ders5-write-newline-t">write() ve \n: tek satır ya da iki satır</title>
  <desc id="ders5-write-newline-d">İki durum. Durum joined: \n olmadan yazılan codes.txt'de tek satır var: MAT123FIZ127 (str, yeşil); dosya açık mavi zeminde, çivit mavisi çerçeveli; sağdaki yer boş. Durum lines: sağda \n ile yazılan codes.txt'de iki satır var: MAT123 ve FIZ127 (str, yeşil), her birinin sonunda kesikli kutuda \n; bu dosya açık mavi; soldaki tek satırlı hali gri.</desc>
  <!-- source: ders5-B S10 (run joined): codes.txt 'MAT123FIZ127', çıktı MAT123FIZ127; S11 (run lines): codes.txt 'MAT123\nFIZ127\n', çıktı MAT123 / FIZ127 (Python 3.14.8, 2026-10-11) -->
