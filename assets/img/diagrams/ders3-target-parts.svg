<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 1152 480" width="1152" height="480" role="img" aria-labelledby="ders3-target-parts-t ders3-target-parts-d">
  <title id="ders3-target-parts-t">Ders 3'ün hedef programı: bugünkü parçalar</title>
  <desc id="ders3-target-parts-d">Solda gri bir kod paneli, sağ üstünde Önizleme yazıyor; hedef programın önemli satırları, atlanan yerlerde üç nokta. for i in range(n): satırı açık mavi bantta, çivit mavisi çerçeveli; yanındaki etiket 4. ve 5. bölüm. if score &gt;= 95:, grade_point = 4.00, elif score &gt;= 90: ve else: satırlarının etiketi 1. bölüm; 95 ve 90 turuncu (int), 4.00 hardal sarısı (float). if grade_point &gt;= 1.75: ve passed += 1 satırlarının etiketi 3. bölüm. print(f"{code[:3]} …") satırı da gri, etiketi Ders 2: slicing Ders 2'de. total_points += credits * grade_point, üç nokta ve print(f"AGNO: …") satırlarının etiketi de 3. bölüm. Ders 2'den bilinen öteki satırlar, n = int(input("Kaç ders? ")) ve code = input(…).strip().upper(), de gri yazılmış, etiketleri Ders 2. 1 turuncu (int), 1.75 hardal sarısı (float).</desc>
  <!-- source: authoring/targets/target3.py (redrawn 2026-10-13; labels for DECISIONS.md "if before while": 3A is while, counter and accumulator, for, range, and the if/elif table is Ders 2); run with 2, ' mat123', 4, 66, fiz127, 3, 77 gives the S3 Run window (Python 3.14.8, run_targets.py) Relabelled on 2026-10-24 by authoring/builder-paralel/ders3-list.py: code[:3] is Ders 2 (slicing moved there), so its line is grey with the label Ders 2, as the other Ders 2 lines. Section numbers updated on 2026-10-28 by authoring/builder-paralel/ders3-karar.py: 1. Karar kısmı opens Ders 3. -->
