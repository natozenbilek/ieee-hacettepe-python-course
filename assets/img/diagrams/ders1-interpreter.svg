  <rect class="blk" x="2" y="60" width="220" height="200" rx="6"/>
  <text class="lb" x="18" y="92">Disk</text>
  <path class="box" d="M28,120 H166 L194,148 V226 H28 Z"/>
  <path class="ld" d="M166,120 V148 H194"/>
  <text class="cd24 b7" x="44" y="186">hello.py</text>
  <path class="ar" d="M222,174 H287" marker-end="url(#ders1-interpreter-ah)"/>
  <text class="lb mid" x="255" y="162">Run</text>
  <rect class="blk" x="290" y="20" width="560" height="260" rx="6"/>
  <text class="lb" x="306" y="52">Memory (RAM)</text>
  <rect class="soft" x="310" y="68" width="520" height="44" rx="4"/>
  <text class="lb" x="326" y="98">Python interpreter</text>
  <rect class="hl ip-s1" x="370" y="148" width="420" height="38" rx="4"/>
