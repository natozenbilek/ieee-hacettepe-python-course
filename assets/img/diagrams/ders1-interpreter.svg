  <text class="cd24 sub" x="380" y="176">1</text>
  <text class="cd24 ip-l1" x="408" y="176">name = input("Adınız: ")</text>
  <text class="cd24 sub" x="380" y="222">2</text>
  <text class="cd24" x="408" y="222">print("Merhaba", name)</text>
