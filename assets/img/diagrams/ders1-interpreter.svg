.dg .co{fill:#14172E;fill:var(--d-ink,#14172E)}
.dg .co-t{fill:#FFFFFF;fill:var(--d-bg,#FFFFFF);font-size:24px;font-weight:700;text-anchor:middle}
.dg .sec{stroke:#3B4595;stroke:var(--d-second,#3B4595)}
/* ders1-interpreter: data-step="1" (S25, okuma işareti 1. satırda) ve "2" (S26, 2. satırda; 1. satır soluk) */
.dg .cm-cpu{font-size:32px;font-weight:700;fill:#14172E;fill:var(--d-ink,#14172E)}
.ip .ip-s2{display:none}
.ip[data-step="2"] .ip-s1{display:none}
.ip[data-step="2"] .ip-s2{display:inline}
.ip[data-step="2"] .ip-l1{fill:#50566F;fill:var(--d-type,#50566F)}
