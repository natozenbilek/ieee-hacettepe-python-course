<svg xmlns="http://www.w3.org/2000/svg" class="dg ip" viewBox="0 0 1152 320" width="1152" height="320" role="img" aria-labelledby="ders1-interpreter-t ders1-interpreter-d" data-step="1">
  <title id="ders1-interpreter-t">Interpreter satırları birer birer okur</title>
  <desc id="ders1-interpreter-d">Solda çivit mavisi çerçeveli Disk bloğunda hello.py dosyası. Run yazan bir ok Memory (RAM) bloğuna gider. Memory'de üstte Python interpreter şeridi, altında numaralı iki kod satırı: 1 name = input("Adınız: "), 2 print("Merhaba", name). Satırların solunda çivit mavisi küçük bir üçgen okuma işareti ve numaralı bir daire var. Interpreter şeridinden çıkan, instruction'lar yazan bir ok sağdaki CPU bloğuna iner. data-step 1 durumunda işaret ve 1 numaralı daire 1. satırda, bu satırın zemini açık mavi. data-step 2 durumunda işaret ve 2 numaralı daire 2. satırda, 2. satırın zemini açık mavi, 1. satırın yazısı gri. Alt satır: Python da memory'de çalışan bir programdır.</desc>
  <!-- source: S25-S26 of lessons/ders1.md; hello.py runs line 1, then line 2 (sys.settrace on Python 3.14.8, 2026-10-10). States by data-step on the root: 1, 2. The instruction'lar arrow leaves the bar to the right and turns down into the CPU block, so that its label has room above it. -->
  <defs>
    <marker id="ders1-interpreter-ah" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah" d="M0,0 L12,6 L0,12 z"/></marker>
    <style>
