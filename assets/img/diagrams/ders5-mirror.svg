  <rect class="bg" width="1152" height="452"/>
  <!-- mirror.py on disk: six lines of text, one line each -->
  <path class="box" d="M2,40 H674 L702,68 V370 H2 Z"/>
  <path class="ld" d="M674,40 V68 H702"/>
  <text class="cd24 t-str" x="18" y="108"># mirror.py reads itself</text>
  <text class="cd24 t-str" x="18" y="152">number = 0</text>
  <text class="cd24 t-str" x="18" y="196">with open("mirror.py", encoding="utf-8") as f:</text>
  <text class="cd24 t-str pre" x="18" y="240" xml:space="preserve">    for line in f:</text>
  <text class="cd24 t-str pre" x="18" y="284" xml:space="preserve">        number += 1</text>
  <text class="cd24 t-str pre" x="18" y="328" xml:space="preserve">        print(number, line.replace("\n", ""))</text>
  <text class="cd24 mid" x="352" y="406">mirror.py</text>
  <!-- path 1: Run, Python runs the file as code -->
  <path class="ar" d="M702,92 H817" marker-end="url(#ders5-mirror-ah)"/>
  <text class="lb sub mid" x="760" y="80">Run</text>
  <rect class="blk" x="820" y="57" width="220" height="70" rx="6"/>
  <text class="lb mid" x="930" y="100">Python</text>
  <text class="tx sub mid" x="930" y="160">code olarak çalıştırır</text>
  <!-- path 2: open() inside the program reads the same file as data -->
  <path class="ar" d="M702,226 H900 V265" marker-end="url(#ders5-mirror-ah)"/>
  <text class="cd24" x="712" y="214">open("mirror.py")</text>
  <text class="tx sub" x="914" y="254">data olarak okur</text>
  <text class="lb sub" x="822" y="260">Çıktı</text>
