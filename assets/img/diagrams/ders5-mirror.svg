<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 1152 452" width="1152" height="452" role="img" aria-labelledby="ders5-mirror-t ders5-mirror-d">
  <title id="ders5-mirror-t">Kendi dosyasını okuyan program</title>
  <desc id="ders5-mirror-d">Solda mirror.py dosyası, altı satır (str, yeşil): # mirror.py reads itself; number = 0; with open("mirror.py", encoding="utf-8") as f:; for line in f:; number += 1; print(number, line.replace("\n", "")). Dosyadan iki ok çıkar. Üstteki ok Run yazısıyla Python kutusuna gider: Python dosyayı code olarak çalıştırır. Alttaki ok open("mirror.py") yazısıyla Çıktı paneline iner: program aynı dosyayı data olarak okur. Çıktı paneli (açık mavi, çivit mavisi çerçeveli) satırları numaralarıyla yazar, uzun satırlar kısaltılmış: 1 # mirror.py, 2 number = 0, 3 with open(, 4 for line in f:, 5 number += 1, 6 print(.</desc>
  <!-- source: python mirror.py -> 1 # mirror.py reads itself / 2 number = 0 / 3 with open("mirror.py", encoding="utf-8") as f: / 4     for line in f: / 5         number += 1 / 6         print(number, line.replace("\n", "")) (run mirror; Python 3.14.8, 2026-10-11; comment shortened and run again 2026-10-15) -->
  <defs>
    <marker id="ders5-mirror-ah" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah" d="M0,0 L12,6 L0,12 z"/></marker>
