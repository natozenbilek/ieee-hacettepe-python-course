<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 1152 300" width="1152" height="300" role="img" aria-labelledby="course-three-structures-t course-three-structures-d" data-now="repetition" data-known="sequence">
  <title id="course-three-structures-t">Üç control structure</title>
  <desc id="course-three-structures-d">Üç küçük akış şeması yan yana. Sequence (art arda çalıştırma): 1. satır, 2. satır, 3. satır kutuları oklarla alt alta. Repetition (tekrarlama): devam şartı baklavası; petrol mavisi True oku block kutusuna iner, block'tan bir ok geri dönüp baklavanın sol köşesine girer; kırmızı False oku sağ köşeden çıkar. Decision (karar): şart baklavası; petrol mavisi True oku block A'ya, kırmızı False oku block B'ye gider, iki yol aşağıda bir noktada birleşir. Ders 2'de (data-now decision): karar çerçevesi çivit mavisi, başlığı açık mavi bantta vurgulu; art arda çalıştırma düz; tekrarlama gri, kesik çizgili, sağ üstünde Ders 3 yazıyor. Ders 3'te (data-now repetition): tekrarlama vurgulu, öteki ikisi düz.</desc>
  <!-- source: course master (DIAGRAMS.md §8.16), spec ders2-B.md S41 and ders3-A S32; no code run; root states data-now="decision" data-known="sequence" (2B), data-now="repetition" data-known="sequence decision" (3A), since the if-before-while swap of 2026-10-13 (desc updated then; the panels keep their order, which the midfield collage on ders2 S153 follows); 2026-10-11 -->
  <defs>
    <marker id="course-three-structures-ah" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah" d="M0,0 L12,6 L0,12 z"/></marker>
