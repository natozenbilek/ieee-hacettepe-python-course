<svg xmlns="http://www.w3.org/2000/svg" class="dg da" viewBox="0 0 1152 358" width="1152" height="358" role="img" aria-labelledby="ders5-dict-anatomy-t ders5-dict-anatomy-d" data-state="table">
  <title id="ders5-dict-anatomy-t">dict'in yapısı: grades</title>
  <desc id="ders5-dict-anatomy-d">Üç durumlu tek çizim. Ortada grades ismi (lacivert) bir dict'i (kahverengi çerçeve, altında dict etiketi) gösterir. dict'in içinde key ve value başlıklı iki sütun, iki satır: "MAT123" ile "C1", "FIZ127" ile "B2"; hepsi str (yeşil). table durumunda dict açık mavi bant ve çivit mavisi çerçeve içindedir. anatomy durumunda üstte grades = {"MAT123": "C1", "FIZ127": "B2"} satırı, parçaları numaralı: 1 süslü parantez (açılan ve kapanan), 2 key, 3 iki nokta, 4 value, 5 virgül; bant yok. lookup durumunda sağda grades["FIZ127"] yazar, ondan FIZ127 satırına bir ok gider; FIZ127 satırı çivit mavisi çerçeveli; Çıktı paneli B2.</desc>
  <!-- source: grades = {'MAT123': 'C1', 'FIZ127': 'B2'}; print(grades['FIZ127']) -> B2 (runs d_read, d_print; Python 3.14.8, 2026-10-11) -->
