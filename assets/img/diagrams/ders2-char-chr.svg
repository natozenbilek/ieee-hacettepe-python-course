<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 1152 440" width="1152" height="440" role="img" aria-labelledby="ders2-char-chr-t ders2-char-chr-d">
  <title id="ders2-char-chr-t">chr(): sayıdan karaktere, ord()'un tersi</title>
  <desc id="ders2-char-chr-d">Üstte Genel biçim: chr(&lt;sayı&gt;). Ortada "A" (str, yeşil) ve 65 (int, turuncu); üstten "A"dan 65'e giden ok, üstünde ord(). Bir tıklamayla alttan 65'ten "A"ya dönen ok, altında açık mavi bantla vurgulanmış chr(). Son tıklamada altta iki kod satırı yan yana: print(ord("a")) 97 yazar, print(chr(97)) a yazar.</desc>
  <!-- source: ord("A") -&gt; 65, chr(65) -&gt; 'A'; print(ord("a")) -&gt; 97, print(chr(97)) -&gt; a (Python 3.14.8, 2026-10-22). Build steps: 0 the way back, chr(); 1 the two code lines -->
  <defs>
    <marker id="ders2-char-chr-ah" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah" d="M0,0 L12,6 L0,12 z"/></marker>
    <marker id="ders2-char-chr-ahm" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah-m" d="M0,0 L12,6 L0,12 z"/></marker>
    <marker id="ders2-char-chr-ahok" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah-ok" d="M0,0 L12,6 L0,12 z"/></marker>
