<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 1152 220" width="1152" height="220" role="img" aria-labelledby="ders3-for-str-t ders3-for-str-d">
  <title id="ders3-for-str-t">str üzerinde for: letter sırayla B, B, M</title>
  <desc id="ders3-for-str-d">Üç adım: letter ismi sırayla B, B ve M karakterlerini gösteriyor (str, yeşil); her adımda o karakter yazılıyor. Üç panel yan yana, başlıkları adım 1, adım 2, adım 3. Her panelde yeşil üç hücre: B, B, M (str). Lacivert letter isim etiketinden inen ok adım 1'de 0 numaralı hücreyi (B), adım 2'de 1 numaralı hücreyi (B), adım 3'te 2 numaralı hücreyi (M) gösterir; gösterilen hücre kalın çivit mavisi çerçeveli. Her panelin altındaki Çıktı kutusunda o adımda yazılan satır: B, B, M.</desc>
  <!-- source: for letter in "BBM": print(letter) gives B / B / M (Python 3.14.8, 2026-10-11) -->
