<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 1152 340" width="1152" height="340" role="img" aria-labelledby="ders5-key-lookup-t ders5-key-lookup-d">
  <title id="ders5-key-lookup-t">dict ve in: yalnızca key'lere bakar</title>
  <desc id="ders5-key-lookup-d">Ortada grades dict'i (kahverengi), key ve value sütunlarıyla iki satır: "MAT123" "C1" ve "FIZ127" "B2", hepsi str (yeşil). key sütunu açık mavi bir bantta; bandın altında: in buraya bakar. Solda iki sorgu. "FIZ127" in grades: ok key sütununda aşağı iner ve FIZ127 hücresinde durur; hücre çivit mavisi çerçeveli, sonuç True (bool, deniz yeşili). "B2" in grades: gri ok key sütununu baştan sona geçer, hiçbir key'de durmaz ve tablonun altından çıkar; B2 value sütununda olduğu için ona hiç dokunmaz; sonuç False (bool, deniz yeşili). Çıktı True False.</desc>
  <!-- source: S19, run d_in: grades = {"MAT123": "C1", "FIZ127": "B2"}; print("FIZ127" in grades, "B2" in grades) -> True False (Python 3.14.8, 2026-10-11) -->
  <defs>
    <marker id="ders5-key-lookup-ah" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah" d="M0,0 L12,6 L0,12 z"/></marker>
    <marker id="ders5-key-lookup-ahm" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah-m" d="M0,0 L12,6 L0,12 z"/></marker>
