  <title id="ders2-promise-t">Ders 2'nin hedefi: puan klavyeden gelir, katsayıyı program bulur</title>
  <desc id="ders2-promise-d">Soldan sağa iki panel ve bir ok. Solda Ders 1 başlıklı çıktı paneli: AGNO: 2.9444444444444446; altında: değerler kodun içinde yazılı. Ortada sağa giden bir ok. Sağda üstte klavye tuşları 6, 6 ve Enter; altında Ders 2 başlıklı çıktı paneli: Puan (0-100): 66 (66 petrol mavisi, kullanıcının yazdığı) ve MAT123: 66 puan, katsayı 2.50, geçti; bu satır açık mavi, çivit mavisi çerçeveli. Panelin altında: puan klavyeden gelir, katsayıyı program bulur.</desc>
