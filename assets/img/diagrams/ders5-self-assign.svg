<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 1152 300" width="1152" height="300" role="img" aria-labelledby="ders5-self-assign-t ders5-self-assign-d">
  <title id="ders5-self-assign-t">Method çağrısında self = g</title>
  <desc id="ders5-self-assign-d">İki satır. Üstte Ders 4, gri, bilinen durum: say_hello("millet") çağrısında say_hello çerçevesindeki lacivert name etiketi "millet" değerini (str, yeşil) gösteriyor; ok üstünde name = "millet". Altta Ders 5: g.say() çağrısı, g altı çizili; altında self parantezde yazılmaz. say çerçevesinde lacivert self etiketi var. self'ten çıkan ok, lacivert g etiketinin de gösterdiği Greeting object'ine gidiyor; bu ok ve üstündeki self = g yazısı çivit mavisi çerçeveli açık mavi bantta. Object'te name, "millet" değerini (str, yeşil) gösteriyor. Greeting.say(g) de aynı çıktıyı verir: Selam millet.</desc>
  <!-- source: ders5-B S58; runs say (g.say() -> Selam millet), say_explicit (Greeting.say(g) -> Selam millet) and ders4 say_hello("millet") -> Selam millet (Python 3.14.8, 2026-10-11) -->
  <defs>
    <marker id="ders5-self-assign-ah" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah" d="M0,0 L12,6 L0,12 z"/></marker>
