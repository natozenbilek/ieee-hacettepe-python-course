<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 1152 220" width="1152" height="220" role="img" aria-labelledby="ders4-split-convert-t ders4-split-convert-d">
  <title id="ders4-split-convert-t">split() ve çevirim</title>
  <desc id="ders4-split-convert-d">parts ismi (lacivert) üç str'lik (yeşil) bir list'i (vişneçürüğü) gösteriyor: "MAT123", "4", "C1". parts[1] olan "4" hücresi çivit mavisi çerçeveli, altında str yazıyor. Sağda üç satır: parts[1] * 2 sonucu "44" (str, tekrar); int(parts[1]) * 2 sonucu 8 (int, turuncu, çarpma); parts[0][:3] sonucu "MAT" (str; önce index, sonra slicing).</desc>
  <!-- source: parts = "MAT123 4 C1".split(); parts[1] * 2 -> 44; int(parts[1]) * 2 -> 8; parts[0][:3] -> MAT (Python 3.14.8, 2026-10-10). S29 uses ders4-split-typeerror.svg. -->
