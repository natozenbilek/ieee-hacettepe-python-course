<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 1152 364" width="1152" height="364" role="img" aria-labelledby="ders3-for-while-t ders3-for-while-d">
  <title id="ders3-for-while-t">while ve for: aynı çıktı</title>
  <desc id="ders3-for-while-d">İki sütun. Solda while başlığı: i = 0, while i &lt; 3:, print(i), i += 1. Numaralı işaretler: 1 başlangıç (i = 0 satırı), 2 devam şartı (while satırı), 3 güncelleme (i += 1 satırı). Sağda for başlığı: for i in range(3): ve print(i); for satırı açık mavi bantta, çivit mavisi çerçeveli; üstünde 1, 2 ve 3 numaralı işaretler: üçü tek satırda. Sayılar 0, 1 ve 3 turuncu (int). İki programın altında aynı çıktı: 0, 1, 2; aralarında aynı çıktı yazıyor.</desc>
  <!-- source: i = 0; while i &lt; 3: print(i); i += 1 -&gt; 0 / 1 / 2; for i in range(3): print(i) -&gt; 0 / 1 / 2 (Python 3.14.8, 2026-10-10) -->
