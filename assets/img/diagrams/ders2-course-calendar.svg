<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 1152 512" width="1152" height="512" role="img" aria-labelledby="ders2-course-calendar-t ders2-course-calendar-d">
  <title id="ders2-course-calendar-t">Ders programı: Ders 1 bitti, bugün Ders 2</title>
  <desc id="ders2-course-calendar-d">Beş sütunlu ders programı, soldan sağa. Sağ üstte Salı, 18.00, E4. Ders 1, 20 Ekim (üstünde petrol mavisiyle bitti yazıyor, başlığı gri): bilgisayar, print(), error messages, int (turuncu), float (hardal sarısı), variable; Ödev 1, 25 Ekim Pazar 23.59. Ders 2, 27 Ekim (üstünde bugün yazıyor, açık mavi ve çivit mavisi çerçeveyle vurgulu): str (yeşil), input(), f-string, index, slicing, bool (deniz yeşili), if / elif; Ödev 2, 1 Kasım Pazar 23.59. Ders 3, 3 Kasım: while, for, break, continue, try / except, assert; Ödev 3, 8 Kasım Pazar 23.59. Ders 4, 10 Kasım: import, def, return, scope, None (bej), class; Ödev 4, 15 Kasım Pazar 23.59. Ders 5, 17 Kasım: list (vişneçürüğü), tuple (mavi gri), aliasing, dict (kahverengi), set (zeytin yeşili), file; Ödev 5, 22 Kasım Pazar 23.59. Alt satır: Her Ödev, dersten sonraki Pazar 23.59'a kadar teslim edilir.</desc>
  <!-- source: ders1-course-calendar.svg (Ders 1 S50) copied on 2026-10-21 for Ders 2 (ders2.md S209): Ders 1 done, Ders 2 today; room E4 (DECISIONS.md "Room E4 and names"); dates from authoring/data/forms.json Updated on 2026-10-23 by authoring/builder-paralel/ders2-index.py: the chip "index, slicing" moved from Ders 3 to Ders 2 (index, len() and slicing are taught in ders2.md 7. Index, len() ve slicing) Updated on 2026-10-24 by authoring/builder-paralel/ders2-index.py: Ders 3, 4 and 5 follow the five-week plan Nezih approved on 2026-10-24 (list and tuple in Ders 3, scope and None in Ders 4, class and NumPy in Ders 5) Chips of Ders 3-5 updated on 2026-10-28 by authoring/builder-paralel/takvim-2026-10-28.py: the plan of that day (Ders 3 loops, Ders 4 list, tuple, dict, set and file, Ders 5 import, functions, try / except and class) Chips of Ders 3-5 updated on 2026-10-28 evening by authoring/builder-paralel/takvim-2026-10-28-aksam.py: the plan of that evening (Ders 3 loops, try / except and assert; Ders 4 import, functions, scope, None and class; Ders 5 list, tuple, aliasing, dict, set and file) -->
