  <title id="ders5-cup-pixels-soru-t">cup: satırlardan bir list; önce soru</title>
  <desc id="ders5-cup-pixels-soru-d">Solda kod: W, S, C üç renk tuple'ı ve altı satırlık cup list'i, print(cup[3][7]); altında boş bir Çıktı kutusu. Sağda list'ten çizilmiş fincan; satır numaraları 0-5, sütun numaraları 0-7. Soru: cup[3][7] hangi piksel? Tıklayınca: 3. satır açık bir bantta, yanında cup[3]; kulptaki piksel çerçeveli ve bir okla R, G, B'yi gösteren üç hücreli tuple'a gidiyor: 111, 78, 55, altında her biri 0-255; Çıktı (111, 78, 55); ikinci soru: len(cup) kaç: 6, 8 ya da 48? İkinci tıklamada: 6: altı satır, her satırda sekiz piksel.</desc>
