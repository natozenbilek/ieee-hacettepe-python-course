<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 1152 538" width="1152" height="538" role="img" aria-labelledby="ders5-target-parts-t ders5-target-parts-d">
  <title id="ders5-target-parts-t">Ders 5'in hedef programı ve parçalarının geldiği dersler</title>
  <desc id="ders5-target-parts-d">Solda hedef programın on yedi anahtar satırı, atlanan yerler üç noktayla. Her satırın sağında o satırı kuran dersin numarası, sağ sütunda ne öğrendiğimiz: Ders 1 variable ve aritmetik (gpa = total_points / total_credits); Ders 2 f-string, :.2f, strip() ve if (strip satırı, if grade is None, report.write ve print); Ders 3 for, += ve [:3] (for line in f, departments.add(code[:3]), total_points +=); Ders 4 tuple (mavi-gri), function ve try (def weighted_points, try, except FileNotFoundError, unpacking ve (int(credits), grade)); Ders 5A None (bej), dict (kahverengi) ve set (zeytin yeşili) (GRADE_POINTS, latest_grade, items(), departments, is None); Ders 5B okuma ve yazma (open("transcript.txt"), for line in f, open("report.txt", "w"), report.write). Ders 5B satırları açık mavi bantta; sağdaki Ders 5B açık mavi, çivit mavisi çerçeveli.</desc>
  <!-- source: authoring/targets/target5.py (run_targets.py: '5 ders, 1 devam ediyor, 4 bölüm, AGNO: 3.08'); lines copied from the program, long lines cut after the last whole token (Python 3.14.8, 2026-10-13); if/elif labelled Ders 2 after DECISIONS.md "if before while" (2026-10-13) -->
