<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 1152 320" width="1152" height="320" role="img" aria-labelledby="ders2-and-or-eval-t ders2-and-or-eval-d" data-now="and">
  <title id="ders2-and-or-eval-t">and ve or: credits &gt;= 3 ile coefficient &gt;= 1.75</title>
  <desc id="ders2-and-or-eval-d">credits 3'ü (int, turuncu), coefficient 1.5'i (float, hardal sarısı) gösterir; kıyaslamalar True ve False (bool, deniz yeşili); and sonucu False. Solda iki lacivert isim etiketi: credits oktan 3'e, coefficient oktan 1.5'e. Sağda iki kıyaslama kutusu: credits &gt;= 3 aşağı okla True'ya, coefficient &gt;= 1.75 aşağı okla False'a. İki değerden birer ok ortadaki and kutusuna gider; sonucu belirleyen False'tan gelen ok koyu, True'dan gelen gri. and kutusundan bir ok sonuç kutusuna: False, açık mavi zeminli çivit mavisi çerçeve içinde. Altındaki çıktı panelinde False. (data-now="or": kutuda or, sonuç True, True'dan gelen ok koyu, False'tan gelen gri, çıktı True.)</desc>
  <!-- source: ders2-B.md S26, S28; credits = 3; coefficient = 1.5; credits >= 3 -> True; coefficient >= 1.75 -> False; print(credits >= 3 and coefficient >= 1.75) -> False; print(credits >= 3 or coefficient >= 1.75) -> True (Python 3.14.8, 2026-10-11). States: data-now="and" (S26), "or" (S28) -->
  <defs>
    <marker id="ders2-and-or-eval-ah" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah" d="M0,0 L12,6 L0,12 z"/></marker>
