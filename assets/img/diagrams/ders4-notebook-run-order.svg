<svg xmlns="http://www.w3.org/2000/svg" class="dg d4ro" viewBox="0 0 1152 440" width="1152" height="440" role="img" aria-labelledby="ders4-notebook-run-order-t ders4-notebook-run-order-d">
  <title id="ders4-notebook-run-order-t">Notebook'ta çalıştırma sırası</title>
  <desc id="ders4-notebook-run-order-d">Solda iki cell. Birincisi [1], içinde x = 10; altında: x = 5 iken çalıştı, sonra değişti. İkincisi henüz çalışmamış, içinde print(x). Altta soru: İkinci cell şimdi çalışırsa ne yazar? Sağda kernel'in İsimler paneli boş. Birinci tıklamada ikinci cell [2] olur ve altında 5 çıkar; İsimler'de x etiketi 5'i (int) gösterir; altta: Kernel, cell'leri çalıştırıldıkları sırayla hatırlar. İkinci tıklamada, Restart Kernel, sonra Run All: 5 silinir, x vurgulu 10'u (int) gösterir, ikinci cell'in altında 10; altında: Run All bütün cell'leri yukarıdan aşağıya çalıştırır.</desc>
  <!-- source: S751, kernel run 2026-11-06 (ipykernel, Python 3.14.8): x = 5, then print(x) -> 5 with cell 1 edited and not run; restart, x = 10, print(x) -> 10 -->
