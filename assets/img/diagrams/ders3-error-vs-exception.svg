<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 1152 280" width="1152" height="280" role="img" aria-labelledby="ders3-error-vs-exception-t ders3-error-vs-exception-d">
  <title id="ders3-error-vs-exception-t">Error ve exception</title>
  <desc id="ders3-error-vs-exception-d">İki sütunlu tablo. Sol başlık: Çalışmadan önce bulunur; altında SyntaxError ve IndentationError, en altta gri: hiçbir satır çalışmaz. Sağ başlık açık mavi, çivit mavisi çerçeveli, vurgulu: Çalışırken ortaya çıkar: exception; altında kırmızı NameError, TypeError, ValueError, IndexError ve ZeroDivisionError, en altta gri: önceki satırlar çalışmıştır; except yakalayabilir.</desc>
  <!-- source: classification for ders3-B.md S73: SyntaxError and IndentationError are raised when the file is compiled, before line 1 runs; the five others are raised at run time (checked on Python 3.14.8, 2026-10-11). -->
  <defs>

    <style>
