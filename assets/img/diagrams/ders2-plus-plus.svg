<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 1152 380" width="1152" height="380" role="img" aria-labelledby="ders2-plus-plus-t ders2-plus-plus-d">
  <title id="ders2-plus-plus-t">++ ve SyntaxError</title>
  <desc id="ders2-plus-plus-d">Üstte gri kod panelinde x = 5 ve x++ satırları; altında kırmızı şapka x++'nın bir karakter sağında ve kırmızı SyntaxError: invalid syntax. Altta üç sütun. Solda soluk gri başlık Java, C, JavaScript: soluk x++; ve x'i bir artırır. Ortada kırmızı başlık Python: x++ satırında ++ kırmızı yazılı ve altı kırmızı çizgiyle işaretli, kırmızı ok kırmızı SyntaxError'u gösterir. Sağda petrol mavisi başlık Python: x += 1, += 1 kısmı açık mavi bant ve çivit mavisi çerçeveyle vurgulu; altında lacivert x isim etiketi: eski oku gri ve kesik çizgili, 5'i gösterir; yeni oku düz, 6'yı gösterir; 5 ve 6 int (turuncu).</desc>
  <!-- source: ders2.md S171; x = 5; x++ -> SyntaxError: invalid syntax, caret one place after x++ (column 3); x = 5; x += 1; print(x) -> 6 (Python 3.14.8, 2026-10-11) -->
  <defs>
    <marker id="ders2-plus-plus-ah" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah" d="M0,0 L12,6 L0,12 z"/></marker>
    <marker id="ders2-plus-plus-ahm" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah-m" d="M0,0 L12,6 L0,12 z"/></marker>
