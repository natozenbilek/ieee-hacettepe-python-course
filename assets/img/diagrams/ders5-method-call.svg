<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 1152 470" width="1152" height="470" role="img" aria-labelledby="ders5-method-call-t ders5-method-call-d" data-state="pass">
  <title id="ders5-method-call-t">Değer döndüren method: d.weighted_points()</title>
  <desc id="ders5-method-call-d">Solda kod: GRADE_POINTS sözlüğü (C1 2.50, B2 3.00, F3 0.00), Course class'ı; __init__ code, credits ve grade'i self'e yazıyor; weighted_points() self.credits * GRADE_POINTS[self.grade] döndürüyor; has_passed() GRADE_POINTS[self.grade] &gt;= 1.75 döndürüyor; d = Course("MAT123", 4, "C1") ve print(d.weighted_points(), d.has_passed()). Sağda d.weighted_points() çağrısı: lacivert d etiketi Course object'ini gösteriyor; weighted_points çerçevesindeki self de aynı object'i gösteriyor (self = d). Object'te code "MAT123" (str, yeşil), credits 4 (int, turuncu), grade "C1" (str, yeşil). Altta okunan değerler: self.credits 4 (int, turuncu), GRADE_POINTS[self.grade] 2.5 (float, hardal sarısı); return, petrol mavisi okla 10.0 değerine (float, hardal sarısı) gidiyor; 10.0 çivit mavisi çerçeveli açık mavi bantta; yanında 4 * 2.5. Çıktı: 10.0 True. İkinci durumda (fail) son iki satır e = Course("BBM101", 3, "F3") ve print(e.weighted_points(), e.has_passed()); e.weighted_points() çağrısında self = e, object'te "BBM101", 3, "F3"; okunan değerler 3 ve 0.0; return 0.0 (float, açık mavi bantta), 3 * 0.0; çıktı 0.0 False.</desc>
  <!-- source: ders5-B S61-S62; runs weighted (10.0 True), weighted_fail (0.0 False), weighted_full (10.0 True 0.0 False); self.credits 4 / 3, GRADE_POINTS[self.grade] 2.5 / 0.0 (Python 3.14.8, 2026-10-11) -->
