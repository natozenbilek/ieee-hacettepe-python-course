  <text class="cd24" x="10" y="64">class Course:</text>
  <text class="cd24 pre" x="10" y="88" xml:space="preserve">    def __init__(self, code, credits, grade):</text>
  <text class="cd24 pre" x="10" y="112" xml:space="preserve">        self.code = code</text>
  <text class="cd24 pre" x="10" y="136" xml:space="preserve">        self.credits = credits</text>
  <text class="cd24 pre" x="10" y="160" xml:space="preserve">        self.grade = grade</text>
  <text class="cd24 pre" x="10" y="196" xml:space="preserve">    def weighted_points(self):</text>
  <text class="cd24 pre" x="10" y="220" xml:space="preserve">        return self.credits * GRADE_POINTS[self.grade]</text>
  <text class="cd24 pre" x="10" y="256" xml:space="preserve">    def has_passed(self):</text>
  <text class="cd24 pre" x="10" y="280" xml:space="preserve">        return GRADE_POINTS[self.grade] &gt;= <tspan class="t-float">1.75</tspan></text>
