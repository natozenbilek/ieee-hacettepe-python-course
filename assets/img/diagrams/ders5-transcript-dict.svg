<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 560 400" width="560" height="400" role="img" aria-labelledby="ders5-transcript-dict-t ders5-transcript-dict-d">
  <title id="ders5-transcript-dict-t">transcript.txt'den latest_grade dict'ine</title>
  <desc id="ders5-transcript-dict-d">Solda transcript.txt dosyası, beş satır (str, yeşil): MAT123;4;C1, FIZ127;3;B2, BBM101;3;F3, TKD103;2;A2, BBM101;3;A3. Üçüncü satır (BBM101;3;F3) gri ve üstü çizili; beşinci satır (BBM101;3;A3) çivit mavisi çerçeveli. Sağda latest_grade ismi (lacivert) aşağı bir okla dört satırlık bir dict'i (kahverengi) gösterir: "MAT123" ile "C1", "FIZ127" ile "B2", "BBM101" ile "A3", "TKD103" ile "A2"; key ve value'lar str (yeşil). Beşinci dosya satırından bir ok BBM101 satırına gider; bu satır çivit mavisi çerçeveli, value'su A3. Altında dict etiketi ve gri yazı: beş satır, dört ders.</desc>
  <!-- source: run u4 (ders5-A S91): latest_grade = {}; for line in transcript.txt: code, credits, grade = line.strip().split(";"); latest_grade[code] = grade; print(latest_grade) -> {'MAT123': 'C1', 'FIZ127': 'B2', 'BBM101': 'A3', 'TKD103': 'A2'}; print(len(latest_grade), "ders") -> 4 ders (Python 3.14.8, 2026-10-11) -->
  <defs>
    <marker id="ders5-transcript-dict-ah" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah" d="M0,0 L12,6 L0,12 z"/></marker>
