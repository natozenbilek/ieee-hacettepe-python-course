<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 560 440" width="560" height="440" role="img" aria-labelledby="ders1-console-open-t ders1-console-open-d">
  <title id="ders1-console-open-t">Python Console'u açmak</title>
  <desc id="ders1-console-open-d">Çizilmiş, sadeleştirilmiş bir PyCharm penceresi. 1: üstteki menüden View (çivit mavisi çerçeveli), açılan menüde Tool Windows, yanında Python Console (açık mavi, vurgulu). 2: ya da pencerenin altındaki araç çubuğunda &gt;_ simgeli Python Console düğmesi, çivit mavisi bir elipsle çevrili. 3: altta Python Console paneli açılır, &gt;&gt;&gt; ve imleç; buraya yazılır.</desc>
  <!-- source: PyCharm 2026.x menu path View, Tool Windows, Python Console; drawn, no screenshot (2026-10-10) -->
  <defs>
    <style>
