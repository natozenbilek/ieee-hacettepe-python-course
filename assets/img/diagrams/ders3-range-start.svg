<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 1152 300" width="1152" height="300" role="img" aria-labelledby="ders3-range-start-t ders3-range-start-d">
  <title id="ders3-range-start-t">range(3, 6): yalnızca başla değişti</title>
  <desc id="ders3-range-start-d">İki sayı doğrusu, aynı yerlerde. Üstteki soluk ve gri: range(1, 6), 1'den 5'e gri noktalar, 6'da gri içi boş daire. Alttaki: range(3, 6), 3, 4 ve 5'te dolu turuncu noktalar ve turuncu rakamlar (int), 6'da içi boş çivit mavisi daire. 3'ün üstünde başla = 3, açık mavi ve çivit mavisi çerçeveli bantta (değişen tek şey); 6'nın üstünde bitiş = 6, dahil değil. Sağda Çıktı: 3, 4, 5.</desc>
  <!-- source: for i in range(3, 6): print(i) -&gt; 3 / 4 / 5 (Python 3.14.8, 2026-10-10) -->
