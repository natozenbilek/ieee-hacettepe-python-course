  <title id="ders4-build-transcript-t">Uygulama 2: transcript'i kurmak</title>
  <desc id="ders4-build-transcript-d">Üstte "MAT123 4 C1" str'si (yeşil) split() ile üç str parçaya ayrılıyor: "MAT123", "4", "C1"; ortadaki "4" int() ile 4 (int, turuncu) oluyor. Ortada transcript ismi (lacivert) üç tuple'lık (mavi-gri) bir list'i (vişneçürüğü) gösteriyor: "MAT123", 4, "C1"; "FIZ127", 3, "B2"; "TKD103", 2, "A2"; ilk satır açık mavi, çivit mavisi çerçeveli. Altta çıktı: 3 9 ve ('MAT123', 4, 'C1').</desc>
  <!-- source: lines -> split() -> (parts[0], int(parts[1]), parts[2]) appended; print(len(transcript), total) -> 3 9; print(transcript[0]) -> ('MAT123', 4, 'C1') (Python 3.14.8, 2026-10-10) -->
