<svg xmlns="http://www.w3.org/2000/svg" class="dg spl" viewBox="0 0 1152 260" width="1152" height="260" role="img" aria-labelledby="ders4-split-t ders4-split-d" data-state="space">
  <title id="ders4-split-t">split(): str'den list'e</title>
  <desc id="ders4-split-d">space durumu: MAT123 4 C1 str'si (yeşil) karakter karakter hücrelerde; iki boşluk hücresi çivit mavisi çerçeveli ve üstlerinde ayırıcı yazıyor. split() oku, üç str item'lık bir list'e (vişneçürüğü) gidiyor: MAT123, 4, C1. semicolon durumu: üst satır gri; altta MAT123;4;C1 str'sinde iki noktalı virgül hücresi çerçeveli ve ayırıcı; split(";") aynı üç item'lık list'i veriyor.</desc>
  <!-- source: "MAT123 4 C1".split() -> ['MAT123', '4', 'C1'] (spaces at index 6 and 8); "MAT123;4;C1".split(";") -> ['MAT123', '4', 'C1'] (Python 3.14.8, 2026-10-10). States: space (S24), semicolon (S25). -->
