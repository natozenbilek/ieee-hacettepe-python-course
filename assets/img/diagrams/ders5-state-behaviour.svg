<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 1152 240" width="1152" height="240" role="img" aria-labelledby="ders5-state-behaviour-t ders5-state-behaviour-d">
  <title id="ders5-state-behaviour-t">Bir Course object'inin durumu ve davranışı</title>
  <desc id="ders5-state-behaviour-d">Course object (MAT123) başlıklı tek bir object kutusu, çivit mavisi kesikli bir çizgiyle iki sütuna bölünmüş. Sol sütun durum: code "MAT123" (str, yeşil), credits 4 (int, turuncu), grade "C1" (str, yeşil). Sağ sütun davranış, başlığı açık mavi zeminde çivit mavisi çerçeveli: weighted_points() 10.0 (float, hardal sarısı) verir, has_passed() True (bool, deniz yeşili) verir.</desc>
  <!-- source: ders5-B.md S23, run weighted: d = Course("MAT123", 4, "C1"); print(d.weighted_points(), d.has_passed()) -&gt; 10.0 True (Python 3.14.8, 2026-10-11) -->
