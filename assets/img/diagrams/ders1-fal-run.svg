<svg xmlns="http://www.w3.org/2000/svg" class="dg tt-ders1-fal-run" viewBox="0 0 560 512" width="560" height="512" role="img" aria-labelledby="ders1-fal-run-t ders1-fal-run-d">
  <title id="ders1-fal-run-t">Kahve falı: fincan, kulp ve telve</title>
  <desc id="ders1-fal-run-d">Beyaz zemin üzerinde, yukarıdan görülen bir kahve fincanı: koyu lacivert iki iç içe daire fincanın ağzını, sağda ona değen iki küçük iç içe daire kulpu çiziyor. Fincanın içine rastgele büyüklükte 100 koyu kahverengi telve noktası serpilmiş: 40'ı sol alt çeyrekte, 23'ü sol üstte, 21'i sağ üstte, 16'sı sağ altta. Program en kalabalık çeyreği, sol altı seçti ve Mehmet'in falını yazdı: Bir yılan görüyorum; korkmayın, bu Python.</desc>
  <!-- source: fal.py run under tools/turtle_svg.py on Python 3.14.8, random.seed(179) set by the runner; colours mapped to the course palette; stdin Mehmet; per quarter (counts): sağ üst 21, sol üst 23, sol alt 40, sağ alt 16; output: Telvenin çoğu sol alt çeyrekte: 40 tane. / Mehmet, falınız şöyle: / Bir yılan görüyorum; korkmayın, bu Python. / Bu fal, fal.txt dosyasının sonuna eklendi. / Falınıza bir sayaç ile bir if baktı; tutarsa tesadüf. (Run window text: authoring/targets/fal-run.txt) -->
