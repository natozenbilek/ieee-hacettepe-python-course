<svg xmlns="http://www.w3.org/2000/svg" class="dg tt-fun-turtle-race" viewBox="0 0 1152 512" width="1152" height="512" role="img" aria-labelledby="fun-turtle-race-t fun-turtle-race-d">
  <title id="fun-turtle-race-t">Kaplumbağa yarışı: bir class, dört object</title>
  <desc id="fun-turtle-race-d">Beyaz zemin üzerinde dört kaplumbağa soldan sağa yarışıyor, her biri kendi renginde bir iz bırakıyor: yukarıdan aşağıya kırmızı, çivit mavisi, yeşil ve turuncu. Sağda dikey siyah bir bitiş çizgisi var. Çivit mavisi kaplumbağa bitiş çizgisine ilk ulaşıyor; program Mavi kazandı yazıyor. Kaydedilen yarış random.seed(1) ile alındı; kaplumbağa şekilleri okunabilsin diye iki kat büyük çizildi.</desc>
  <!-- source: d5_race.py run under tools/turtle_svg.py on Python 3.14.8, random.seed(1) set by the runner, turtle shapes drawn 2 times larger; colours mapped to the course palette -->
