<svg xmlns="http://www.w3.org/2000/svg" class="dg eca" viewBox="0 0 1152 410" width="1152" height="410" role="img" aria-labelledby="ders2-convert-adim-t ders2-convert-adim-d">
  <title id="ders2-convert-adim-t">int(), float() ve str() ile çevirim ve sonrası</title>
  <desc id="ders2-convert-adim-d">Açıkça type conversion, üç satır, her satırda değer, function kutusu ve sonuç oklarla bağlı, type etiketi kutunun sağında. Satır 1: "4" (str, yeşil), int() kutusu, 4 (int, turuncu). Satır 2: "3.25" (str, yeşil), float() kutusu, 3.25 (float, hardal sarısı). Satır 3: 4 (int, turuncu), str() kutusu, "4" (str, yeşil). Altta gri bir kod panelinde print(int("4"), float("3.25"), str(4)); sağdaki Çıktı panelinde 4 3.25 4. Tıklayınca kod panelinin ikinci satırı print(int("4") + 1, float("3.25"), str(4) + "4") ve Çıktı'nın ikinci satırı 5 3.25 44 gelir; 44 açık mavi, çivit mavisi çerçeveli bir bantta, yanında str + str. En altta: Çevrilen değer, yeni type'ının işlemcileriyle kullanılır.</desc>
  <!-- source: ders2.md S60 with S61 merged into it; rows copied from ders2-explicit-convert.svg. print(int("4"), float("3.25"), str(4)) -> 4 3.25 4; print(int("4") + 1, float("3.25"), str(4) + "4") -> 5 3.25 44 (Python 3.14.8, 2026-10-23). Built by authoring/builder-paralel/ders2-birlestir.py. -->
