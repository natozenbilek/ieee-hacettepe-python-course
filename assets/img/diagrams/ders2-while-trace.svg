<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 1152 340" width="1152" height="340" role="img" aria-labelledby="ders2-while-trace-t ders2-while-trace-d">
  <title id="ders2-while-trace-t">while loop iz tablosu</title>
  <desc id="ders2-while-trace-d">İz tablosu, sütunlar: soru, i (başta), i &gt; 0, çıktı, i (sonra). 1. soru: i 3, True, çıktı 3, sonra i 2. 2. soru: i 2, True, çıktı 2, sonra i 1. 3. soru: i 1, True, çıktı 1, sonra i 0. 4. soru: i 0, False, loop biter; bu satır açık mavi ve çivit mavisi çerçeveli. i değerleri int (turuncu), True ve False bool (deniz yeşili); çıktı sütunu düz yazı. Tablonun altındaki satır: print("Bitti") ("Bitti" str, yeşil), ok çıktıya gider: Bitti; yanında: loop bittikten sonra bir kez. Şart dört kez sorulur, block üç kez çalışır.</desc>
  <!-- source: ders2-B.md S53; i = 3 / while i > 0: / print(i) / i = i - 1 / print("Bitti") -> 3 / 2 / 1 / Bitti; condition checked 4 times: 3 > 0, 2 > 0, 1 > 0 True, 0 > 0 False (Python 3.14.8, 2026-10-11) -->
