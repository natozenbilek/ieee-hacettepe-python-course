<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 1152 340" width="1152" height="340" role="img" aria-labelledby="ders1-f1-lap-split-t ders1-f1-lap-split-d">
  <title id="ders1-f1-lap-split-t">78792 milisaniye // ve % ile dakika, saniye ve milisaniyeye ayrılıyor</title>
  <desc id="ders1-f1-lap-split-d">İki adımda bir tur süresi. 1. adım, dakika: 78792 // 60000 sonucu 1 (int, turuncu), 78792 % 60000 sonucu 18792 (int, turuncu). Altında 78792 milisaniyelik turuncu bir çubuk iki parçaya bölünmüş: solda 60000, yani 1 tam dakika, sağda artan 18792; sağdaki parça çivit mavisi çerçeveli açık mavi bir bantla vurgulu. İki ince çizgi bu 18792'lik parçayı alttaki çubuğa büyütüyor. 2. adım, saniye: 18792'lik çubuk her biri 1000 milisaniye olan 18 eşit turuncu kutuya ve sonda 792'lik dar bir kutuya bölünmüş; dar kutu çivit mavisi çerçeveli açık mavi bantla vurgulu. 18 kutunun altındaki parantezde 18 tam saniye ve 18792 // 1000, dar kutunun altında artan 792 ms ve 18792 % 1000 yazıyor. Sağda sonuç: 1:18.792; 1, 18 ve 792 turuncu.</desc>
  <!-- source: print(78792 // 60000, 78792 % 60000) -> 1 18792; print(18792 // 1000, 18792 % 1000) -> 18 792 (Python 3.14.8, 2026-10-11). Bar 1000 px: 60000/78792 of it is 761.5 px, 18792 is 238.5 px; row 2: 18 cells of 1000/18792 * 1000 = 53.21 px and 792 ms = 42.15 px -->
