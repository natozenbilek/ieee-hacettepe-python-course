<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 1152 330" width="1152" height="330" role="img" aria-labelledby="ders1-dropbox-py-t ders1-dropbox-py-d">
  <title id="ders1-dropbox-py-t">Dropbox: tek dosyadan bir milyon satıra</title>
  <desc id="ders1-dropbox-py-d">Solda dropbox.py adlı tek bir file simgesi; üstünde 2007, altında ilk prototip, Houston'a göre. Sağa giden bir ok, üstünde 12 yıl sonra. Sağda kısa ve uzun satırlarla dolu bir kod paneli, üstünde 2019, masaüstü uygulaması; panelin ortasında açık mavi, çivit mavisi çerçeveli kutuda 1.000.000'dan fazla satır Python. Kaynaklar: D. Houston, Dropbox.Tech, 7 Aralık 2012; C. Yang, Dropbox.Tech, 6 Şubat 2019.</desc>
  <!-- source: lore.json L1-07 (Houston 2012: first prototype saved as dropbox.py; Yang 2019: over one million lines of Python in the desktop client); no code to run -->
