<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 560 380" width="560" height="380" role="img" aria-labelledby="ders5-student-memory-t ders5-student-memory-d">
  <title id="ders5-student-memory-t">Uygulama 8: programın sonunda iki Student object'i</title>
  <desc id="ders5-student-memory-d">a ve b isimleri (lacivert) iki ayrı Student object'ini gösteriyor. a'nın object'inde name, "Zehra" değerini (str, yeşil) gösterir; scores, içinde 80 ve 90 olan bir list'i (vişneçürüğü; içindeki int'ler turuncu) gösterir; bu list açık mavi bant ve çivit mavisi çerçeve içinde. b'nin object'inde name "Mehmet", scores içinde yalnızca 75 olan bir list. Altta: Programın sonunda memory. Çıktı: Zehra 85.0 Mehmet 75.0.</desc>
  <!-- source: Uygulama 8 model çözümü (run u8): a = Student("Zehra"), a.add_score(80), a.add_score(90), b = Student("Mehmet"), b.add_score(75); print -> 'Zehra 85.0 Mehmet 75.0'; a.scores [80, 90], b.scores [75] (Python 3.14.8, 2026-10-11) -->
  <defs>
