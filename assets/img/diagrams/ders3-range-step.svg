  <title id="ders3-range-step-t">range(0, 10, 3): adım</title>
  <desc id="ders3-range-step-d">Üstte range(0, 10, 3). 0'dan 10'a sayı doğrusu: 0, 3, 6 ve 9'da dolu turuncu noktalar ve turuncu rakamlar (int); 10'da içi boş çivit mavisi daire, üstünde bitiş = 10, dahil değil. Noktaların üstünde 0'dan 3'e, 3'ten 6'ya ve 6'dan 9'a üç atlama oku, her birinde +3; üstte açık mavi, çivit mavisi çerçeveli kutuda adım = 3. Sağda Çıktı: 0, 3, 6, 9.</desc>
  <!-- source: for i in range(0, 10, 3): print(i) -&gt; 0 / 3 / 6 / 9 (Python 3.14.8, 2026-10-10) -->
