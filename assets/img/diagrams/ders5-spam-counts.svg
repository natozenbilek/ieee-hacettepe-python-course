  <title id="ders5-spam-counts-t">Spam ve normal e-postalarda kelime sayıları</title>
  <desc id="ders5-spam-counts-d">İki dict (kahverengi çerçeve, altlarında dict etiketi), lacivert isimlerin altında. Solda spam_counts (üstünde spam yazar): "bedava" 3, "telefon" 1, "kazandınız" 1, "tatil" 1, "fırsatı" 1, "hemen" 1, "tıklayın" 1, "hediye" 1; bedava satırı çivit mavisi çerçeveli. Sağda normal_counts (üstünde normal yazar): "yarın" 1, "lab" 2, "var" 1, "ödev" 1, "pazar" 1, "günü" 1, "notları" 1, "ekte" 1. Kelimeler str (yeşil), sayılar int (turuncu). Satırlar kelimelerin ilk görüldüğü sırada.</desc>
