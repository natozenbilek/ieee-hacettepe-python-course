<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 1152 400" width="1152" height="400" role="img" aria-labelledby="ders5-dict-uses-t ders5-dict-uses-d">
  <title id="ders5-dict-uses-t">dict'in üç kullanım alanı</title>
  <desc id="ders5-dict-uses-d">Üç sütun, her biri bir dict (kahverengi çerçeve, altında dict etiketi), isimleri lacivert. 1: ders kodu, ok, harf notu. grades = {"MAT123": "C1", "FIZ127": "B2"}; key'ler ve value'lar str (yeşil). 2: plaka kodu, ok, il. plates = {6: "Ankara", 34: "İstanbul"}; key'ler int (turuncu), value'lar str (yeşil); 34 satırı çivit mavisi çerçeveli: key'in str olması gerekmez. 3: harf notu, ok, katsayı. points = {"A1": 4.0, "B1": 3.25}; key'ler str (yeşil), value'lar float (hardal sarısı). Altta print(grades["MAT123"], plates[34], points["B1"]) ve Çıktı: C1 İstanbul 3.25.</desc>
  <!-- source: grades, plates, points; print(grades['MAT123'], plates[34], points['B1']) -> C1 İstanbul 3.25 (run uses; Python 3.14.8, 2026-10-11) -->
  <defs>
