  <title id="ders3-square-rows-t">Satır kurmak: kare</title>
  <desc id="ders3-square-rows-d">Solda altı satırlık kod: n = 3, for i in range(1, n + 1):, row = "", for j in range(3):, row += "*", print(row); sayılar turuncu (int), "" ve "*" yeşil (str). 3. satır row = "" açık mavi, çivit mavisi çerçeveli bantta. 3-6. satırları bir köşeli ayraç topluyor: önceki slayttaki satırlar. Sağda i = 1, i = 2, i = 3 başlıklı üç satır (değerler turuncu): her biri "" ile başlıyor ve üç yeşil * hücresi (str); her satırın sonundan bir ok çıktı satırına gider: ***, ***, ***.</desc>
  <!-- source: square: n = 3; for i in range(1, n + 1): row = ""; for j in range(3): row += "*"; print(row) -&gt; *** / *** / *** (Python 3.14.8, 2026-10-10) -->
