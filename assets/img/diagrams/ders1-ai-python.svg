<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 1152 360" width="1152" height="360" role="img" aria-labelledby="ders1-ai-python-t ders1-ai-python-d">
  <title id="ders1-ai-python-t">Yapay zeka araçları ve Python</title>
  <desc id="ders1-ai-python-d">Üç katman, aralarında aşağı oklar. Üstte Python, sizin yazdığınız satırlar (açık mavi, çivit mavisi çerçeveli bantta). Ortada Python için yazılmış hazır araçlar: PyTorch, TensorFlow, NumPy; TensorFlow ile NumPy'dan çıkan bir çizgi sağdaki notta birleşir: AlphaFold, Ders 5'te. Altta CPU ve GPU, ağır hesap. Kaynaklar: PyTorch ve TensorFlow GitHub sayfaları (2026); Jumper vd., Nature 596 (2021); Harris vd., Nature 585 (2020).</desc>
  <!-- source: authoring/lessons/ders1.md S45; PyTorch README 'PyTorch is a Python package', TensorFlow README 'stable Python and C++ APIs'; AlphaFold methods (Jumper et al. 2021) name TensorFlow, NumPy and Python; no code to run -->
