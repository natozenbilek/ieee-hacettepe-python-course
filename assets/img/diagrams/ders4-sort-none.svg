  <title id="ders4-sort-none-t">Değiştiren method'lar None verir</title>
  <desc id="ders4-sort-none-d">result durumu: solda kod grades = ["C1", "B2"], result = grades.append("A2"), print(grades, result); çıktı ['C1', 'B2', 'A2'] None. Sağda grades ismi (lacivert) C1, B2, A2'yi (str, yeşil) tutan list'i (vişneçürüğü), result ismi None değerini (NoneType, bej) gösteriyor; None açık mavi, çivit mavisi çerçeveli şeridin içinde. Altta: pop() ise çıkardığı item'ı verir. mistake durumu: kod grades = ["C1", "A2"], grades = grades.sort(), kırmızı çerçeveli grades.append("B1"). grades ismi artık None'ı (bej) gösteriyor, yeni ok açık mavi şeridin üzerinde; sıralanmış [A2, C1] list'i gri ve ona giden eski ok gri ve kesikli, yanında eski bağ; o list'i gösteren isim kalmadı. Altta kırmızı: AttributeError: 'NoneType' object has no attribute 'append'.</desc>
  <!-- source: result = grades.append("A2") -> ['C1', 'B2', 'A2'] None; grades = grades.sort(); grades.append("B1") -> AttributeError: 'NoneType' object has no attribute 'append' (Python 3.14.8, 2026-10-10). States: result (S45), mistake (S49). -->
