  <title id="ders3-f1-best-zero-t">En hızlı tur: best 0'dan başlarsa</title>
  <desc id="ders3-f1-best-zero-d">İki yan yana tablo, ortada ince bir ayırıcı çizgi. Solda kodun ilk satırı best = 0; 0 turuncu (int), kırmızı çerçeveli açık kırmızı bir şeridin içinde. Altında trace tablosu, sütunlar tur, lap, lap &lt; best ve best: tur 1'de lap 82431, lap &lt; best False, best 0; tur 2'de 81976, False, 0; tur 3'te 82104, False, 0; tur 4'te 82650, False, 0. Dört turda da lap &lt; best False, best 0 kalıyor. En altta Run penceresi: En hızlı tur: 0, yanında kırmızı yazıyla error message yok. Sağda ilk satır best = 999999; 999999 turuncu (int), açık mavi, çivit mavisi çerçeveli bir şeridin içinde. Tablo: tur 1'de 82431, True, best 82431; tur 2'de 81976, True, 81976; tur 3'te 82104, False, 81976; tur 4'te 82650, False, 81976. Run penceresi: En hızlı tur: 81976. Sayılar int (turuncu), True ve False bool (deniz yeşili) kutucuklarda.</desc>
  <!-- source: ders3 S49/S50: best = 0 / best = 999999; for i in range(4): lap = int(input("Tur (ms): ")); if lap &lt; best: best = lap; print("En hızlı tur:", best); stdin 82431, 81976, 82104, 82650 -&gt; En hızlı tur: 0 / En hızlı tur: 81976; per turn lap, lap &lt; best, best: 0 start False 0 x4; 999999 start True 82431 / True 81976 / False 81976 / False 81976 (Python 3.14.8, 2026-10-11) -->
