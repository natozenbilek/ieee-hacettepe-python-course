<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 1152 260" width="1152" height="260" role="img" aria-labelledby="ders1-dynamic-typing-t ders1-dynamic-typing-d">
  <title id="ders1-dynamic-typing-t">Dynamically typed: type value'dadır, isimde değil</title>
  <desc id="ders1-dynamic-typing-d">Solda lacivert x isim etiketi; altındaki type yuvası boş ve üstü çizili, altında isimde type yok yazıyor. x'ten 7 değerine (int, turuncu) giden eski ok gri ve kesikli; 7'nin altındaki yuvada int yazıyor. x'ten "yedi" değerine (str, yeşil) giden yeni ok, çivit mavisi çerçeveli açık mavi şeridin üzerinde; "yedi"nin altındaki yuvada str yazıyor. Sağda çıktı paneli: &lt;class 'int'&gt; ve &lt;class 'str'&gt;. Özet: x önce 7'yi (int, turuncu), sonra "yedi"yi (str, yeşil) gösterir; type'lar value'ların altında, ismin altında type yok.</desc>
  <!-- source: x = 7 / print(type(x)) / x = "yedi" / print(type(x)) -> &lt;class 'int'&gt;, &lt;class 'str'&gt; (Python 3.14.8, 2026-10-11) -->
  <defs>
    <marker id="ders1-dynamic-typing-ah" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah" d="M0,0 L12,6 L0,12 z"/></marker>
    <marker id="ders1-dynamic-typing-ahm" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah-m" d="M0,0 L12,6 L0,12 z"/></marker>
    <style>
