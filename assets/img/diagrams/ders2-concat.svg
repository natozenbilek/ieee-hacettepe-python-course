<svg xmlns="http://www.w3.org/2000/svg" class="dg cc" viewBox="0 0 1152 420" width="1152" height="420" role="img" aria-labelledby="ders2-concat-t ders2-concat-d" data-focus="space">
  <title id="ders2-concat-t">+ işlemcisi ve str</title>
  <desc id="ders2-concat-d">Üç satırlık + ve str resmi; her satırda yeşil str kutuları, aralarında + işareti ve sağda sonucu gösteren bir ok. Sonuç kutusunun altında type etiketi str ve print()'in yazdığı satır, tırnaksız. Satır 1: "Hacettepe" + " " + "Üniversitesi" sonucu "Hacettepe Üniversitesi" (str, yeşil); ortadaki kutu tek bir boşluk tutar, boşluk ortasında çivit mavisi bir nokta olan küçük bir hücreyle gösterilir; yazdırılan satır Hacettepe Üniversitesi. Satır 2: "Hacettepe" + "Üniversitesi" sonucu "HacettepeÜniversitesi" (str, yeşil); yazdırılan satır HacettepeÜniversitesi, araya boşluk girmez. Satır 3: lacivert name ismi "Mehmet" (str, yeşil) değerini gösteriyor; ince bir çizginin sağında "Merhaba " (sondaki boşluk noktalı hücreyle) + name sonucu "Merhaba Mehmet" (str, yeşil); yazdırılan satır Merhaba Mehmet. data-focus space durumunda satır 1'in sonucu çivit mavisi çerçeveli açık mavi şeritte, satır 2 ve 3 gri. nospace durumunda satır 2'nin sonucu şeritte, satır 1 ve 3 gri. name durumunda satır 3'ün sonucu şeritte, satır 1 ve 2 gri.</desc>
  <!-- source: ders2-A.md S16-S18; print("Hacettepe" + " " + "Üniversitesi") -> Hacettepe Üniversitesi; print("Hacettepe" + "Üniversitesi") -> HacettepeÜniversitesi; name = "Mehmet"; print("Merhaba " + name) -> Merhaba Mehmet (name per DECISIONS.md "Example names"). Python 3.14.8, 2026-10-11. States by data-focus on the root: space, nospace, name. -->
  <defs>
    <marker id="ders2-concat-ah" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah" d="M0,0 L12,6 L0,12 z"/></marker>
    <marker id="ders2-concat-ahm" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah-m" d="M0,0 L12,6 L0,12 z"/></marker>
