  <title id="ders1-decimal-comma-t">Ondalık virgül</title>
  <desc id="ders1-decimal-comma-d">İki satır. Üstte print(3,5 + 2): virgül kırmızı kesikli bir elipsle çevrili; altındaki iki köşeli çizgi parantezin içini iki argument'a ayırıyor: 1. argument 3 (int, turuncu), 2. argument 5 + 2, oku 7'ye (int, turuncu) gidiyor. Çıktı panelinde 3 7 ve kırmızı yazı: hata yok, sonuç yanlış. Altta print(3.5 + 2): nokta açık mavi, çivit mavisi çerçeveli bir şeritte, 3.5 float (hardal sarısı); Çıktı panelinde 5.5.</desc>
  <!-- source: print(3,5 + 2) -&gt; 3 7; print(3.5 + 2) -&gt; 5.5 (Python 3.14.8, 2026-10-10) -->
