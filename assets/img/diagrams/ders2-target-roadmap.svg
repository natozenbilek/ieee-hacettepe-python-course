<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 1152 420" width="1152" height="420" role="img" aria-labelledby="ders2-target-roadmap-t ders2-target-roadmap-d">
  <title id="ders2-target-roadmap-t">Hedef programın parçaları</title>
  <desc id="ders2-target-roadmap-d">Solda PyCharm Run penceresi, beş satır: Ders kodu:  mat123 / Kredi: 4 / Puan (0-100): 66 / MAT123: 66 puan, katsayı 2.50, geçti / 4 x 2.50 = 10.00; kullanıcının yazdığı kısımlar petrol mavisi. Sağda yukarıdan aşağı etiketler, her biri düz bir çizgiyle çıktıdaki yerine bağlı. Bu yarının etiketleri çivit mavisi düz çerçeveli: 3. input() ilk satırdaki Ders kodu: sorusuna, 4. int() Kredi: 4 satırına, 6. strip(), upper() MAT123'ün üstündeki ayraca, 5. f-string, :.2f son satırdaki 10.00'ın altındaki ayraca. Aradan sonraki etiketler gri kesik çerçeveli: 11. elif katsayı 2.50'nin üstündeki ayraca, 10. if ve else geçti kelimesinin altındaki ayraca. En altta örnek: düz çerçeve 2A, kesik çerçeve 2B.</desc>
  <!-- source: authoring/targets/target2.py run by authoring/targets/run_targets.py with ' mat123', 4, 66 (Python 3.14.8, 2026-10-13); the five lines are that run verbatim; line pitch 60 so that the leaders run in the gaps between lines Updated on 2026-10-23 by authoring/builder-paralel/ders2-index.py: 2B's section numbers moved up by one (new 7. Index, len() ve slicing in 2A) -->
