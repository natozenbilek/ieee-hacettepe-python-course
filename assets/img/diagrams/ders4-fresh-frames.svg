<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 1152 400" width="1152" height="400" role="img" aria-labelledby="ders4-fresh-frames-t ders4-fresh-frames-d">
  <title id="ders4-fresh-frames-t">Her call boş bir frame ile başlar</title>
  <desc id="ders4-fresh-frames-d">Solda kod: def count_once():, girintili count = 0, count += 1, return count, boş satır, print(count_once(), count_once()). Sağda iki ayrı count_once frame'i, 1. call ve 2. call. Her birinde lacivert count etiketinden gri kesik ok eski 0'a (gri), düz ok 1'e (int, turuncu) gidiyor. Her frame'in altından petrol mavisi return oku 1'e (int, turuncu) iniyor. İkinci frame'in başlığı açık mavi, çivit mavisi çerçeveli bantla vurgulu; altında yeniden 0'dan başladı. Çıktı: 1 1.</desc>
