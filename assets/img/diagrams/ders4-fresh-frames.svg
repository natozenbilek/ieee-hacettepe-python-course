  <text class="cd24" x="18" y="44">def count_once():</text>
  <text class="cd24 pre" x="18" y="78" xml:space="preserve">    count = 0</text>
  <text class="cd24 pre" x="18" y="112" xml:space="preserve">    count += 1</text>
  <text class="cd24 pre" x="18" y="146" xml:space="preserve">    return count</text>
  <text class="cd24" x="18" y="214">print(count_once(), count_once())</text>
