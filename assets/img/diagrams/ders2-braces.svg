<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 1152 300" width="1152" height="300" role="img" aria-labelledby="ders2-braces-t ders2-braces-d">
  <title id="ders2-braces-t">Java'da süslü parantez, Python'da indentation</title>
  <desc id="ders2-braces-d">İki sütun ve bir alt satır. Solda soluk gri renkte Java'da block: if (x &gt; 0) {, sonra içeride x = x - 1;, sonra }; iki süslü parantez kesik çizgili elipslerle çevrili ve süslü parantez diye etiketli. Sağda Python'da block: if x &gt; 0:, sonra dört boşluk içeriden x = x - 1 (0 ve 1 int, turuncu); baştaki dört boşluk açık mavi bant üstünde dört çivit mavisi nokta olarak çizili ve çivit mavisi çerçeveyle vurgulu, altında indentation yazıyor. Altta Önizleme etiketli bir satır: from __future__ import braces ve onun altında kırmızı SyntaxError: not a chance.</desc>
  <!-- source: ders2.md S179, redrawn 2026-10-13 for the if swap (DECISIONS.md "if before while"); from __future__ import braces -> SyntaxError: not a chance (Python 3.14.8); the Python block run with x = 3 ends with x = 2 -->
  <defs>
    <style>
