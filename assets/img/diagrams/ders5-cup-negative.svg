  <title id="ders5-cup-negative-t">cup ve negative: 255 - değer</title>
  <desc id="ders5-cup-negative-d">Solda cup (beyaz zemin, kahverengi fincan) ve 255 - değer oku; sağda soru: Beyaz zemin negatifte ne renk olur? Birinci tıklamada negative (siyah zemin, açık mavi fincan, koyu gri buhar) ve (255, 255, 255) → (0, 0, 0): siyah. İkinci tıklamada kahve: (111, 78, 55) → (144, 177, 200).</desc>
