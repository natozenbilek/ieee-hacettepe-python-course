<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 1152 460" width="1152" height="460" role="img" aria-labelledby="ders3-elif-runs-t ders3-elif-runs-d">
  <title id="ders3-elif-runs-t">elif: 92, 77 ve 40 ile üç çalışma</title>
  <desc id="ders3-elif-runs-d">Aynı elif zinciri üç satırda, her satırda başka bir score. Her satırda score &gt;= 85 baklavası, False ile score &gt;= 50 baklavası, False ile else kutusu; her birinin altında True ile çalışan kutu: print("A3 ve üstü"), print("geçti"), print("kaldı"). score = 92 (turuncu, int): ilk True oku petrol mavisi, print("A3 ve üstü") açık mavi ve çivit mavisi çerçeveli; geri kalan baklava ve kutular gri; Çıktı: A3 ve üstü; not: gerisi atlandı. score = 77: ilk False oku koyu, ikinci True oku petrol mavisi, print("geçti") vurgulu; else satırı gri; Çıktı: geçti; not: else atlandı. score = 40: iki False oku koyu, else kutusundan print("kaldı") vurgulu; Çıktı: kaldı. Her satırda tek bir dal çalışır.</desc>
  <!-- source: elif_92 -&gt; A3 ve üstü; elif_77 -&gt; geçti; elif_40 -&gt; kaldı (S55 code) (Python 3.14.8, 2026-10-10) -->
