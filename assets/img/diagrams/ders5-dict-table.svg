  <title id="ders5-dict-table-t">GRADE_POINTS: harf notlarından katsayılara bir dict</title>
  <desc id="ders5-dict-table-d">Üstte kod: GRADE_POINTS = {"A1": 4.00, "A2": 3.75, "A3": 3.50, "B1": 3.25, "B2": 3.00, "B3": 2.75, "C1": 2.50, "C2": 2.25, "C3": 2.00, "D": 1.75, "F1": 0.00, "F2": 0.00, "F3": 0.00, "F6": 0.00} altı satıra bölünmüş, son satır print(GRADE_POINTS["B1"]); çıktı 3.25. Altta GRADE_POINTS ismi (lacivert) on dört satırlık bir dict'i (kahverengi) gösterir; tablo iki blok halinde, her blokta key ve value sütunları: A1 4.0, A2 3.75, A3 3.5, B1 3.25, B2 3.0, B3 2.75, C1 2.5; C2 2.25, C3 2.0, D 1.75, F1 0.0, F2 0.0, F3 0.0, F6 0.0. Harf notları str (yeşil), katsayılar float (hardal sarısı), Python'un sakladığı biçimde (4.00 yazılır, 4.0 saklanır). B1 satırı çivit mavisi çerçeveli; çıktı 3.25.</desc>
  <!-- source: S17, run gp_b1: print(GRADE_POINTS["B1"]) -> 3.25; len(GRADE_POINTS) 14; the dict prints as {'A1': 4.0, 'A2': 3.75, 'A3': 3.5, 'B1': 3.25, 'B2': 3.0, 'B3': 2.75, 'C1': 2.5, 'C2': 2.25, 'C3': 2.0, 'D': 1.75, 'F1': 0.0, 'F2': 0.0, 'F3': 0.0, 'F6': 0.0} (Python 3.14.8, 2026-10-11). The table is the one ders5-B and odev5.py use. -->
