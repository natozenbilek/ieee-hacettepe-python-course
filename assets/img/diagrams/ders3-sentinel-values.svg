  <title id="ders3-sentinel-values-t">Sentinel: 5, 7 ve 0</title>
  <desc id="ders3-sentinel-values-d">Yazılan ve int() ile çevrilen üç değer alt alta, her biri turuncu bir int kutusunda, altında int etiketi: 5, 7 ve 0. 5 ve 7'den çıkan iki ok toplama yazısına gider. 0 kutusu açık mavi, çivit mavisi çerçeveli bantla vurgulu; sağında sentinel yazıyor ve ondan çıkan ok break kelimesine gider.</desc>
  <!-- source: ders3-B.md S12 run sentinel: stdin 5, 7, 0 -> Sayı: 5 / Sayı: 7 / Sayı: 0 / Toplam: 12; 5 and 7 added, 0 breaks before total += number (Python 3.14.8, 2026-10-11) -->
