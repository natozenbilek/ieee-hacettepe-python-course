<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 1152 300" width="1152" height="300" role="img" aria-labelledby="ders5-noself-attr-t ders5-noself-attr-d">
  <title id="ders5-noself-attr-t">self ve AttributeError: Geçersiz ve Geçerli</title>
  <desc id="ders5-noself-attr-d">İki yan yana kutu. Solda Geçersiz: def __init__(self, code, ...): ve girintili code = code satırı. __init__ çerçevesinde lacivert code ismi MAT123 değerini (str, yeşil) gösteriyor; çerçevenin üstünde kırmızı kesik bir çarpı ve yanında çağrı bitince silinir yazıyor. d ismi boş bir Course object'ini gösteriyor. Altta kırmızı AttributeError: 'Course' object has no attribute 'code'. Sağda Geçerli: aynı ilk satır ve girintili self.code = code; self. kısmı açık mavi, çivit mavisi çerçeveli. d ismi bir Course object'ini gösteriyor; object'in içinde code, MAT123 değerini (str, yeşil) gösteriyor.</desc>
  <!-- source: run noself (S52): code = code in __init__, then print(d.code) -> AttributeError: 'Course' object has no attribute 'code' (line 6); noself_fix: self.code = code -> print(d.code) MAT123, vars(d) {'code': 'MAT123'} (Python 3.14.8, 2026-10-11) -->
  <defs>
    <marker id="ders5-noself-attr-ah" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah" d="M0,0 L12,6 L0,12 z"/></marker>
