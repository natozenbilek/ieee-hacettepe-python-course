<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 1152 420" width="1152" height="420" role="img" aria-labelledby="ders4-sort-tr-t ders4-sort-tr-d">
  <title id="ders4-sort-tr-t">sort() ve Türkçe harfler</title>
  <desc id="ders4-sort-tr-d">Solda kod: cities = ["Çorum", "Ankara", "Zonguldak", "İzmir", "Bursa"], cities.sort(), print(cities). Sağda bir eksen; eksende harfler ve Unicode numaraları: A 65, B 66, Z 90, sonra eksende bir kesinti, Ç 199, İ 304. Kesintiden sonraki bölüm açık mavi ve üstünde Türkçe harfler yazıyor. Eksenin üstünde sıralanmış beş şehir kartı (str, yeşil) kendi harflerinin üstünde: Ankara, Bursa, Zonguldak, Çorum, İzmir. Altta çıktı: ['Ankara', 'Bursa', 'Zonguldak', 'Çorum', 'İzmir'].</desc>
  <!-- source: cities.sort() -> ['Ankara', 'Bursa', 'Zonguldak', 'Çorum', 'İzmir']; ord(): A 65, B 66, Z 90, Ç 199, İ 304 (Python 3.14.8, 2026-10-10) -->
