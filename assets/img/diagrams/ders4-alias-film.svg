<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 1152 400" width="1152" height="400" role="img" aria-labelledby="ders4-alias-film-t ders4-alias-film-d">
  <title id="ders4-alias-film-t">Aliasing: iki isim, tek list</title>
  <desc id="ders4-alias-film-d">Dört karelik film şeridi. Solda kod: a = [4, 3] (# 1), b = a (# 2), b.append(2) (# 3), print(a), a.append(1) (# 4), print(b); altında çıktı iki satır: [4, 3, 2] ve [4, 3, 2, 1]. Her karede tek bir list object'i (vişneçürüğü) var, hücrelerindeki sayılar int (turuncu). Kare 1, # 1'den sonra: a ismi (lacivert) [4, 3] list'ini gösteriyor; list açık mavi, çivit mavisi çerçeveli şeridin içinde (yeni object). Kare 2, # 2'den sonra: b ismi de aynı list'i gösteriyor; b'nin yeni oku açık mavi şeridin üzerinde. Kare 3, # 3'ten sonra: b üzerinden eklenen 2 ile list [4, 3, 2] oldu; yeni hücre çivit mavisi çerçeveli; iki ok da değişmedi. Kare 4, # 4'ten sonra: a üzerinden eklenen 1 ile list [4, 3, 2, 1] oldu; yeni hücre çivit mavisi çerçeveli. Hiçbir ok taşınmadı; değişen, tek list object'inin kendisi. Alttaki açıklama: kare n, # n satırı çalıştıktan sonraki durumdur; düz ok şu anki bağ, çivit mavisi çerçeve bu adımda değişen.</desc>
  <!-- source: a = [4, 3]  # 1 / b = a  # 2 / b.append(2)  # 3 / print(a) / a.append(1)  # 4 / print(b) -> "[4, 3, 2]", "[4, 3, 2, 1]" (Python 3.14.8, 2026-10-11). Four panels in one row (lesson spec S71); the list box keeps room for four cells in every panel. -->
  <defs>
    <marker id="ders4-alias-film-ah" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah" d="M0,0 L12,6 L0,12 z"/></marker>
