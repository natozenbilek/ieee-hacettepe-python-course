<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 1152 420" width="1152" height="420" role="img" aria-labelledby="ders5-try-file-flow-t ders5-try-file-flow-d">
  <title id="ders5-try-file-flow-t">try ve FileNotFoundError: dosya yoksa akış</title>
  <desc id="ders5-try-file-flow-d">Akış, name = "missing.txt" için izlenen çalıştırma. Başla, sonra name = "missing.txt" kutusu (değer str, yeşil), sonra bir karar kutusu: open(name), dosya var mı? True yolu yukarıdaki for line in f: ... kutusuna gider; bu çalıştırmada izlenmediği için gri; oradan gri bir okla Devam'a. False yolu (kırmızı False etiketli, koyu ok, çünkü bu çalıştırmada izlenen yol) aşağıdaki except FileNotFoundError: kutusuna, oradan print(name, "bulunamadı") kutusuna gider; bu kutu açık mavi, çivit mavisi çerçeveli. Oradan yukarı Devam'a: program devam eder. Çıktı paneli: missing.txt bulunamadı.</desc>
  <!-- source: run tryfile (ders5-A S88): name = "missing.txt"; try: with open(name, encoding="utf-8") as f: for line in f: print(line.strip()) except FileNotFoundError: print(name, "bulunamadı") -> missing.txt bulunamadı (Python 3.14.8, 2026-10-11, in a folder without missing.txt) -->
  <defs>
    <marker id="ders5-try-file-flow-ah" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah" d="M0,0 L12,6 L0,12 z"/></marker>
    <marker id="ders5-try-file-flow-ahm" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah-m" d="M0,0 L12,6 L0,12 z"/></marker>
