<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 1152 360" width="1152" height="360" role="img" aria-labelledby="ders2-and-incomplete-t ders2-and-incomplete-d">
  <title id="ders2-and-incomplete-t">and ve SyntaxError</title>
  <desc id="ders2-and-incomplete-d">Üstte gri kod panelinde score = 87 ve print(score &gt;= 0 and &lt;= 100) satırları; altında kırmızı şapkalar &lt;= işaretinin tam altında ve kırmızı SyntaxError: invalid syntax. Altta iki sütun. Solda kırmızı başlık Geçersiz: score &gt;= 0 kutusu, and düğümü ve and'in sağındaki &lt;= 100 kırmızı kesik çizgili kutuda; kırmızı bir ok kutuyu gösterir ve altında kırmızı solunda value yok yazar. Sağda petrol mavisi başlık Geçerli: score &gt;= 0, and ve score &lt;= 100; eklenen score açık mavi bant ve çivit mavisi çerçeveyle vurgulu; and'den aşağı bir ok True'yu gösterir (bool, deniz yeşili), yanında score 87 iken yazar. 87, 0 ve 100 int (turuncu).</desc>
  <!-- source: ders2.md S130; score = 87; print(score >= 0 and <= 100) -> SyntaxError: invalid syntax, carets ^^ under <= (column 21 of the line); score = 87; print(score >= 0 and score <= 100) -> True (Python 3.14.8, 2026-10-11) -->
  <defs>
    <marker id="ders2-and-incomplete-ah" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah" d="M0,0 L12,6 L0,12 z"/></marker>
