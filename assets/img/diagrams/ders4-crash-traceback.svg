  <title id="ders4-crash-traceback-t">int(input()) ve ValueError: traceback</title>
  <desc id="ders4-crash-traceback-d">Run penceresi, başlığı Çıktı. İlk satır: Kredi: dört; kullanıcının yazdığı dört'ün altı çizili. Sonra traceback: Traceback (most recent call last): / File "…/python-kurs/example.py", line 1, in &lt;module&gt; / credits = int(input("Kredi: ")) / kırmızı son satır: ValueError: invalid literal for int() with base 10: 'dört'. 1 numaralı işaret son satırı gösteriyor. 2 numaralı işaret line 1'i gösteriyor: hangi satır. Sağda gri çerçeveli bir kutuda gri print(credits * 2) satırı, altında: çalışmadı.</desc>
  <!-- source: deneme.py = credits = int(input("Kredi: ")) / print(credits * 2), stdin dört, Python 3.14.8 (2026-10-11): the traceback shown; 3.14 prints the full path of the file, shortened here to "…/python-kurs/example.py" as in the Output of ders4.md S96 (copied 2026-10-13 from ders3-crash-traceback.svg, where the file was lesson3.py; the try section moved from Ders 3 to Ders 4). -->
