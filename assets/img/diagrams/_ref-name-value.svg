  <title id="_ref-name-value-t">İsim ve değer: a = 4, b = a, a = a + 3 sonrası</title>
  <desc id="_ref-name-value-d">Solda dört satırlık kod: a = 4, b = a, a = a + 3, print(a, b); 3. satır açık mavi. Çıktı: 7 4. Sağda lacivert isim etiketleri a ve b. a, 7 değerini (int, turuncu) düz okla gösteriyor; 7'nin kutusu bu adımda değiştiği için çivit mavisi çerçeveli açık mavi bir şeridin içinde. a'dan 4'e giden gri kesikli ok eski bağ. b, 4 değerini (int, turuncu) düz okla gösteriyor. Alttaki açıklama: düz ok şu anki bağ, kesikli gri ok eski bağ (satır 1), çivit mavisi çerçeveli açık mavi bu adımda değişen.</desc>
  <!-- source: a = 4; b = a; a = a + 3; print(a, b) -> çıktı "7 4" (Python 3.13.15, 2026-10-09) -->
