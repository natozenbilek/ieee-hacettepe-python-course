<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 1152 382" width="1152" height="382" role="img" aria-labelledby="ders2-target-parts-t ders2-target-parts-d">
  <title id="ders2-target-parts-t">Ders 2'nin hedef programı: parçalar</title>
  <desc id="ders2-target-parts-d">Solda gri bir kod panelinde hedef programın satırları, atlanan yerler üç noktayla: code = input(…).strip().upper(), credits = int(input(…)), score = int(input(…)); if score &gt;= 95: grade_point = 4.00, elif score &gt;= 90:, üç nokta; if grade_point &gt;= 1.75: status = "geçti", else: status = "kaldı"; iki print satırı. elif zinciri açık mavi bantta, çivit mavisi çerçeveli. Sağda dört ayraç: 2A: input() ve int(), girdiyi alır; 11. bölüm: elif zinciri, Madde 24'ün tablosu; 9. bölüm: if ve else, geçti ya da kaldı; 2A: f-string, :.2f, iki satırlık çıktı. 95 ve 90 turuncu (int), katsayılar hardal sarısı (float), "geçti" ve "kaldı" yeşil (str). İlk ayracın girdi satırının yanında bugünün resmi: 6 ve 6 tuşlarından bir ok yeşil "66" kutusuna (str) gider.</desc>
  <!-- source: authoring/targets/target2.py (key lines; the prompts and the two f-strings are cut with …); run with ' mat123', 4, 66 -> MAT123: 66 puan, katsayı 2.50, geçti / 4 x 2.50 = 10.00 (run_targets.py, Python 3.14.8, 2026-10-13); NEW 2026-10-13 for the closing build-up S206 Updated on 2026-10-23 by authoring/builder-paralel/ders2-index.py: 2B's section numbers moved up by one (new 7. Index, len() ve slicing in 2A) -->
