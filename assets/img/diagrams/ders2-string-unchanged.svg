<svg xmlns="http://www.w3.org/2000/svg" class="dg su" viewBox="0 0 1152 340" width="1152" height="340" role="img" aria-labelledby="ders2-string-unchanged-t ders2-string-unchanged-d" data-focus="one">
  <title id="ders2-string-unchanged-t">str değişmez: upper() yeni bir str üretir</title>
  <desc id="ders2-string-unchanged-d">data-focus one durumu (S83), 1. panel: kod code = "mat101", code.upper(), print(code). Lacivert code isim etiketinin oku "mat101" değerine gidiyor (str, yeşil); altında str, değişmez yazıyor. Altında soluk, gri çerçeveli yeni bir "MAT101" kutusu var; ona hiçbir ok gitmiyor, yanında kimse saklamadı yazısı. Çıktı: mat101. data-focus both durumu (S84): sağda 2. panel de görünür. Kod code = "mat101", code = code.upper(), print(code). Değerler aynı yerlerde; code etiketinin oku artık "MAT101" değerine gidiyor (str, yeşil), bu kutu açık mavi, çivit mavisi çerçeveli bir bandın içinde. "mat101" değerine giden eski ok gri ve kesikli. Çıktı: MAT101.</desc>
  <!-- source: ders2-A.md S83: code = "mat101"; code.upper(); print(code) -> mat101. S84: code = code.upper(); print(code) -> MAT101 (Python 3.14.8, 2026-10-11) ; course code changed from BBM101 to MAT101 on 2026-10-21 (Nezih: "BBM101 yerine MAT101 olsun ders kodu örneği"), outputs re-run on 3.14.8 -->
