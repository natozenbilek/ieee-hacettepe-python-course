  <title id="ders5-order-mutable-t">str immutable, list mutable</title>
  <desc id="ders5-order-mutable-d">Üstte drink ismi "latte" str'ini gösteriyor, index 0-4; ilk karakter kırmızı kesik çizgili; sağda drink[0] = "L"; altında TypeError: 'str' object does not support item assignment. Tıklayınca: order ismi [latte, mocha, filtre] list'ini gösteriyor, sağda order[0] = "espresso". İkinci tıklamada aynı list [espresso, mocha, filtre], ilk hücre çerçeveli; aynı list; yalnızca ilk item değişti. Üçüncü tıklamada: List mutable'dır: bir item'a yeni value atanabilir.</desc>
