  <title id="ders2-index-son-t">Son index: uzunluk 7, son index 6</title>
  <desc id="ders2-index-son-d">Üstte soru: player 7 karakterli bir str. Son karakterin index'i kaç? Sağ üstte kod: player = "Iniesta". Lacivert player isim etiketi yedi yeşil hücreyi gösteriyor (str): I, n, i, e, s, t, a; altlarında çivit mavisi parantez, len(player) ve 7 (int, turuncu). Birinci tıklama, cevap: hücrelerin üstünde 0'dan 6'ya index'ler; son hücre kalın çivit mavisi çerçeveli, üstünde son index yazıyor. İkinci tıklama, altta büyük yazıyla: Son karakterin index'i len() - 1'dir: 7 - 1 = 6.</desc>
