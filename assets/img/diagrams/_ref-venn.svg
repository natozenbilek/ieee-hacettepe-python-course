<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 1152 470" width="1152" height="470" role="img" aria-labelledby="_ref-venn-t _ref-venn-d">
  <title id="_ref-venn-t">Venn şeması: a ve b set'leri</title>
  <desc id="_ref-venn-d">İki daire: a ve b. İkisi de set olduğu için daireler zeytin yeşili çerçeveli ve açık zeytin yeşili dolgulu; hangisinin a, hangisinin b olduğunu üstteki lacivert isim etiketleri söyler. Yalnız a'da "ali" ve "ayse"; ortak açık mavi bölgede "can"; yalnız b'de "deniz". Elemanlar str olduğu için yeşil yazılır. Sağda kod: a = {"ali", "ayse", "can"}, b = {"can", "deniz"}. Sonuçlar kendi type renginde: a &amp; b {'can'} (set, zeytin yeşili; satırı açık mavi), sorted(a - b) ['ali', 'ayse'] ve sorted(b - a) ['deniz'] (list, vişneçürüğü), len(a | b) 4 (int, turuncu). Alt satır: Vurgulu bölge: a &amp; b. Set sırasızdır; sabit çıktı için sorted() kullanıldı.</desc>
  <!-- source: a & b -> {'can'}; sorted(a - b) -> ['ali', 'ayse']; sorted(b - a) -> ['deniz']; len(a | b) -> 4 (3.13.15) -->
  <defs>
    
    <style>
