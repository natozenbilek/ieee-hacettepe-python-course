<svg xmlns="http://www.w3.org/2000/svg" class="dg cct" viewBox="0 0 1152 330" width="1152" height="330" role="img" aria-labelledby="course-collections-table-t course-collections-table-d" data-state="w4a">
  <title id="course-collections-table-t">str, range, list, tuple, dict ve set</title>
  <desc id="course-collections-table-d">Collection tablosu; sütunlar sırası korunur mu?, değiştirilebilir mi?, index var mı?, tekrar olur mu?. str (yeşil): evet, hayır, evet, evet. range: evet, hayır, evet, hayır. list (vişneçürüğü): evet, evet, evet, evet. tuple (mavi-gri): evet, hayır, evet, evet. evet'ler petrol mavisi. w4a durumunda list'in değiştirilebilir mi? hücresi açık mavi, çivit mavisi çerçeveyle vurgulu; dict ve set satırları gri kesikli, Ders 5'te dolacak. w5a durumunda dict (kahverengi): evet (eklenme sırası), evet, hayır (key ile okunur), key hayır, value evet; set (zeytin yeşili): hayır, evet, hayır, hayır; dict ve set adları vurgulu.</desc>
  <!-- source: w4a: list(range(0, 10, 3)) -> [0, 3, 6, 9]; "aa".count("a"), (1, 1).count(1), [1, 1].count(1) -> 2 2 2. w5a: {"b": 1, "a": 2} -> {'b': 1, 'a': 2}; {"MAT123": "C1", "MAT123": "A3"} -> {'MAT123': 'A3'}; {"A": 1, "B": 1} keeps both; len({"C1", "B2", "C1"}) -> 2; a set index is a TypeError (Python 3.14.8, 2026-10-10). States: w4a (ders4-A S57), w5a (ders5-A S49). -->
  <defs>
    <marker id="course-collections-table-ah" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah" d="M0,0 L12,6 L0,12 z"/></marker>
    <marker id="course-collections-table-ahm" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah-m" d="M0,0 L12,6 L0,12 z"/></marker>
