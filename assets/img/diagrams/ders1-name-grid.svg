<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 1152 432" width="1152" height="432" role="img" aria-labelledby="ders1-name-grid-t ders1-name-grid-d" data-state="rules">
  <title id="ders1-name-grid-t">İsim kuralları, PEP 8 ve büyük harfli isimler</title>
  <desc id="ders1-name-grid-d">Çizilmiş isim kartları, üç durum. Durum rules: üstte kod paneli: course_code = "BBM101", midterm2 = 85, print(course_code, midterm2); Çıktı: BBM101 85. Altta solda petrol mavisi çerçeveli geçerli kartlar: course_code, midterm2, _total, credits ve Credits; Credits'in altında credits'ten farklı bir isim yazar. Sağda kırmızı çerçeveli geçersiz kartlar, her birinin altında bozduğu kural: course code, boşluk var; 2course, rakamla başlıyor; not, Python'un kendi kelimesi. Durum pep8: kod paneli: total_credits = 9, print(total_credits); Çıktı: 9. Geçerli kartların altına bir satır eklenir: course_code, midterm2, _total ve credits için snake_case; Credits için büyük harfle başlamaz. Sol grubun altındaki üçüncü yer boş kalır. Geçersiz grup gri ve sönük çizilir. Durum const: pep8 durumunun aynısı, kod paneli: MAX_GPA = 4.0, print("En yüksek AGNO:", MAX_GPA); Çıktı: En yüksek AGNO: 4.0. Boş kalan yere petrol mavisi çerçeveli yeni bir geçerli kart gelir: MAX_GPA, altında hiç değişmeyecek value; kart açık mavi zeminli, çivit mavisi çerçeveli bir bantla vurgulanır. Kartlar isimdir, value değil; bu yüzden type renkleri yok.</desc>
  <!-- source: lessons/ders1.md S181 (rules), S184 (pep8), S186 (const). course_code = "BBM101" / midterm2 = 85 / print(course_code, midterm2) -&gt; BBM101 85; total_credits = 9 / print(total_credits) -&gt; 9; MAX_GPA = 4.0 / print("En yüksek AGNO:", MAX_GPA) -&gt; En yüksek AGNO: 4.0; course code = 1 -&gt; SyntaxError: invalid syntax; 2course = 1 -&gt; SyntaxError: invalid decimal literal; not = 85 -&gt; SyntaxError: invalid syntax; credits = 4 / Credits = 5 / print(credits, Credits) -&gt; 4 5 (Python 3.14.8, 2026-10-11) -->
