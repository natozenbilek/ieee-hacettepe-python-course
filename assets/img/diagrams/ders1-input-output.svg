<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 1152 300" width="1152" height="300" role="img" aria-labelledby="ders1-input-output-t ders1-input-output-d">
  <title id="ders1-input-output-t">input() ve print()</title>
  <desc id="ders1-input-output-d">Soldan sağa üç blok. Solda Input bloğu, altında klavye: M, e, h, m, e, t ve Enter tuşları. Ortada Data bloğu: lacivert name ismi "Mehmet" değerini gösteriyor; Mehmet (str, yeşil). Sağda Output bloğu, altında ekran: Adınız: Mehmet ve Merhaba Mehmet satırları. Klavyeden Data'ya giden okun üstünde input(), Data'dan ekrana giden okun üstünde print() yazıyor. En üstte iki kod satırı: name = input("Adınız: ") ve print("Merhaba", name). Alt satır: input() klavyeden memory'ye, print() memory'den ekrana.</desc>
  <!-- source: ders1.md S22 (reused in ders2.md S29); hello.py run in a pty with Mehmet typed: 'Adınız: Mehmet' / 'Merhaba Mehmet' (Python 3.14.8, 2026-10-11). Six letter keys 32 wide plus Enter 66 wide fit the 300 wide Input block. The Data block is 280 wide instead of 300, so that the 28 px labels input() and print() fit in the gaps between the blocks. Root attribute data-preview="off" hides the Önizleme tag (ders2 S29). -->
  <defs>
    <marker id="ders1-input-output-ah" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah" d="M0,0 L12,6 L0,12 z"/></marker>
    <style>
