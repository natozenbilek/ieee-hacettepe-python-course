<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 1152 320" width="1152" height="320" role="img" aria-labelledby="ders5-class-objects-t ders5-class-objects-d" data-state="class">
  <title id="ders5-class-objects-t">class Course ve iki object</title>
  <desc id="ders5-class-objects-d">Solda kalıp: kesikli çizgili class Course kalıbı, içinde yalnızca code, credits, grade adları. Kalıptan gri kesikli iki ok, üstünde ve altında Course(...) yazıyla, sağdaki iki object'e gidiyor. Lacivert d etiketi birinci object'i gösteriyor: code "MAT123" (str, yeşil), credits 4 (int, turuncu), grade "C1" (str, yeşil). Lacivert e etiketi ikinci object'i gösteriyor: code "FIZ127" (str, yeşil), credits 3 (int, turuncu), grade "B2" (str, yeşil). İki durum. class: kalıp çivit mavisi çerçeveli, object'lerin başlığı Course object. instance: iki object birlikte açık mavi bir bantta, çivit mavisi çerçeveli; ikisinin başlığı Course instance.</desc>
  <!-- source: ders5-B.md S24 and S26, run init_two: d = Course("MAT123", 4, "C1"); e = Course("FIZ127", 3, "B2"); print(d.code, d.credits, e.code, e.credits) -&gt; MAT123 4 FIZ127 3; e.grade -&gt; B2 (Python 3.14.8, 2026-10-11). Root data-state: class | instance; a deck copy changes only this attribute. -->
