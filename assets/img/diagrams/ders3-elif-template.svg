<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 1152 420" width="1152" height="420" role="img" aria-labelledby="ders3-elif-template-t ders3-elif-template-d" data-score="77">
  <title id="ders3-elif-template-t">elif zinciri: score = 77</title>
  <desc id="ders3-elif-template-d">Solda yedi satırlık kod: score = 77, if score &gt;= 85:, print("A3 ve üstü"), elif score &gt;= 50:, print("geçti"), else:, print("kaldı"); sayılar turuncu (int), metinler yeşil (str). Sağda üstte score = 77 ve alt alta üç satır: score &gt;= 85 baklavası, True ile print("A3 ve üstü"); score &gt;= 50 baklavası, True ile print("geçti"); else kutusu ile print("kaldı"). False okları bir alttaki satıra iner; üç kutu sağda birleşip Bitir'e gider. score = 77 için: ilk baklavanın False oku koyu, kırmızı False etiketli; ikinci baklavanın petrol mavisi True oku print("geçti") kutusuna gider, kutu açık mavi ve çivit mavisi çerçeveli. print("A3 ve üstü") ve else satırı gri; print("kaldı") kutusunun altında atlandı yazıyor.</desc>
  <!-- source: elif_77 -&gt; geçti; elif_92 -&gt; A3 ve üstü; elif_40 -&gt; kaldı; elif_noelse (score = 40, no else, print("son")) -&gt; son (Python 3.14.8, 2026-10-10) -->
