<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 368 300" width="368" height="300" role="img" aria-labelledby="ders1-f1-lap-names-t ders1-f1-lap-names-d">
  <title id="ders1-f1-lap-names-t">Tur süresi: yedi isim ve gösterdikleri value'lar</title>
  <desc id="ders1-f1-lap-names-d">Yedi lacivert isim etiketi ve her birinden sağdaki turuncu int value kutusuna giden bir ok: MS_PER_MINUTE 60000, MS_PER_SECOND 1000, lap_ms 78792, minutes 1, rest_ms 18792, seconds 18, millis 792. Üstteki iki satır, büyük harfli iki isim, gri kesikli bir çerçevenin içinde; çerçevenin üst kenarında hiç değişmez yazıyor. lap_ms'in oku çivit mavisi çerçeveli açık mavi bir bantla vurgulu: başka bir tur için değiştirilecek value bu. Hiçbir value bir ismin kutusunun içinde değil.</desc>
  <!-- source: MS_PER_MINUTE = 60000; MS_PER_SECOND = 1000; lap_ms = 78792; minutes = lap_ms // MS_PER_MINUTE; rest_ms = lap_ms % MS_PER_MINUTE; seconds = rest_ms // MS_PER_SECOND; millis = rest_ms % MS_PER_SECOND -> 60000 1000 78792 1 18792 18 792; output Dakika: 1 / Saniye: 18 / Milisaniye: 792 (Python 3.14.8, 2026-10-11) -->
  <defs>
