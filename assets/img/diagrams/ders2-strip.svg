<svg xmlns="http://www.w3.org/2000/svg" class="dg st" viewBox="0 0 1152 300" width="1152" height="300" role="img" aria-labelledby="ders2-strip-t ders2-strip-d" data-focus="strip">
  <title id="ders2-strip-t">strip(), upper() ve lower()</title>
  <desc id="ders2-strip-d">data-focus strip durumu (S73): solda lacivert code isim etiketi, oku dokuz yeşil kutuya gidiyor (str, yeşil): iki boşluk, b, b, m, 1, 0, 1 ve bir boşluk; boşluklar kutunun ortasında çivit mavisi bir noktayla gösterilir. strip() etiketli ok aşağıdaki satıra iniyor: altı yeşil kutu, b, b, m, 1, 0, 1, kalın çivit mavisi bir çerçevenin içinde. Silinen üç boşluk eski yerlerinde kırmızı kesikli boş kutular olarak duruyor, altlarında silindi yazısı. Sağda Çıktı paneli: [  bbm101 ] ve [bbm101]. data-focus case durumu (S74): code etiketi Bbm101 değerinin altı yeşil kutusuna gidiyor (str, yeşil). upper() etiketli ok aşağıda BBM101 satırına iniyor; bu satır kalın çivit mavisi çerçeveli. lower() etiketli ok sağa ve aşağı giderek bbm101 satırına ulaşıyor. Rakamlar iki satırda da aynı kalıyor. Çıktı paneli: BBM101 ve bbm101.</desc>
  <!-- source: ders2-A.md S73: code = "  bbm101 "; print(f"[{code}]") -> [  bbm101 ]; print(f"[{code.strip()}]") -> [bbm101]; len 9 -> 6. S74: code = "Bbm101"; code.upper() -> BBM101; code.lower() -> bbm101 (Python 3.14.8, 2026-10-11) -->
  <defs>
