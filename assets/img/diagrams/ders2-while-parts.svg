<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 1152 300" width="1152" height="300" role="img" aria-labelledby="ders2-while-parts-t ders2-while-parts-d">
  <title id="ders2-while-parts-t">while loop'un üç parçası</title>
  <desc id="ders2-while-parts-d">Solda beş satırlık kod: i = 3, while i &gt; 0:, içeride print(i) ve i = i - 1, sonra print("Bitti") (3, 0 ve 1 int, turuncu; "Bitti" str, yeşil). Üç parça açık mavi şeritlerde ve numaralı notlarla adlandırılmış: 1 i = 3, başlangıç; 2 i &gt; 0, devam şartı; 3 i = i - 1, güncelleme. Sağda Run penceresi: 3, 2, 1, Bitti.</desc>
  <!-- source: ders2-B.md S51; i = 3 / while i > 0: / print(i) / i = i - 1 / print("Bitti") -> 3 / 2 / 1 / Bitti (Python 3.14.8, 2026-10-11) -->
