<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 1152 440" width="1152" height="440" role="img" aria-labelledby="ders5-journey-t ders5-journey-d">
  <title id="ders5-journey-t">Beş ders: her dersin anahtar parçaları ve AGNO programı</title>
  <desc id="ders5-journey-d">Beş durak soldan sağa; numaralı daireler bir yolla, oklarla bağlı. Her durakta o dersin anahtar parçaları ve o hafta AGNO programının yaptığı iş. Ders 1, 20 Ekim: int (turuncu), float (hardal sarısı), print() ve =; üç dersin AGNO'su. Ders 2, 27 Ekim: reassignment (x = x + 1), str (yeşil), input(), if ve elif; puandan katsayı. Ders 3, 3 Kasım: while, counter ve accumulator (+=), for, slicing ([:3]); n dersin AGNO'su. Ders 4, 10 Kasım: list (vişneçürüğü), tuple (mavi-gri), try ve except, def; function ile AGNO. Ders 5, 17 Kasım, açık mavi bant ve çivit mavisi çerçeve içinde: None (bej), dict (kahverengi), set (zeytin yeşili) ve file için open(); dosyadan report.txt'ye.</desc>
  <!-- source: the five-week plan of DECISIONS.md (2026-10-12) after "if before while" (2026-10-13; Ders 2: reassignment, str, input(), if/elif; Ders 3: while, counter/accumulator, for, slicing; Ders 4: list, tuple, try/except, def; Ders 5: None, dict, set, file) and authoring/targets/target2.py-target5.py (2026-10-13: target2 one course, katsayı from the score with if/elif; target3 n courses, AGNO) -->
  <defs>
