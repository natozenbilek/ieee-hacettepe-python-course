<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 1152 340" width="1152" height="340" role="img" aria-labelledby="ders2-reset-compare-t ders2-reset-compare-d">
  <title id="ders2-reset-compare-t">total = 0'ın yeri: loop'tan önce ve loop'un içinde</title>
  <desc id="ders2-reset-compare-d">İki sütun. Solda petrol mavisi Doğru sonuç: kod total = 0, i = 1, while i &lt;= 5:, içeride total = total + i ve i = i + 1, en sonda print(total); total = 0 satırı loop'tan önce, açık mavi bant üstünde. Tablosu tur 1-5 için total (sonra): 1, 3, 6, 10, 15; çıktı 15. Sağda kırmızı Yanlış sonuç: kod i = 1, while i &lt;= 5:, içeride total = 0, total = total + i ve i = i + 1, en sonda print(total); total = 0 satırı loop'un içinde, açık mavi bant üstünde. Tablosunda her satırın önünde 0'dan yazar: total her turda sıfırlanır ve 1, 2, 3, 4, 5 olur; çıktı 5, açık mavi ve çivit mavisi çerçeveli. Sayılar int (turuncu). Altta: Accumulator loop'tan önce bir kez sıfırlanır.</desc>
  <!-- source: ders2-B.md S83 and S77; total = 0 before the loop: totals 1 3 6 10 15, output 15; total = 0 inside the loop: totals 1 2 3 4 5, output 5 (Python 3.14.8, 2026-10-11) -->
