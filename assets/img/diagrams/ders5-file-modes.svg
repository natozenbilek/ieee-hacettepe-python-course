.dg .cd,.dg .cd24,.dg .ty,.dg .nm{font-variant-ligatures:none;font-feature-settings:"liga" 0,"calt" 0}
/* ders5-file-modes: kök data-focus="r" | "w" | "a" bir sütunu vurgular (DIAGRAMS.md §8.16). r: w ve a kesikli gri çerçevede, soluk, "7. bölüm" etiketli. w ve a: diğer sütunlar düz, etiketler gizli ama yerleri korunur */
.fm .fm-later,.fm .fm-tag{visibility:hidden}
.fm[data-focus="r"] .fm-later,.fm[data-focus="r"] .fm-tag{visibility:visible}
.dg rect.fm-later{fill:none;stroke-dasharray:8 6}
