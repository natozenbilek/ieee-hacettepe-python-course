<svg xmlns="http://www.w3.org/2000/svg" class="dg fm" viewBox="0 0 1152 240" width="1152" height="240" role="img" aria-labelledby="ders5-file-modes-t ders5-file-modes-d" data-focus="r">
  <title id="ders5-file-modes-t">Dosya modları: r, w, a</title>
  <desc id="ders5-file-modes-d">Dosya modları, üç sütun. Her sütunda bir mode kutusu, program yazılı bir kutu ve bir dosya simgesi var; dosya satırları str (yeşil). Sütun "r": iki eski satırlı dosyadan programa bir ok; altında okur (varsayılan). Sütun "w": programdan küçük bir dosyaya ok; o dosyanın iki eski satırının üstü kırmızı kesikli çizgiyle çizili; oradan ikinci küçük dosyaya ok, içinde tek satır yeni; altında önce boşaltır, sonra yazar. Sütun "a": programdan dosyanın en alt satırına ok; dosyada eski, eski ve en altta yeni; altında sonuna ekler. Bu durumda (r) r sütununun mode kutusu ve dosyası açık mavi, çivit mavisi çerçeveli; w ve a sütunları kesikli gri çerçeve içinde, gri, üstlerinde 7. bölüm yazar.</desc>
  <!-- source: open() modes, Python 3.14 docs (open: "r" reading, the default; "w" truncates the file first; "a" appends to the end). Master with root data-focus="r" (ders5 S122, 6. File okuma), "w" (S134) and "a" (S141), both 7. File'a yazma; deck copies change only this attribute. Alt for w: Üç mode: r okur; w önce boşaltır, sonra yazar, açık mavi ve çivit mavisi çerçeveli; a sonuna ekler. Alt for a: Üç mode: r okur; w önce boşaltır; a sonuna ekler, açık mavi ve çivit mavisi çerçeveli. Checked on 3.14.8, 2026-10-11: open(p, "w") on a two-line file then write("yeni\n") leaves "yeni\n"; open(p, "a") leaves "eski\neski\nyeni\n". -->
  <defs>
    <marker id="ders5-file-modes-ah" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah" d="M0,0 L12,6 L0,12 z"/></marker>
    <marker id="ders5-file-modes-ahm" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah-m" d="M0,0 L12,6 L0,12 z"/></marker>
    <style>
