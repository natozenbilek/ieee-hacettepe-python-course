.fm[data-focus="r"] .fm-w rect.fm-chip,.fm[data-focus="r"] .fm-a rect.fm-chip{fill:#FFFFFF;fill:var(--d-paper,#FFFFFF)}
.fm[data-focus="r"] .fm-w text,.fm[data-focus="r"] .fm-a text{fill:#50566F;fill:var(--d-type,#50566F)}
.fm[data-focus="r"] .fm-w .fm-ar,.fm[data-focus="r"] .fm-a .fm-ar{stroke:#767C95;stroke:var(--d-muted,#767C95);marker-end:url(#ders5-file-modes-ahm)}
.fm[data-focus="r"] .fm-r .fm-chip,.fm[data-focus="w"] .fm-w .fm-chip,.fm[data-focus="a"] .fm-a .fm-chip,
.fm[data-focus="r"] .fm-r .fm-file,.fm[data-focus="w"] .fm-w .fm-file,.fm[data-focus="a"] .fm-a .fm-file{fill:#C8E7F3;fill:var(--d-hl,#C8E7F3);stroke:#3B4595;stroke:var(--d-brand,#3B4595);stroke-width:3}
