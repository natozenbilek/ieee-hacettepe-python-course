<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 560 440" width="560" height="440" role="img" aria-labelledby="ders2-raw-input-t ders2-raw-input-d">
  <title id="ders2-raw-input-t">raw_input() ve input()</title>
  <desc id="ders2-raw-input-d">İki bölüm, üst üste. Üstte Python 2: 5 tuşundan raw_input("Sayı: ") kutusuna, oradan "5" değerine giden oklar; "5" (str, yeşil), altında metin verirdi. İkinci satırda 5 tuşundan input("Sayı: ") kutusuna, oradan 5 değerine giden oklar; 5 (int, turuncu), altında yazılanı hesaplardı; ve kırmızı Python 3'te kaldırıldı. Ortada bir ayırıcı çizginin üstünde PEP 3111: raw_input() artık input() yazan bir kutu ve aşağı kısa bir ok. Altta Python 3.0 (2008) ve sonrası: 5 tuşundan input("Sayı: ") kutusuna, oradan "5" değerine giden oklar; "5" (str, yeşil), çivit mavisi çerçeveli açık mavi şeritte, altında eski raw_input()'un işi, yeni adıyla. Çıktı paneli yok: Python 2 3.14'te çalıştırılamaz. Kaynak: What's New In Python 3.0; PEP 3111. Özet: üstte Python 2: raw_input() 5 tuşundan "5" değerini (str, yeşil), input() ise 5 değerini (int, turuncu) veriyordu; bu input() Python 3'te kaldırıldı. Ortada PEP 3111: raw_input() artık input(). Altta Python 3.0 ve sonrası: input() "5" (str, yeşil) verir.</desc>
  <!-- source: ders2-A.md S35; lore.json L2-02; What's New In Python 3.0 ("PEP 3111: raw_input() was renamed to input()"). Not run (Python 2); on 3.14.8 raw_input() gives NameError: name 'raw_input' is not defined (2026-10-11). -->
