<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 1152 400" width="1152" height="400" role="img" aria-labelledby="ders4-for-variable-film-t ders4-for-variable-film-d">
  <title id="ders4-for-variable-film-t">List üzerinde for ve loop'taki isim</title>
  <desc id="ders4-for-variable-film-d">Üç karelik film şeridi, her tur için bir kare. Solda kod: nums = [1, 2, 3], for x in nums:, x = x * 10, print(nums); çıktı [1, 2, 3]. Her karede nums ismi (lacivert) aynı list'i (vişneçürüğü) gösteriyor; list'in üç hücresinde birer çivit mavisi nokta var ve her noktadan aşağıya, ayrı bir int object'ine ok gidiyor: 1, 2, 3 (turuncu). Bu kısım üç karede de aynı. Kare 1, tur 1 bittikten sonra: x'in eski oku 1'e gidiyordu, gri ve kesikli; x'in yeni oku yeni bir int'e, 10'a gidiyor; 10 açık mavi, çivit mavisi çerçeveli şeridin içinde. Kare 2, tur 2: eski ok 2'ye, yeni ok 20'ye. Kare 3, tur 3: eski ok 3'e, yeni ok 30'a. List hiç değişmiyor. Solda açıklama: düz ok şu anki bağ, kesikli gri ok eski bağ, çivit mavisi çerçeveli açık mavi şerit bu adımda değişen. Altta: kare n, n. tur bittikten sonraki durumdur.</desc>
  <!-- source: nums = [1, 2, 3] / for x in nums: / x = x * 10 / print(nums) -> "[1, 2, 3]"; x is 10, 20, 30 after passes 1-3 (Python 3.14.8, 2026-10-11) -->
