<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 1152 260" width="1152" height="260" role="img" aria-labelledby="ders2-bool-name-t ders2-bool-name-d">
  <title id="ders2-bool-name-t">Bir isim bool value'yu gösterir</title>
  <desc id="ders2-bool-name-d">Solda üç satırlık kod: coefficient = 2.5, passed = coefficient &gt;= 1.75, print(passed, type(passed)); 2.5 ve 1.75 float (hardal sarısı). Altında çıktı: True &lt;class 'bool'&gt;. Sağda lacivert isim etiketleri: coefficient 2.5'i (float, hardal sarısı) gösterir. Aradaki satır 2.5 &gt;= 1.75 hesaplanır ve oku aşağıda True'ya iner, yanında önce sağ taraf hesaplanır yazar. passed True'yu (bool, deniz yeşili) gösterir; True kutusu çivit mavisi çerçeveli açık mavi bantta.</desc>
  <!-- source: ders2-B.md S12; coefficient = 2.5; passed = coefficient >= 1.75; print(passed, type(passed)) -> True <class 'bool'> (Python 3.14.8, 2026-10-11) -->
