  <title id="ders3-try-trace-t">try / except: 4 ve dört yazılınca</title>
  <desc id="ders3-try-trace-d">Aynı altı satırlık try kodu iki kez yan yana. Solda &quot;4&quot; yazıldı (yeşil str kutusu): 1, 2, 3 ve 6. satırların solunda çivit mavisi nokta var, bu satırlar çalıştı; 4. ve 5. satır, except ValueError: ve print(&quot;Tam sayı girin.&quot;), gri, çalışmadı. Çıktı: Kredi: 4, Kredi alındı, Program devam ediyor. Sağda &quot;dört&quot; yazıldı (yeşil str kutusu): 1, 2, 4, 5 ve 6. satırlar çalıştı; 3. satır, print(&quot;Kredi alındı&quot;), gri, atlandı. 5. satır açık mavi vurgulu. Çıktı: Kredi: dört, Tam sayı girin., Program devam ediyor. İki çalıştırmada da son satır çalışıyor. Yazılanlar int() çevirene kadar str.</desc>
  <!-- source: ders3-B.md S76 code; stdin 4 -> Kredi: 4 / Kredi alındı / Program devam ediyor (run try_good); stdin dört -> Kredi: dört / Tam sayı girin. / Program devam ediyor (run try_bad); Python 3.14.8, pty, 2026-10-11 -->
