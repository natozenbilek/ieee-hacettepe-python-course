  <title id="ders4-list-vs-tuple-t">List ve tuple</title>
  <desc id="ders4-list-vs-tuple-d">Solda list [ ]: grades ismi (lacivert) C1, B2, A2 str'lerini (yeşil) tutan bir list'i (vişneçürüğü) gösteriyor; altında çok sayıda benzer item, mutable, örnek bir öğrencinin harf notları. Sağda tuple ( ): course ismi "MAT123", 4, "C1" tutan bir tuple'ı (mavi-gri) gösteriyor; altında sabit alanlı tek kayıt, immutable, örnek transkriptin bir satırı.</desc>
  <!-- source: type([1, 2]), type((1, 2)) -> <class 'list'> <class 'tuple'> (Python 3.14.8, 2026-10-10) -->
