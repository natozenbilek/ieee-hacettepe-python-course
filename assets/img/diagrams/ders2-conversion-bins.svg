<svg xmlns="http://www.w3.org/2000/svg" class="dg cb" viewBox="0 0 1152 428" width="1152" height="428" role="img" aria-labelledby="ders2-conversion-bins-t ders2-conversion-bins-d" data-focus="all">
  <title id="ders2-conversion-bins-t">Type conversion: üç kutu</title>
  <desc id="ders2-conversion-bins-d">Type conversion (tip çevirimi) için yan yana üç kutu, her biri çivit mavisi çerçeveli ve numaralı. 1 Otomatik: 3 (int, turuncu) artı 4.0 (float, hardal sarısı), aşağı bir okla 7.0 (float, hardal sarısı). 2 Açıkça: int("4") okla 4 (int, turuncu); float("3.25") okla 3.25 (float, hardal sarısı); str(4) okla "4" (str, yeşil). 3 Çevrilemeyen: int("abc") kırmızı bir okla kırmızı çerçeveli ValueError kutusuna gider. data-focus all durumunda vurgu yoktur ve alt bant boştur. data-focus auto durumunda 1. kutu kalın çivit mavisi çerçeveyle öne çıkar, 2. ve 3. kutu gri ve soluktur; altta print(3 + 4.0) ve print(type(3 + 4.0)) satırları ve Çıktı panelinde 7.0 ile &lt;class 'float'&gt; yazar. data-focus fail durumunda 3. kutu kalın çivit mavisi çerçeveyle öne çıkar, 1. ve 2. kutu gri ve soluktur; altta üç satır ve kırmızı son satırları: int("3.5"): ValueError: invalid literal for int() with base 10: '3.5'; float("3,5"): ValueError: could not convert string to float: '3,5'; int("abc"): ValueError: invalid literal for int() with base 10: 'abc'.</desc>
  <!-- source: ders2-A.md S41, S42, S50; print(3 + 4.0) -&gt; 7.0, print(type(3 + 4.0)) -&gt; &lt;class 'float'&gt;; int("4"), float("3.25"), str(4) -&gt; 4 3.25 4; the three ValueError last lines run one by one (Python 3.14.8, 2026-10-11) -->
  <defs>
    <marker id="ders2-conversion-bins-ah" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah" d="M0,0 L12,6 L0,12 z"/></marker>
    <marker id="ders2-conversion-bins-ahm" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah-m" d="M0,0 L12,6 L0,12 z"/></marker>
    <marker id="ders2-conversion-bins-aherr" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah-err" d="M0,0 L12,6 L0,12 z"/></marker>
