<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 1152 432" width="1152" height="432" role="img" aria-labelledby="ders2-char-ord-t ders2-char-ord-d">
  <title id="ders2-char-ord-t">ord(): karakterden sayıya, adım adım</title>
  <desc id="ders2-char-ord-d">Üstte Genel biçim: ord(&lt;karakter&gt;). Altında üç satır, her biri bir str kutusundan ord() etiketli okla bir int kutusuna gider. Başta yalnızca ilk satır: "A" (str, yeşil) 65 (int, turuncu). Bir tıklamayla ikinci satır: "a" 97, yanında küçük a başka bir karakter, başka bir sayı. Bir tıklamayla üçüncü satır: "B", okun ucunda gri kesik çizgili boş bir kutu ve yanında ord("B") ne verir? Son tıklamada kutuya 66 (int, turuncu) gelir, yanında: tabloda A'dan sonra B.</desc>
  <!-- source: ord("A") -&gt; 65, ord("a") -&gt; 97, ord("B") -&gt; 66 (Python 3.14.8, 2026-10-22). Build steps: 0 the a row; 1 the B question; 2 the answer 66 -->
  <defs>
    <marker id="ders2-char-ord-ah" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah" d="M0,0 L12,6 L0,12 z"/></marker>
    <marker id="ders2-char-ord-ahm" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah-m" d="M0,0 L12,6 L0,12 z"/></marker>
