<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 1152 512" width="1152" height="512" role="img" aria-labelledby="ders4-target-parts-t ders4-target-parts-d">
  <title id="ders4-target-parts-t">Ders 4'ün hedef programı: parçalar</title>
  <desc id="ders4-target-parts-d">Solda hedef programın anahtar satırları, gri bir panelde 18 satır, atlanan yerler üç noktayla: def coefficient(letter):, if letter == "A1":, return 4.00; def gpa(transcript):, for code, credits, letter in transcript:, total_points += credits * coefficient(letter), total_credits += credits, return total_points / total_credits; def ask_int(prompt):, while True:, try:, number = int(input(prompt)), return number, except ValueError:; en altta transcript.append((code, credits, letter)). Sağda dört köşeli parantez: coefficient için Ders 2: elif zinciri, her dalda return; gpa için 4A: tuple ile for, accumulator ve return; ask_int için 6. bölüm: try, except ve 9. bölüm: return; append satırı için 4A: append, yeni ders list'e girer. ask_int satırları açık mavi bantta, çivit mavisi çerçeveyle vurgulu.</desc>
  <!-- source: authoring/targets/target4.py (key lines; Python 3.14.8, 2026-10-13, run_targets.py): the full program and its run are in ders4.md S177; the run ends 5 ders, son ders BBM102 / AGNO: 3.12. -->
