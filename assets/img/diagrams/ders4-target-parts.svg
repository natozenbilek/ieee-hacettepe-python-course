  <text class="cd24 pre" x="16" y="23" xml:space="preserve">def coefficient(letter):</text>
  <text class="cd24 pre" x="16" y="51" xml:space="preserve">    if letter == <tspan class="t-str">"A1"</tspan>:</text>
  <text class="cd24 pre" x="16" y="79" xml:space="preserve">        return <tspan class="t-float">4.00</tspan></text>
  <text class="cd24 sub pre" x="16" y="107" xml:space="preserve">    …</text>
  <text class="cd24 pre" x="16" y="135" xml:space="preserve">def gpa(transcript):</text>
  <text class="cd24 sub pre" x="16" y="163" xml:space="preserve">    …</text>
  <text class="cd24 pre" x="16" y="191" xml:space="preserve">    for code, credits, letter in transcript:</text>
  <text class="cd24 pre" x="16" y="219" xml:space="preserve">        total_points += credits * coefficient(letter)</text>
  <text class="cd24 pre" x="16" y="247" xml:space="preserve">        total_credits += credits</text>
  <text class="cd24 pre" x="16" y="275" xml:space="preserve">    return total_points / total_credits</text>
  <text class="cd24 pre" x="16" y="303" xml:space="preserve">def ask_int(prompt):</text>
  <text class="cd24 pre" x="16" y="331" xml:space="preserve">    while True:</text>
  <text class="cd24 pre" x="16" y="359" xml:space="preserve">        try:</text>
  <text class="cd24 pre" x="16" y="387" xml:space="preserve">            number = int(input(prompt))</text>
  <text class="cd24 pre" x="16" y="415" xml:space="preserve">            return number</text>
  <text class="cd24 pre" x="16" y="443" xml:space="preserve">        except ValueError:</text>
  <text class="cd24 sub pre" x="16" y="471" xml:space="preserve">…</text>
  <text class="cd24 pre" x="16" y="499" xml:space="preserve">transcript.append((code, credits, letter))</text>
