<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 1152 300" width="1152" height="300" role="img" aria-labelledby="ders3-break-continue-t ders3-break-continue-d">
  <title id="ders3-break-continue-t">break ve continue: aynı kod, iki sonuç</title>
  <desc id="ders3-break-continue-d">Aynı for i in range(1, 6) kodu iki satırda, üstte continue ile, altta break ile. Sütun başlarında i = 1'den i = 5'e (sayılar turuncu, int). continue satırında 1, 3 ve 5. adımlarda şart False (deniz yeşili, bool) ve print(i) çalışıyor; 2. ve 4. adımlar gri çerçeveli, şart True ve continue. Sağdaki Çıktı kutusunda 1, 3, 5. break satırında 1. adımda şart False ve print(i); 2. adımda şart True ve break, bu kutu açık mavi, çivit mavisi çerçeveli şeritle vurgulu; 3, 4 ve 5. adımlar boş ve gri, altlarında loop bitti, hiç çalışmadı yazıyor. Sağdaki Çıktı kutusunda yalnızca 1.</desc>
  <!-- source: continue_odd -&gt; 1 / 3 / 5; break_even: for i in range(1, 6): if i % 2 == 0: break; print(i) -&gt; 1 (Python 3.14.8, 2026-10-11) -->
  <defs>
