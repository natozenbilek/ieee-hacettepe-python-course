  <title id="ders4-def-anatomy-t">def satırının parçaları</title>
  <desc id="ders4-def-anatomy-d">Solda üstte genel biçim: def &lt;isim&gt;(): ve indentation'lı &lt;gövde&gt;. Ortada iki satır kod: def draw_line(): ve indentation'lı print("-" * 20); "-" str (yeşil), 20 int (turuncu). Numaralı açıklamalar: 1 def, keyword; 2 draw_line, function'ın adı; 3 parantez; 4 iki nokta; 5 indentation'lı gövde: block. Gövde satırı açık mavi, çivit mavisi çerçeveli bantla vurgulu. Sağda draw_line yazan bir function kutusu: def bu object'i yapar.</desc>
