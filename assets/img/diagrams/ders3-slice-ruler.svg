<svg xmlns="http://www.w3.org/2000/svg" class="dg sr" viewBox="0 0 1152 270" width="1152" height="270" role="img" aria-labelledby="ders3-slice-ruler-t ders3-slice-ruler-d" data-focus="first">
  <title id="ders3-slice-ruler-t">Slicing: sınırlar 0'dan 6'ya</title>
  <desc id="ders3-slice-ruler-d">BBM101'in altı karakteri yeşil hücrelerde (str): B, B, M, 1, 0, 1. Numaralar hücrelerin değil, aralarındaki sınırların üstünde: 0'dan 6'ya yedi sınır, solda sınır etiketi. data-focus first durumu: BBM101'in sınırları 0'dan 6'ya numaralı; [0:3] parantezi ilk üç karakteri kapsıyor, sonuç "BBM" (str, yeşil). 0 ile 3 numaralı sınırlar arasındaki hücrelerin arkasında açık mavi bant, üstte çivit mavisi [0:3] parantezi; sağda code[0:3] okla "BBM" değer kutusuna gider, altında str. Cetvelin altında: bitiş dahil değil, range gibi. data-focus both durumu: [0:3] "BBM" ve [3:6] "101" parantezleri 3 numaralı sınırda buluşuyor (str, yeşil). Açık mavi bant 3, 4 ve 5 numaralı hücrelerin arkasına geçer; 3 numaralı sınırın çentiğinde çivit mavisi nokta ve üstte birinin bitişi, ötekinin başı notu; sağda ikinci satır code[3:6] okla "101" değer kutusuna gider. data-focus open durumu: Üç parantez: [:3] baştan 3'e "BBM", [3:] 3'ten sona "101", [:] hepsi "BBM101" (str, yeşil). [:3] parantezinin sol ucu 0'ın dışına açık, yanında baştan; [3:] parantezinin sağ ucu 6'nın dışına açık, yanında sona kadar; [:] iki ucu da açık. Vurgulu olan [3:]: çivit mavisi parantez ve 3, 4, 5 numaralı hücrelerin arkasında açık mavi bant. Sağda her parantezin satırında code[:3] okla "BBM", code[3:] okla "101", code[:] okla "BBM101".</desc>
  <!-- source: code = "BBM101"; code[0:3] is BBM, code[3:6] is 101, code[:3] BBM, code[3:] 101, code[:] BBM101 (Python 3.14.8, 2026-10-11). States by data-focus on the root: first (default), both, open. Height 270 instead of 260: the open state stacks three brackets above the border numbers. -->
