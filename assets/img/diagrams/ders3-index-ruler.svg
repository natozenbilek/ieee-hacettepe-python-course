<svg xmlns="http://www.w3.org/2000/svg" class="dg ir" viewBox="0 0 1152 300" width="1152" height="300" role="img" aria-labelledby="ders3-index-ruler-t ders3-index-ruler-d" data-state="plain">
  <title id="ders3-index-ruler-t">Index cetveli: code = "BBM101"</title>
  <desc id="ders3-index-ruler-d">Index cetveli, code = "BBM101". Solda code ismi (lacivert) bir okla altı hücreyi gösteriyor; hücrelerde B, B, M, 1, 0, 1 karakterleri, str olduğu için yeşil; sağ uçta str yazıyor. Hücrelerin üstünde 0'dan 5'e index'ler. Slayta göre altı hali var. plain: hiçbir şey vurgulu değil. read: 0, 2 ve 5 numaralı hücreler kalın çivit mavisi çerçeveli; altlarında code[0] 'B', code[2] 'M', code[5] '1' (str, yeşil). len: altı hücrenin altında çivit mavisi bir parantez, len(code) = 6, oktan sonra 6 (turuncu, int). last: aynı parantez, son hücre vurgulu, üstünde len(code) - 1 = 5, sonuç '1' (str, yeşil). negative: altta -6'dan -1'e negatif index satırı açık mavi şeritle vurgulu; 5, 4 ve 0 numaralı hücreler vurgulu; code[-1] '1', code[-2] '0', code[-6] 'B' (str, yeşil). slice-over: hücrelerin üstünde [0:100] parantezi son hücrenin sağ kenarında bitiyor, yanında 100'e kadar gitmez, sonda durur, sonuç "BBM101" (str, yeşil); sonda 6 numaralı kırmızı kesikli boş hücre, altında code[100] ve IndexError: string index out of range.</desc>
  <!-- source: code = "BBM101"; code[0], code[2], code[5] -&gt; B M 1; len(code), len("Hacettepe"), len("") -&gt; 6 9 0; len(code) - 1, code[len(code) - 1] -&gt; 5 1; code[-1], code[-2], code[-6] -&gt; 1 0 B; code[0:100], len(code[4:100]) -&gt; BBM101 2; code[100] -&gt; IndexError: string index out of range (Python 3.14.8, 2026-10-11). States (root data-state): plain S138, read S139, len S141, last S142, negative S144, slice-over S163 (ders3.md; the three search states were removed on 2026-10-13). -->
