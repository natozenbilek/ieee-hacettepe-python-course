<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 1152 300" width="1152" height="300" role="img" aria-labelledby="ders2-bool-paren-t ders2-bool-paren-d">
  <title id="ders2-bool-paren-t">Parantez and ile or'un sırasını değiştirir</title>
  <desc id="ders2-bool-paren-d">İki hesap ağacı. Solda True or False and False: önce and (1) False ile False'u birleştirir, sonuç False; sonra or (2) True ile bu False'u birleştirir, sonuç True. Çıktı: True. Sağda (True or False) and False: önce parantezdeki or (1) True ile False'u birleştirir, sonuç True; sonra and (2) bu True ile False'u birleştirir, sonuç False; bu sonuç açık mavi ve çivit mavisi çerçeveli bantta, çünkü parantez sonucu değiştirdi. Çıktı: False. Bütün value'lar bool, deniz yeşili.</desc>
  <!-- source: ders2-B.md S33; print(True or False and False) -> True; print((True or False) and False) -> False (Python 3.14.8, 2026-10-11) -->
