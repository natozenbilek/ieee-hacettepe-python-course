<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 1152 362" width="1152" height="362" role="img" aria-labelledby="w1a-python-timeline-t w1a-python-timeline-d">
  <title id="w1a-python-timeline-t">Python'un zaman çizelgesi, 1989-2026</title>
  <desc id="w1a-python-timeline-d">Ölçekli yatay zaman çizgisi, 1989'dan 2027'ye; 1990, 2000, 2010 ve 2020 işaretli. Aralık 1989'dan Şubat 1991'e: ilk sürüm 0.9.0. 3 Aralık 2008: Python 3.0, bugün kullandığımız Python 3. 7 Ekim 2025: Python 3.14.0. Çizgi şu satırla biter: 3.15.0 · 9 Ekim 2026, altında Bu slaytlar hazırlanırken çıktı. Kaynaklar: Python FAQ (docs.python.org); G. van Rossum, A Brief Timeline of Python (2009); PEP 790, Python 3.15 Release Schedule; python.org sürüm sayfaları (3.0, 3.14.0, 3.15.0).</desc>
  <!-- source: authoring/research/media.md bölüm 4 ve credits.json fact_sources (2026-10-04); 3.15.0: python.org/downloads/release/python-3150/ sayfasında "This is the stable release of Python 3.15.0", tarih Oct. 9, 2026 (2026-10-09'da kontrol edildi); PEP 790 (Python 3.15 Release Schedule) Actual bölümünde "3.15.0 final: Friday, 2026-10-09" (2026-10-10'da kontrol edildi). DECISIONS.md: çizgi "3.15.0 · 9 Ekim 2026" ile ve altındaki "Bu slaytlar hazırlanırken çıktı." satırıyla biter. -->
