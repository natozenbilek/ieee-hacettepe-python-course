<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 1152 400" width="1152" height="400" role="img" aria-labelledby="ders3-ifelse-blocks-t ders3-ifelse-blocks-d">
  <title id="ders3-ifelse-blocks-t">if ve else block'ları</title>
  <desc id="ders3-ifelse-blocks-d">Solda yedi satırlık kod: grade_point = 3.0, if grade_point &gt;= 1.75:, girintili print("geçti") ve print("tebrikler"), else:, girintili print("kaldı"), girintisiz print("dönem bitti"); 3.0 ve 1.75 hardal sarısı (float), metinler yeşil (str). Girintili satırların solunda PyCharm'daki gibi ince gri girinti çizgileri. Sağda köşeli ayraçlar: 3. ve 4. satır if block'u, 6. satır else block'u. 7. satırın sol kenarında kısa çivit mavisi bir çizgi; yanındaki etiket açık mavi, çivit mavisi çerçeveli kutuda: block'ların dışında: her zaman çalışır. En sağda Çıktı: geçti, tebrikler, dönem bitti.</desc>
