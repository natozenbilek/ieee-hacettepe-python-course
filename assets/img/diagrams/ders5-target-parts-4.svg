  <title id="ders5-target-parts-4-t">Ders 5'in hedef programı ve parçalarının geldiği dersler</title>
  <desc id="ders5-target-parts-4-d">Solda hedef programın on yedi anahtar satırı, atlanan yerler üç noktayla; her satırın sağında o satırı kuran dersler: GRADE_POINTS 5B, def weighted_points 4, latest_grade = {} 5B, try 3, with open("transcript.txt" 4, for line in f 3 ve 4, code, credits, grade = line.strip() 2 ve 5A, latest_grade[code] = (int(credits), 5A ve 5B, except FileNotFoundError 3 ve 4, with open("report.txt", "w" 4, for code, course in latest_grade.items() 5B, departments.add(code[:3]) 2 ve 5B, if grade is None 2 ve 4, total_points += weighted_points( 3 ve 4, report.write 2 ve 4, gpa = total_points / total_credits 1, print 2. Dosya satırları açık mavi bantta. Sağ sütunda her dersin getirdikleri: Ders 1 variable, aritmetik; Ders 2 f-string, strip(), if, [:3]; Ders 3 for, +=, try; Ders 4 function, None (bej), file, açık mavi ve çivit mavisi çerçeveli; Ders 5A list (vişneçürüğü), tuple (mavi-gri), split(); Ders 5B dict (kahverengi), set (zeytin yeşili). Sağ altta soru: Hangi satır yalnız Ders 1'le yazılırdı? Tıklayınca gpa = total_points / total_credits satırı ve yanındaki 1 çivit mavisi çerçeveye alınır.</desc>
