  <title id="ders5-coffee-index-t">Index: str'de karakter, list'te item</title>
  <desc id="ders5-coffee-index-d">Üstte drink ismi "latte" str'ini (yeşil) gösteriyor; karakterlerin üstünde index 0-4; sağda drink[0] bir okla "l"yi veriyor. Altta coffees ismi üç item'lık list'i (vişneçürüğü) gösteriyor; üstte index 0, 1, 2, altta negatif index -3, -2, -1; sağda coffees[0] "latte"yi, coffees[-1] "filtre"yi veriyor.</desc>
