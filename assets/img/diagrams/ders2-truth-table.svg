<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 1152 304" width="1152" height="304" role="img" aria-labelledby="ders2-truth-table-t ders2-truth-table-d" data-now="and">
  <title id="ders2-truth-table-t">Doğruluk tablosu: and, or, not</title>
  <desc id="ders2-truth-table-d">Doğruluk tablosu, beş sütun: a, b, a and b, a or b, not a. Dört satır: a True, b True: and True, or True, not a False. a True, b False: and False, or True, not a False. a False, b True: and False, or True, not a True. a False, b False: and False, or False, not a True. a ve b hücreleri bool (deniz yeşili); sonuçlarda True açık mavi zeminde petrol mavisi, False beyaz zeminde gri yazılır. Bu durumda a and b sütunu kalın çivit mavisi çerçeveyle vurgulu; a or b ve not a soluk, kesikli gri çerçeveli. (data-now="or": a or b sütunu vurgulu. data-now="not": not a sütunu vurgulu.)</desc>
  <!-- source: ders2-B.md S25, S27, S29; for a, b in (True, False) x (True, False): a and b, a or b, not a -> TT: T T F; TF: F T F; FT: F T T; FF: F F T (Python 3.14.8, 2026-10-11). States: data-now="and" (S25), "or" (S27), "not" (S29) -->
