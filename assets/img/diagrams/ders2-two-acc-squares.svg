  <text class="cd24" x="22" y="146">while i &lt;= <tspan class="t-int">3</tspan>:</text>
  <text class="cd24 pre" x="22" y="182" xml:space="preserve">    total += i</text>
  <text class="cd24 pre" x="22" y="218" xml:space="preserve">    squares += i * i</text>
