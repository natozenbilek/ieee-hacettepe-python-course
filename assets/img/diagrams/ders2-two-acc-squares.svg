<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 1152 320" width="1152" height="320" role="img" aria-labelledby="ders2-two-acc-squares-t ders2-two-acc-squares-d">
  <title id="ders2-two-acc-squares-t">İki accumulator: total ve squares</title>
  <desc id="ders2-two-acc-squares-d">Solda kod: i = 1, total = 0, squares = 0, while i &lt;= 3:, içeride total += i, squares += i * i ve i += 1, en sonda print(total, squares); total = 0 ve squares = 0 satırları bir köşeli çizgiyle loop'tan önce diye işaretli. Sağda tablo, sütunlar tur, i, total, squares. Başta: total 0, squares 0. Tur 1: i 1, total 1, squares 1. Tur 2: i 2, total 3, squares 5. Tur 3: i 3, total 6, squares 14. Sayılar int (turuncu). total ve squares sütunlarının her birinin kendi çivit mavisi çerçevesi var; iki ayrı accumulator. Son satır açık mavi ve çivit mavisi çerçeveli. Altta çıktı 6 14.</desc>
  <!-- source: ders2-B.md S81; passes (i, total, squares): 1 1 1, 2 3 5, 3 6 14; output 6 14 (Python 3.14.8, 2026-10-11) -->
