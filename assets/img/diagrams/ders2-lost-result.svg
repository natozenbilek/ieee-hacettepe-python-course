<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 368 300" width="368" height="300" role="img" aria-labelledby="ders2-lost-result-t ders2-lost-result-d">
  <title id="ders2-lost-result-t">int() tek başına: sonuç kayboluyor</title>
  <desc id="ders2-lost-result-d">3. satırdan sonraki memory. Lacivert credits ismi, okla "4" değerini (str, yeşil) gösteriyor. Altında soluk, gri çerçeveli bir 4 (int, turuncu) duruyor; ona hiçbir ok gitmiyor, yanında kimse saklamadı yazıyor: int(credits) bu değeri üretti ama hiçbir isme bağlanmadı. "4" değerinden aşağı inen ok credits * 2 ifadesini gösteriyor ve çıktı panelindeki 44'e gidiyor; 44 çivit mavisi çerçeveli açık mavi bir bandın içinde. credits ismi "4" değerini (str, yeşil) gösteriyor; soluk 4 (int, turuncu) hiçbir isme bağlı değil; çıktı 44.</desc>
  <!-- source: ders2-A.md S55: credits = input("Kredi: "); int(credits); print(credits * 2) with stdin 4 -> Kredi: 44 on a pipe (44 in the terminal); type(credits) str, int(credits) 4 int (Python 3.14.8, 2026-10-11) -->
  <defs>
    <marker id="ders2-lost-result-ah" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah" d="M0,0 L12,6 L0,12 z"/></marker>
