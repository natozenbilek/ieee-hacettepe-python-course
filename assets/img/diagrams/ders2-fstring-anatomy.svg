<svg xmlns="http://www.w3.org/2000/svg" class="dg fa" viewBox="0 0 1152 300" width="1152" height="300" role="img" aria-labelledby="ders2-fstring-anatomy-t ders2-fstring-anatomy-d" data-focus="anatomy">
  <title id="ders2-fstring-anatomy-t">f-string'in parçaları</title>
  <desc id="ders2-fstring-anatomy-d">data-focus anatomy durumu: gri bir kod panelinde print(f"Selam {name}") satırı; f"Selam ve kapanan tırnak str (yeşil). Numaralı işaretler: 1 f harfi, f-string; 2 Selam, olduğu gibi yazılır; 3 {name}, değeriyle değişir. {name} yuvası çivit mavisi çerçeveli açık mavi bir bantta. Altta lacivert name ismi okla "millet" değerini (str, yeşil) gösteriyor; o değerden yukarı, {name} yuvasına bir ok çıkıyor. Çıktı panelinde: Selam millet. data-focus expr durumu: satır print(f"Selam {name}, bugün {2 + 3} ders var.") olur; 4 numaralı işaret {2 + 3} yuvasını gösterir: ifade hesaplanır. 5 (int, turuncu) kutusundan {2 + 3} yuvasına bir ok çıkar ve bant bu yuvaya geçer. Çıktı: Selam millet, bugün 5 ders var.</desc>
  <!-- source: ders2-A.md S61 and S63: name = "millet"; print(f"Selam {name}") -> Selam millet; print(f"Selam {name}, bugün {2 + 3} ders var.") -> Selam millet, bugün 5 ders var. (Python 3.14.8, 2026-10-11). States by data-focus on the root: anatomy, expr. -->
