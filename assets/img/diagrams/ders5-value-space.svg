<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 1152 428" width="1152" height="428" role="img" aria-labelledby="ders5-value-space-t ders5-value-space-d">
  <title id="ders5-value-space-t">coefficient() function'ı ve aynı bilginin tablosu</title>
  <desc id="ders5-value-space-d">Solda Ders 4'teki coefficient() function'ı, kod paneli içinde: def coefficient(letter):, sonra if letter == "A1": return 4.00, elif letter == "A2": return 3.75, elif letter == "A3": return 3.50, üç nokta ile atlanan satırlar, elif letter == "D": return 1.75, else: return 0.00. Harfler str (yeşil), katsayılar float (hardal sarısı). Sağ kenarda bir köşeli ayraç: 11 dal, 23 satır. Sağda aynı bilgi on dört satırlık bir tablo, yan yana iki yarıda yedişer satır, başlıklar harf notu ve katsayı: A1 4.00; A2 3.75; A3 3.50; B1 3.25; B2 3.00; B3 2.75; C1 2.50; C2 2.25; C3 2.00; D 1.75; F1 0.00; F2 0.00; F3 0.00; F6 0.00. Harf notları str (yeşil), katsayılar float (hardal sarısı); tablo çivit mavisi çerçeveli. Kaynak: Hacettepe Ön Lisans ve Lisans Eğitim-Öğretim ve Sınav Yönetmeliği, Madde 24.</desc>
  <!-- source: ders4 coefficient(letter): 1 if + 9 elif + else = 11 dal, 23 satır; tablo GRADE_POINTS ile aynı 14 değer (Python 3.14.8, 2026-10-11); 2026-10-15 review: katsayılar kodla aynı yazılışta, ondalık noktayla -->
