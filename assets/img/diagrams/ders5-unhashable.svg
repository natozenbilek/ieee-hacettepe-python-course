<svg xmlns="http://www.w3.org/2000/svg" class="dg uh" viewBox="0 0 1152 300" width="1152" height="300" role="img" aria-labelledby="ders5-unhashable-t ders5-unhashable-d" data-state="dict">
  <title id="ders5-unhashable-t">list key olamaz, tuple olur</title>
  <desc id="ders5-unhashable-d">İki sütun. dict durumu: solda Geçersiz (kırmızı): attempts = {["BBM101", 2025]: "F3"}; ["BBM101", 2025] bir list (vişneçürüğü), kırmızı ok onu dict key'inin yerine götürmek ister ama yer kırmızı kesik çizgili ve boş kalır; altta kırmızı kutuda hatanın son satırı, iki satıra bölünmüş: TypeError: cannot use 'list' as a dict key (unhashable type: 'list'). Sağda Geçerli (petrol mavisi): attempts = {("BBM101", 2025): "F3"}; aynı bilgi bir tuple (mavi-gri) olarak dict'in (kahverengi) key'i olur, key hücresi çivit mavisi çerçeveli; value "F3" (str, yeşil); attempts[("BBM101", 2025)] çıktısı F3. set durumu: solda s = {["BBM", "MAT"]}; list (vişneçürüğü) set'in (zeytin yeşili) içindeki kırmızı kesik çizgili yere giremez; kırmızı kutuda TypeError: cannot use 'list' as a set element. Sağda s = {"BBM", "MAT"}; aynı değerler ayrı ayrı str (yeşil) olarak set'e (zeytin yeşili) girer; set çivit mavisi çerçeveli.</desc>
  <!-- source: S28 run listkey: attempts = {["BBM101", 2025]: "F3"} -> TypeError: cannot use 'list' as a dict key (unhashable type: 'list'); run tuplekey1: print(attempts[("BBM101", 2025)]) -> F3. S62 run set_listelem: s = {["BBM", "MAT"]} -> TypeError: cannot use 'list' as a set element (unhashable type: 'list'); s = {"BBM", "MAT"} has 2 elements (Python 3.14.8, 2026-10-11). States (root data-state): dict (S28), set (S62). 2026-10-15 review: the error box holds the whole last traceback line, wrapped after "as a" with a two-space hanging indent (Python prints it on one line). -->
  <defs>
    <marker id="ders5-unhashable-ah" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah" d="M0,0 L12,6 L0,12 z"/></marker>
