<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 1152 320" width="1152" height="320" role="img" aria-labelledby="ders5-newline-t ders5-newline-d" data-state="nl">
  <title id="ders5-newline-t">Satır sonu: \n</title>
  <desc id="ders5-newline-d">Birinci turda line on iki karakterdir, yan yana on iki hücrede: M, A, T, 1, 2, 3, noktalı virgül, 4, noktalı virgül, C, 1 ve sonunda \n (str, yeşil). \n hücresi çivit mavisi çerçevelidir ve altında satır sonu yazar. Sağda len(line) 12. Altta print(line) çıktısı: MAT123;4;C1, ardından açık mavi şeritle gösterilen bir boş satır. Sağdaki yazı ok ile boş satırı gösterir: \n ve print'in kendi satır sonu. print bir satır sonu daha ekler; bu yüzden boş satır çıkar.</desc>
  <!-- source: print(len(line)) -> 12 / 12; repr(line) -> 'MAT123;4;C1\n', 'FIZ127;3;B2\n' (runs read_len, read_repr; Python 3.14.8, 2026-10-11) -->
  <defs>
    <marker id="ders5-newline-ah" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah" d="M0,0 L12,6 L0,12 z"/></marker>
    <style>
