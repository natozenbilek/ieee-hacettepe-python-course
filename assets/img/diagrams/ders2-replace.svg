<svg xmlns="http://www.w3.org/2000/svg" class="dg rp" viewBox="0 0 1152 380" width="1152" height="380" role="img" aria-labelledby="ders2-replace-t ders2-replace-d" data-focus="replace">
  <title id="ders2-replace-t">replace(), float() ve count()</title>
  <desc id="ders2-replace-d">data-focus replace durumu (S77): 3,25 değeri dört yeşil kutuda (str, yeşil): 3, virgül, 2, 5; virgül kutusu kalın çivit mavisi çerçeveli. Ok replace(",", ".") kutusuna, oradan yeni "3.25" değerine gidiyor (str, yeşil); bu kutu açık mavi, çivit mavisi çerçeveli bir bandın içinde. Çıktı paneli: 3.25. data-focus float durumu (S78): ayrıca "3.25" kutusundan float() etiketli bir ok 3.25 değerine iniyor (float, hardal sarısı), oradan + 1 etiketli ok 4.25 değerine (float, hardal sarısı) gidiyor; bant 4.25 kutusunda. Çıktı paneli: 4.25. data-focus count durumu (S82): ilk iki satır gri ve soluk. BBM101 altı yeşil kutuda: B, B, M, 1, 0, 1; iki 1 kutusu kalın çivit mavisi çerçeveli. .count("1") etiketli ok 2 değerine gidiyor (int, turuncu), bant 2 kutusunda. Altında "Hacettepe" (str, yeşil) değerinden .count("e") etiketli ok 3 değerine (int, turuncu) gidiyor. Çıktı paneli: 2 ve 3.</desc>
  <!-- source: ders2-A.md S77: text = "3,25"; text.replace(",", ".") -> 3.25. S78: float(text.replace(",", ".")) + 1 -> 4.25. S82: "BBM101".count("1") -> 2; "Hacettepe".count("e") -> 3; type of count() result: int (Python 3.14.8, 2026-10-11) -->
  <defs>
    <marker id="ders2-replace-ah" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah" d="M0,0 L12,6 L0,12 z"/></marker>
