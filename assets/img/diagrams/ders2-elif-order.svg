<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 1152 460" width="1152" height="460" role="img" aria-labelledby="ders2-elif-order-t ders2-elif-order-d">
  <title id="ders2-elif-order-t">elif sırası: score = 92</title>
  <desc id="ders2-elif-order-d">İki sütun, ikisi de score = 92 (turuncu, int) için izlenmiş. Başta yalnızca iki kod paneli görünür; iki panelde de iki şart satırı (score &gt;= 50 ve score &gt;= 90) aynı açık mavi bantta, yerleri değişmiş; ilk tıklamada soldaki akış ve çıktısı, ikinci tıklamada sağdaki akış ve çıktısı çıkar. Akışlar kodun altında: True oku baklavanın sağından çıkar, False oku aşağı iner. Solda Yanlış sıra: kod score = 92, if score &gt;= 50: print("D"), elif score &gt;= 90: print("A2"). score &gt;= 50 baklavasından petrol mavisi True oku sağdaki print("D") kutusuna gider, kutu açık mavi ve çivit mavisi çerçeveli; gri False oku aşağıdaki score &gt;= 90 baklavasına iner; o baklava ve sağındaki print("A2") gri, altında hiç sınanmadı. Kodun sağında Çıktı: D ve kırmızı çerçeveli kutuda kırmızı: ilk True kazanır: 92 için D. Sağda Doğru sıra: iki şart yer değiştirmiş; score &gt;= 90 baklavasından True oku print("A2") kutusuna gider (vurgulu); score &gt;= 50 baklavası ve print("D") gri, hiç sınanmadı. Çıktı: A2.</desc>
  <!-- source: elif_wrong: score = 92 -&gt; D; elif_right -&gt; A2; 92 &gt;= 50 True, 92 &gt;= 90 True (Python 3.14.8, 2026-10-22). Condition lines banded in both panels; True right, False down (2026-10-22, last small fixes). Build steps: start code panels; 0 wrong order; 1 right order -->
