<svg xmlns="http://www.w3.org/2000/svg" class="dg ap" viewBox="0 0 1152 184" width="1152" height="184" role="img" aria-labelledby="ders5-append-runs-t ders5-append-runs-d" data-mode="w">
  <title id="ders5-append-runs-t">"w" ve "a" ile iki çalıştırma</title>
  <desc id="ders5-append-runs-d">İki durum. Durum w: "w" satırında log.txt 1. çalıştırmadan sonra tek satır spam, 2. çalıştırmadan sonra yine tek satır spam (str, yeşil); ikinci dosya açık mavi zeminde, çivit mavisi çerçeveli; 2. çalıştırmanın çıktısı spam. Alttaki "a" satırının yeri boş. Durum a: alttaki "a" satırında log.txt önce bir satır spam, 2. çalıştırmadan sonra iki satır spam, spam (str, yeşil); ikinci dosya açık mavi; çıktı spam, spam. Üstteki "w" satırı gri.</desc>
  <!-- source: ders5-B S13 (run w_twice): iki çalıştırmada da log.txt 'spam\n', çıktı spam; S15 (run a_three): log.txt 'spam\n', sonra 'spam\nspam\n', çıktı spam / spam (Python 3.14.8, 2026-10-11) -->
  <defs>
    <marker id="ders5-append-runs-ah" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah" d="M0,0 L12,6 L0,12 z"/></marker>
