  <title id="ders4-none-uses-t">None'ın iki kaynağı: is None ve return'süz function</title>
  <desc id="ders4-none-uses-d">Durum one: İki panel; birincisi açık mavi, çivit mavisi çerçeveli bantla vurgulu. is None: lacivert market_value etiketi None'ı (NoneType, bej) gösteriyor; is None True, == 0 False (bool, deniz yeşili). İkinci panelin yeri boş (o konu birkaç slayt sonra geliyor). Durum two: İkinci panel vurgulu, return'süz function: greet() kutusundan petrol mavisi dönen oku None'a (NoneType, bej) gidiyor; lacivert s etiketi aynı None'ı gösteriyor; Çıktı: Afiyet olsun, None. Birinci panel gri.</desc>
  <!-- source: S79 run s10_isnone: True / False; S83 run s10_noreturn: Afiyet olsun / None (Python 3.14.8, 2026-10-10); 2026-10-15 review: state one hides panel 2 (visibility, its place kept) -->
