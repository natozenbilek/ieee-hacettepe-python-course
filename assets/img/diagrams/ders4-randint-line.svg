<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 1152 360" width="1152" height="360" role="img" aria-labelledby="ders4-randint-line-t ders4-randint-line-d">
  <title id="ders4-randint-line-t">randint(1, 6) ve range(1, 6)</title>
  <desc id="ders4-randint-line-d">Üstte kod: import random, die = random.randint(1, 6), print(die &gt;= 1 and die &lt;= 6); yanında Çıktı: True. Altta iki sayı doğrusu, 0'dan 7'ye. random.randint(1, 6) için 1, 2, 3, 4, 5 ve 6'da dolu noktalar; 6'daki nokta açık mavi, çivit mavisi çerçeveli bantla vurgulu, üstünde 6 da gelir. range(1, 6) için 1'den 5'e dolu noktalar, 6'da içi boş çivit mavisi halka, üstünde 6 yok. Dolu noktalar ve sayıları int (turuncu).</desc>
  <!-- source: S13; run s6_randint -&gt; True; instructor run s6_randint_all: 10 000 draws give [1, 2, 3, 4, 5, 6], list(range(1, 6)) gives [1, 2, 3, 4, 5] (Python 3.14.8, 2026-10-10) -->
