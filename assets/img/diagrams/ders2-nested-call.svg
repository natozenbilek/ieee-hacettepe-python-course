<svg xmlns="http://www.w3.org/2000/svg" class="dg nc" viewBox="0 0 1152 340" width="1152" height="340" role="img" aria-labelledby="ders2-nested-call-t ders2-nested-call-d" data-focus="int">
  <title id="ders2-nested-call-t">input() ve int(): içten dışa</title>
  <desc id="ders2-nested-call-d">İç içe çağrının içten dışa çalışması. data-focus int durumu: üstte credits = int(input("Kredi: ")) satırı ve altında köşeli ayraçlar, üç numaralı adım. 1: input("Kredi: ") kısmının üstünde, "4" verir yazısı ve "4" (str, yeşil). 2: int(...) kısmının altında 4 (int, turuncu), yanında 4 verir; bu kutu açık mavi, çivit mavisi çerçeveli bir bantta. 3: credits = kısmının altında lacivert credits isim etiketi, oku 4 (int, turuncu) kutusunu gösterir. Altta print(credits * 2) satırı ve Çıktı panelinde Kredi: 4 (4 petrol mavisi, kullanıcının yazdığı) ve 8. data-focus float durumu aynı düzende: coefficient = float(input("Katsayı: ")); 1: "2.5" (str, yeşil); 2: 2.5 (float, hardal sarısı) bantta; 3: lacivert coefficient etiketi 2.5'i gösterir; altta print(coefficient * 4), Çıktı: Katsayı: 2.5 ve 10.0.</desc>
  <!-- source: ders2-A.md S52 and S54, stdin 4 and 2.5: credits = int(input("Kredi: ")); print(credits * 2) -&gt; 'Kredi: ' then 8; coefficient = float(input("Katsayı: ")); print(coefficient * 4) -&gt; 'Katsayı: ' then 10.0 (Python 3.14.8, 2026-10-11) -->
