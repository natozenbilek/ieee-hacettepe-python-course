<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 560 400" width="560" height="400" role="img" aria-labelledby="ders2-vancouver-index-t ders2-vancouver-index-d">
  <title id="ders2-vancouver-index-t">Vancouver Borsası endeksi, 1982-1983</title>
  <desc id="ders2-vancouver-index-d">Dikey çubuk grafik, Vancouver Borsası endeksi, değer ekseni 0'dan 1200'e, 200'er aralıkla. Ocak 1982, başlangıç: 1000 (gri çubuk). 25 Kasım 1983, kesilerek: 524,811 (gri çubuk). 28 Kasım 1983, doğru hesap: 1098,892 (çivit mavisi çubuk). Üstteki not: her hesapta üçüncü ondalık basamaktan sonrası atıldı. Kaynak: Wall Street Journal, 8 Kasım 1983; Toronto Star, 29 Kasım 1983.</desc>
  <!-- source: authoring/data/connections.json W2A-6 (1000 in Jan 1982; 524,811 at the close of Fri 25 Nov 1983; 1098,892 on Mon 28 Nov 1983); bar height = value x 190/1200 px -->
