<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 1152 400" width="1152" height="400" role="img" aria-labelledby="ders1-reassign-film-t ders1-reassign-film-d">
  <title id="ders1-reassign-film-t">Reassignment adım adım: a = 4, b = a, a = a + 3</title>
  <desc id="ders1-reassign-film-d">Üç karelik film şeridi. Solda kod: a = 4 (# 1), b = a (# 2), a = a + 3 (# 3), print(a, b); altında çıktı: 7 4. Kare 1, a = 4 satırından sonra: lacivert a etiketinden çıkan ok 4 değerini (int, turuncu) gösteriyor; 4'ün kutusu çivit mavisi çerçeveli açık mavi bir şeridin içinde, çünkü yeni. Kare 2, b = a satırından sonra: a ve b aynı 4'ü (int, turuncu) gösteriyor; ikinci bir 4 yok. b'den 4'e giden yeni ok açık mavi şeridin üzerinde. Kare 3, a = a + 3 satırından sonra: a, yeni 7 değerini (int, turuncu) gösteriyor; 7'nin kutusu açık mavi şeridin içinde. a'dan 4'e giden eski ok gri ve kesikli; b yine 4'ü gösteriyor. Değerler kareler boyunca yerini değiştirmez: 7 üstte a'nın satırında, 4 altta b'nin satırında. Alttaki açıklama: kare n, # n satırı çalıştıktan sonraki durumdur; düz ok şu anki bağ, kesikli gri ok eski bağ, çivit mavisi çerçeveli açık mavi şerit bu adımda değişen.</desc>
  <!-- source: a = 4  # 1 / b = a  # 2 / a = a + 3  # 3 / print(a, b) -> 7 4; a is b: True after # 2, False after # 3 (Python 3.14.8, 2026-10-11) -->
