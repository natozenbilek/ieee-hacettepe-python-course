  <title id="ders4-ballon-dor-t">Messi'nin Ballon d'Or yılları bir list olarak</title>
  <desc id="ders4-ballon-dor-d">Durum len: ballon_dor ismi (lacivert) sekiz int'lik (turuncu) bir list'i (vişneçürüğü) gösteriyor: 2009, 2010, 2011, 2012, 2015, 2019, 2021, 2023; sekiz hücre çivit mavisi çerçeveyle vurgulu, altında köşeli çizgi ve 8 item. Durum ends: Aynı list; üstte 0'dan 7'ye, altta -8'den -1'e index'ler; son hücre 2023 çivit mavisi çerçeveyle vurgulu, index'i 7 ve -1; solda Son index 8 - 1 = 7. Durum slice: Aynı list; hücre sınırlarında 0'dan 8'e numaralar; 2009, 2010, 2011 ve 2012 açık mavi bantta, altında köşeli çizgi ve ballon_dor[0:4]; 4 numaralı sınır çivit mavisi halkayla vurgulu, oradan inen çizginin yanında bitiş, dahil değil.</desc>
  <!-- source: S18-S20, ballon_dor = [2009, 2010, 2011, 2012, 2015, 2019, 2021, 2023]; len(ballon_dor) -> 8; len("2009") -> 4; ballon_dor[0], ballon_dor[-1] -> 2009 2023; ballon_dor[7] -> 2023; ballon_dor[0:4] -> [2009, 2010, 2011, 2012]; ballon_dor[0:3] -> [2009, 2010, 2011] (Python 3.14.8, 2026-10-11). States: len (S18), ends (S19), slice (S20). -->
