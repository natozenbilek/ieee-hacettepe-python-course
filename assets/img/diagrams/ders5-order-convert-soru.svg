  <title id="ders5-order-convert-soru-t">split()'in parçaları str: önce soru</title>
  <desc id="ders5-order-convert-soru-d">Solda kod: parts = "latte 85".split(), print(parts[1] * 2), print(int(parts[1]) * 2). Altında parts ismi ['latte', '85'] list'ini gösteriyor; hücrelerin üstünde parts[0] ve parts[1]. Sağda soru: parts[1] * 2 ne verir, 170 mi, '8585' mi? Birinci tıklamada parts[1] * 2 bir okla '8585'i veriyor, tekrar; altta: İki latte 8585 lira etmez: str yan yana tekrarlanır. İkinci tıklamada int(parts[1]) * 2 170'i veriyor (int, açık mavi bant) ve altta: split()'in parçaları str'dir; sayı için int() gerekir.</desc>
