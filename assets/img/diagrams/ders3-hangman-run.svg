<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 1152 420" width="1152" height="420" role="img" aria-labelledby="ders3-hangman-run-t ders3-hangman-run-d">
  <title id="ders3-hangman-run-t">Adam asmaca: bir oyun turu</title>
  <desc id="ders3-hangman-run-d">Adam asmaca oyununun Run penceresinden bir bölüm: ee yazılınca 'Tek bir harf yazın.' (vurgulu), t yazılınca 'Var, 2 tane.'; sonunda h a c e t t e p e ve tebrik. Sağda oyunu kuran parçalar: while True, break, continue, len, for, in. Soldaki Çıktı panelinde alt alta: _ a _ e _ _ e _ e; Harf (5 hak): ee; Tek bir harf yazın.; _ a _ e _ _ e _ e; Harf (5 hak): t; Var, 2 tane.; _ a _ e t t e _ e; üç nokta; h a c e t t e p e; Tebrikler, kelimeyi buldunuz. Yazılan ee ve t altı çizili; Tek bir harf yazın. satırı açık mavi bantta. Sağdaki tabloda altı satır: while True oyun sürer, break oyun biter, continue geçersiz harf, len(letter) tek harf mi?, for ch in secret tahtayı kurar, in harf var mı?. İnce çizgiler Tek bir harf yazın. satırını continue satırına, _ a _ e t t e _ e tahtasını for ch in secret satırına bağlar.</desc>
  <!-- source: fun.json D3-PROJE-2, hangman_win, stdin e a k ee t e h c p; output lines 10-16 and the last two lines (Python 3.14.8, 2026-10-11); hangman_lose ends with Hakkınız bitti. Kelime: hacettepe -->
