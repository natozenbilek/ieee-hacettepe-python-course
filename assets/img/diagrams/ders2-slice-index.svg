<svg xmlns="http://www.w3.org/2000/svg" class="dg sli" viewBox="0 0 1152 488" width="1152" height="488" role="img" aria-labelledby="ders2-slice-index-t ders2-slice-index-d">
  <title id="ders2-slice-index-t">Index sınırı aşınca hata, slice sonda durur</title>
  <desc id="ders2-slice-index-d">Üstte soru: code[10] ve code[0:10]: hangisi hata verir? Sağ üstte kod: code = "MAT101". Lacivert code isim etiketi altı yeşil hücreyi gösteriyor (str): M, A, T, 1, 0, 1; üstlerinde 0'dan 5'e index'ler. Birinci tıklama: sağda, üç noktadan sonra kırmızı kesik çizgili boş bir hücre, üstünde kırmızı 10; altta code[10] satırından kırmızı ok ve kırmızıyla IndexError: string index out of range. İkinci tıklama: hücrelerin üstünde çivit mavisi bir parantez son hücrede bitiyor, oradan 10'a kadar gri kesik bir çizgi; altta code[0:10] satırından ok "MAT101" kutusuna (str, yeşil), kutu açık mavi, çivit mavisi çerçeveli bir bantta; yanında sonda durur, hata yok. Üçüncü tıklama, altta büyük yazıyla iki satır: Sınırı aşan index hata verir; sınırı aşan slice sonda durur.</desc>
  <!-- source: ders2.md S365. code = "MAT101"; code[10] -&gt; IndexError: string index out of range; code[0:10] -&gt; MAT101. Build steps: 0 code[10]; 1 code[0:10]; 2 the rule (fix pass 2026-10-24: the question on the slide from the start) (Python 3.14.8, 2026-10-23). Built by authoring/builder-paralel/ders2-index.py. -->
